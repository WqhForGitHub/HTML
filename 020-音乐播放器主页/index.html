<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="云音乐 - 在线音乐播放器" />
    <title>云音乐 · 在线播放器</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      :root {
        --primary: #1db954;
        --primary-dark: #1aa34a;
        --bg: #000;
        --bg-soft: #121212;
        --bg-card: #181818;
        --bg-hover: #282828;
        --border: #2a2a2a;
        --text: #fff;
        --muted: #b3b3b3;
        --muted-dark: #727272;
      }
      body {
        font-family: -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        background: var(--bg);
        color: var(--text);
        height: 100vh;
        overflow: hidden;
        display: grid;
        grid-template-rows: 60px 1fr 90px;
      }
      a {
        text-decoration: none;
        color: inherit;
      }
      button {
        font-family: inherit;
        border: none;
        background: none;
        cursor: pointer;
        color: inherit;
      }
      ul {
        list-style: none;
      }

      /* Top bar */
      .topbar {
        background: var(--bg);
        display: flex;
        align-items: center;
        padding: 0 24px;
        gap: 20px;
        border-bottom: 1px solid var(--border);
      }
      .topbar .nav-arrows {
        display: flex;
        gap: 8px;
      }
      .nav-btn {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: rgba(0, 0, 0, 0.7);
        color: var(--muted);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
        transition: 0.2s;
      }
      .nav-btn:hover {
        color: var(--text);
        background: var(--bg-hover);
      }
      .search-bar {
        flex: 1;
        max-width: 400px;
        background: var(--bg-soft);
        border-radius: 20px;
        padding: 8px 16px;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .search-bar input {
        flex: 1;
        background: none;
        border: none;
        outline: none;
        color: var(--text);
        font-size: 14px;
      }
      .search-bar input::placeholder {
        color: var(--muted-dark);
      }
      .topbar .user {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-left: auto;
      }
      .user-avatar {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: var(--primary);
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 14px;
        color: #000;
      }
      .premium-btn {
        padding: 6px 14px;
        background: #fff;
        color: #000;
        border-radius: 20px;
        font-size: 12px;
        font-weight: 700;
      }

      /* Main layout */
      .main {
        display: grid;
        grid-template-columns: 240px 1fr;
        overflow: hidden;
      }

      /* Sidebar */
      .sidebar {
        background: #000;
        padding: 20px 0;
        display: flex;
        flex-direction: column;
        overflow-y: auto;
      }
      .sidebar::-webkit-scrollbar {
        width: 8px;
      }
      .sidebar::-webkit-scrollbar-thumb {
        background: #333;
        border-radius: 4px;
      }
      .side-section {
        padding: 0 12px;
        margin-bottom: 20px;
      }
      .side-title {
        font-size: 12px;
        color: var(--muted-dark);
        text-transform: uppercase;
        letter-spacing: 1px;
        padding: 0 12px 10px;
        font-weight: 700;
      }
      .side-link {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 10px 12px;
        border-radius: 6px;
        color: var(--muted);
        font-size: 14px;
        font-weight: 600;
        transition: 0.1s;
        cursor: pointer;
      }
      .side-link:hover {
        color: var(--text);
        background: var(--bg-hover);
      }
      .side-link.active {
        color: var(--text);
      }
      .side-link .icon {
        font-size: 18px;
        width: 24px;
        text-align: center;
      }

      /* Playlist */
      .playlist-wrap {
        background: linear-gradient(180deg, #2d1b4e 0%, var(--bg-soft) 280px);
        overflow-y: auto;
      }
      .playlist-wrap::-webkit-scrollbar {
        width: 12px;
      }
      .playlist-wrap::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.2);
        border-radius: 6px;
        border: 3px solid var(--bg-soft);
      }
      .pl-header {
        padding: 24px 32px;
        display: flex;
        align-items: flex-end;
        gap: 24px;
      }
      .pl-cover {
        width: 200px;
        height: 200px;
        border-radius: 8px;
        object-fit: cover;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      }
      .pl-info {
        flex: 1;
        padding-bottom: 16px;
      }
      .pl-info .label {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 1px;
        font-weight: 700;
        margin-bottom: 8px;
      }
      .pl-info h1 {
        font-size: 48px;
        font-weight: 800;
        margin-bottom: 12px;
        line-height: 1.1;
      }
      .pl-info .desc {
        font-size: 14px;
        color: var(--muted);
        margin-bottom: 8px;
      }
      .pl-info .meta {
        font-size: 13px;
        color: var(--muted-dark);
      }

      .pl-controls {
        padding: 16px 32px;
        display: flex;
        align-items: center;
        gap: 20px;
      }
      .play-btn {
        width: 56px;
        height: 56px;
        border-radius: 50%;
        background: var(--primary);
        color: #000;
        font-size: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: 0.2s;
      }
      .play-btn:hover {
        transform: scale(1.06);
        background: var(--primary-dark);
      }
      .ctrl-icon {
        width: 36px;
        height: 36px;
        color: var(--muted);
        font-size: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .ctrl-icon:hover {
        color: var(--text);
      }

      .tracklist {
        padding: 8px 0 32px;
      }
      .track-head {
        display: grid;
        grid-template-columns: 40px 1fr 200px 1fr 60px;
        gap: 16px;
        padding: 8px 32px;
        color: var(--muted-dark);
        font-size: 12px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .track {
        display: grid;
        grid-template-columns: 40px 1fr 200px 1fr 60px;
        gap: 16px;
        padding: 10px 32px;
        border-radius: 4px;
        align-items: center;
        cursor: pointer;
        transition: 0.1s;
      }
      .track:hover {
        background: rgba(255, 255, 255, 0.1);
      }
      .track.playing {
        background: rgba(29, 185, 84, 0.15);
      }
      .track.playing .title {
        color: var(--primary);
      }
      .track-num {
        color: var(--muted);
        font-size: 14px;
        text-align: center;
      }
      .track.playing .track-num {
        color: var(--primary);
      }
      .track-info {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
      }
      .track-thumb {
        width: 40px;
        height: 40px;
        border-radius: 4px;
        object-fit: cover;
        flex-shrink: 0;
      }
      .track-text {
        min-width: 0;
      }
      .track .title {
        font-size: 15px;
        font-weight: 500;
        color: var(--text);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .track .artist {
        font-size: 13px;
        color: var(--muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .track .album {
        font-size: 14px;
        color: var(--muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .track .date {
        font-size: 14px;
        color: var(--muted);
      }
      .track .duration {
        font-size: 14px;
        color: var(--muted);
        text-align: right;
      }

      /* Player bar */
      .player {
        background: var(--bg-soft);
        border-top: 1px solid var(--border);
        display: grid;
        grid-template-columns: 280px 1fr 280px;
        align-items: center;
        padding: 0 24px;
        gap: 20px;
      }
      .now-playing {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
      }
      .now-playing img {
        width: 56px;
        height: 56px;
        border-radius: 4px;
        object-fit: cover;
      }
      .np-info {
        min-width: 0;
      }
      .np-info .title {
        font-size: 14px;
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .np-info .artist {
        font-size: 12px;
        color: var(--muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .np-like {
        color: var(--muted);
        font-size: 18px;
        margin-left: 8px;
        cursor: pointer;
        transition: 0.2s;
      }
      .np-like:hover {
        color: var(--text);
      }

      .player-center {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
      }
      .player-btns {
        display: flex;
        align-items: center;
        gap: 20px;
      }
      .pbtn {
        color: var(--muted);
        font-size: 18px;
        transition: 0.15s;
      }
      .pbtn:hover {
        color: var(--text);
      }
      .pbtn.play {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: #fff;
        color: #000;
        font-size: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .pbtn.play:hover {
        transform: scale(1.08);
      }
      .progress-row {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        max-width: 560px;
      }
      .time {
        font-size: 11px;
        color: var(--muted);
        min-width: 38px;
      }
      .progress-bar {
        flex: 1;
        height: 4px;
        background: #4d4d4d;
        border-radius: 2px;
        cursor: pointer;
        position: relative;
        overflow: hidden;
      }
      .progress-fill {
        height: 100%;
        background: var(--primary);
        border-radius: 2px;
        width: 0;
        transition: width 0.1s linear;
        position: relative;
      }
      .progress-fill::after {
        content: '';
        position: absolute;
        right: -6px;
        top: 50%;
        transform: translateY(-50%);
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #fff;
        opacity: 0;
        transition: 0.2s;
      }
      .progress-bar:hover .progress-fill {
        background: var(--primary);
      }
      .progress-bar:hover .progress-fill::after {
        opacity: 1;
      }

      .player-right {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 14px;
      }
      .vol-bar {
        width: 100px;
        height: 4px;
        background: #4d4d4d;
        border-radius: 2px;
        cursor: pointer;
        position: relative;
      }
      .vol-fill {
        height: 100%;
        background: #fff;
        border-radius: 2px;
        width: 70%;
      }

      /* Equalizer animation */
      .eq {
        display: inline-flex;
        gap: 2px;
        align-items: flex-end;
        height: 14px;
      }
      .eq span {
        width: 3px;
        background: var(--primary);
        animation: eq 1s infinite ease-in-out;
      }
      .eq span:nth-child(1) {
        animation-delay: 0s;
        height: 60%;
      }
      .eq span:nth-child(2) {
        animation-delay: 0.2s;
        height: 100%;
      }
      .eq span:nth-child(3) {
        animation-delay: 0.4s;
        height: 40%;
      }
      @keyframes eq {
        0%,
        100% {
          height: 30%;
        }
        50% {
          height: 100%;
        }
      }

      @media (max-width: 768px) {
        body {
          grid-template-rows: 60px 1fr 80px;
        }
        .main {
          grid-template-columns: 1fr;
        }
        .sidebar {
          display: none;
        }
        .player {
          grid-template-columns: 1fr auto;
        }
        .player-right {
          display: none;
        }
        .pl-header {
          flex-direction: column;
          align-items: center;
          text-align: center;
        }
        .pl-info h1 {
          font-size: 28px;
        }
        .track-head {
          display: none;
        }
        .track {
          grid-template-columns: 40px 1fr 60px;
        }
        .track .album,
        .track .date {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="topbar">

    <div class="main">

          </div>
        </div>
      </aside>

      <div class="playlist-wrap">
        <div class="pl-header">
          <img class="pl-cover" src="https://picsum.photos/seed/playlist/300/300" alt="封面" />
          <div class="pl-info">
            <div class="label">播放列表</div>

            <p class="desc">精选当下最热华语单曲，陪你度过每一天。从治愈民谣到燃情摇滚，应有尽有。</p>

        <div class="pl-controls">

          <div class="track-head">
            <span style="text-align: center">#</span>

          </div>

    <div class="player">
      <div class="now-playing">
        <img id="npCover" src="https://picsum.photos/seed/song1/100/100" alt="封面" />
        <div class="np-info">
          <div class="title" id="npTitle">星海漫游</div>
          <div class="artist" id="npArtist">林夜空</div>
        </div>

      </div>

      <div class="player-center">
        <div class="player-btns">
          <button class="pbtn" id="shuffleBtn" title="随机">🔀</button>
          <button class="pbtn" id="prevBtn" title="上一首">⏮</button>
          <button class="pbtn play" id="playBtn" title="播放">▶</button>
          <button class="pbtn" id="nextBtn" title="下一首">⏭</button>
          <button class="pbtn" id="repeatBtn" title="循环">🔁</button>
        </div>
        <div class="progress-row">
          <span class="time" id="curTime">0:00</span>
          <div class="progress-bar" id="progressBar">
            <div class="progress-fill" id="progressFill"></div>

        <button class="pbtn">🎤</button>
        <button class="pbtn">📋</button>
        <button class="pbtn">🖥️</button>

        <div class="vol-bar" id="volBar"><div class="vol-fill" id="volFill"></div></div>
      </div>

    <script>
      const songs = [
        { title: '星海漫游', artist: '林夜空', album: '宇宙之诗', duration: '3:42', cover: 'song1' },
        { title: '夏日微风', artist: '陈阳光', album: '海岸线', duration: '4:15', cover: 'song2' },
        { title: '夜色温柔', artist: '苏晚安', album: '城市夜行人', duration: '3:28', cover: 'song3' },
        { title: '追梦赤子心', artist: '乐队风暴', album: '燃烧的青春', duration: '4:02', cover: 'song4' },
        { title: '雨后彩虹', artist: '小雨点', album: '晴朗的日子', duration: '3:55', cover: 'song5' },
        { title: '时光胶囊', artist: '老唱片', album: '回忆收容所', duration: '4:30', cover: 'song6' },
        { title: '电子羊', artist: '赛博梦', album: '霓虹未来', duration: '3:18', cover: 'song7' },
        { title: '山野牧歌', artist: '风之子', album: '远方', duration: '4:48', cover: 'song8' },
        { title: '蓝色忧郁', artist: '蓝调先生', album: '午夜爵士', duration: '3:36', cover: 'song9' },
        { title: '飞翔', artist: '翅膀乐队', album: '天空之城', duration: '4:11', cover: 'song10' },
        { title: '家乡的味道', artist: '思乡客', album: '故乡', duration: '3:50', cover: 'song11' },
        { title: '最后告白', artist: '终结者', album: '终章', duration: '4:25', cover: 'song12' },
      ];

      let currentIdx = 0;
      let isPlaying = false;
      let progress = 0;
      let timer = null;

      const trackList = document.getElementById('trackList');
      const playBtn = document.getElementById('playBtn');
      const bigPlay = document.getElementById('bigPlay');
      const prevBtn = document.getElementById('prevBtn');
      const nextBtn = document.getElementById('nextBtn');
      const npTitle = document.getElementById('npTitle');
      const npArtist = document.getElementById('npArtist');
      const npCover = document.getElementById('npCover');
      const progressFill = document.getElementById('progressFill');
      const progressBar = document.getElementById('progressBar');
      const curTime = document.getElementById('curTime');
      const totTime = document.getElementById('totTime');

      function parseDuration(str) {
        const [m, s] = str.split(':').map(Number);
        return m * 60 + s;
      }
      function formatTime(sec) {
        const m = Math.floor(sec / 60);
        const s = Math.floor(sec % 60);
        return m + ':' + (s < 10 ? '0' : '') + s;
      }

      function renderTracks() {
        trackList.innerHTML = '';
        songs.forEach((song, idx) => {
          const li = document.createElement('li');
          li.className = 'track' + (idx === currentIdx ? ' playing' : '');
          li.innerHTML = `
        <span class="track-num">${idx === currentIdx && isPlaying ? '<div class="eq"><span></span><span></span><span></span></div>' : idx + 1}</span>
        <div class="track-info">
          <img class="track-thumb" src="https://picsum.photos/seed/${song.cover}/80/80" alt="封面">
          <div class="track-text">
            <div class="title">${song.title}</div>
            <div class="artist">${song.artist}</div>
          </div>
        </div>
        <span class="album">${song.album}</span>
        <span class="date">2026年7月</span>
        <span class="duration">${song.duration}</span>
      `;
          li.addEventListener('click', () => playTrack(idx));
          trackList.appendChild(li);
        });
      }

      function playTrack(idx) {
        currentIdx = idx;
        const song = songs[idx];
        npTitle.textContent = song.title;
        npArtist.textContent = song.artist;
        npCover.src = `https://picsum.photos/seed/${song.cover}/100/100`;
        totTime.textContent = song.duration;
        progress = 0;
        isPlaying = true;
        updateUI();
        startProgress();
      }

      function togglePlay() {
        isPlaying = !isPlaying;
        if (isPlaying) {
          startProgress();
        } else {
          clearInterval(timer);
        }
        updateUI();
      }

      function startProgress() {
        clearInterval(timer);
        const total = parseDuration(songs[currentIdx].duration);
        timer = setInterval(() => {
          progress += 0.5;
          if (progress >= total) {
            progress = 0;
            nextTrack();
          } else {
            updateProgress(total);
          }
        }, 500);
      }

      function updateProgress(total) {
        const pct = (progress / total) * 100;
        progressFill.style.width = pct + '%';
        curTime.textContent = formatTime(progress);
      }

      function updateUI() {
        playBtn.textContent = isPlaying ? '⏸' : '▶';
        bigPlay.textContent = isPlaying ? '⏸' : '▶';
        renderTracks();
        if (isPlaying) {
          startProgress();
        } else {
          clearInterval(timer);
        }
      }

      function nextTrack() {
        currentIdx = (currentIdx + 1) % songs.length;
        playTrack(currentIdx);
      }
      function prevTrack() {
        currentIdx = (currentIdx - 1 + songs.length) % songs.length;
        playTrack(currentIdx);
      }

      playBtn.addEventListener('click', togglePlay);
      bigPlay.addEventListener('click', () => {
        if (!isPlaying) togglePlay();
      });
      nextBtn.addEventListener('click', nextTrack);
      prevBtn.addEventListener('click', prevTrack);

      progressBar.addEventListener('click', (e) => {
        const rect = progressBar.getBoundingClientRect();
        const pct = (e.clientX - rect.left) / rect.width;
        const total = parseDuration(songs[currentIdx].duration);
        progress = total * pct;
        updateProgress(total);
      });

      // Volume control
      const volBar = document.getElementById('volBar');
      const volFill = document.getElementById('volFill');
      volBar.addEventListener('click', (e) => {
        const rect = volBar.getBoundingClientRect();
        const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
        volFill.style.width = pct * 100 + '%';
      });

      // Initialize
      renderTracks();
      updateProgress(parseDuration(songs[0].duration));
    </script>
  </body>
</html>
