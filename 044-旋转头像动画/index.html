<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>旋转头像动画</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
        background: radial-gradient(ellipse at center, #1e1e3a 0%, #0a0a1a 70%);
        color: #fff;
        padding: 50px 20px;
      }

      h1 {
        text-align: center;
        font-size: 2.4rem;
        margin-bottom: 12px;
        background: linear-gradient(90deg, #ff6ec4, #7873f5, #4ade80, #ff6ec4);
        background-size: 300% auto;
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: titleShift 5s linear infinite;
      }
      @keyframes titleShift {
        to {
          background-position: 300% center;
        }
      }

      .subtitle {
        text-align: center;
        color: #99a;
        margin-bottom: 60px;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 50px;
        max-width: 1000px;
        margin: 0 auto;
      }

      .avatar-cell {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }

      .name {
        font-size: 1.1rem;
        font-weight: 600;
      }
      .role {
        font-size: 0.85rem;
        color: #889;
      }

      /* 头像基础圆形 */
      .avatar {
        width: 140px;
        height: 140px;
        border-radius: 50%;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 3rem;
        background: linear-gradient(135deg, #2a2a4a, #1a1a2e);
      }

      /* 1. 连续旋转渐变环 */
      .avatar-spin-ring::before {
        content: '';
        position: absolute;
        inset: -5px;
        border-radius: 50%;
        background: conic-gradient(from 0deg, #ff6ec4, #7873f5, #4ade80, #facc15, #ff6ec4);
        animation: spin 4s linear infinite;
        z-index: -1;
      }
      .avatar-spin-ring::after {
        content: '';
        position: absolute;
        inset: -15px;
        border-radius: 50%;
        background: conic-gradient(from 0deg, #ff6ec4, #7873f5, #4ade80, #facc15, #ff6ec4);
        animation: spin 4s linear infinite;
        z-index: -2;
        filter: blur(15px);
        opacity: 0.6;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* 2. 悬停旋转虚线环 */
      .avatar-hover-ring::before {
        content: '';
        position: absolute;
        inset: -8px;
        border-radius: 50%;
        border: 3px dashed #43e97b;
        transition: transform 0.4s;
      }
      .avatar-hover-ring:hover::before {
        animation: spin 3s linear infinite;
      }
      .avatar-hover-ring:hover {
        box-shadow: 0 0 30px rgba(67, 233, 123, 0.5);
      }

      /* 3. 脉冲发光环 */
      .avatar-pulse::before {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 3px solid #f5576c;
        animation: pulseRing 2s ease-out infinite;
      }
      @keyframes pulseRing {
        0% {
          transform: scale(1);
          opacity: 0.9;
        }
        100% {
          transform: scale(1.5);
          opacity: 0;
        }
      }
      .avatar-pulse::after {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 3px solid #f5576c;
        animation: pulseRing 2s ease-out infinite;
        animation-delay: 1s;
      }

      /* 4. 双层反向旋转环 */
      .avatar-dual-ring::before,
      .avatar-dual-ring::after {
        content: '';
        position: absolute;
        border-radius: 50%;
        border: 3px solid transparent;
      }
      .avatar-dual-ring::before {
        inset: -8px;
        border-top-color: #4facfe;
        border-right-color: #4facfe;
        animation: spin 3s linear infinite;
      }
      .avatar-dual-ring::after {
        inset: -18px;
        border-bottom-color: #00f2fe;
        border-left-color: #00f2fe;
        animation: spin 4s linear infinite reverse;
      }

      /* 5. 旋转方块边框 */
      .avatar-square-ring {
        border-radius: 30px;
      }
      .avatar-square-ring::before {
        content: '';
        position: absolute;
        inset: -6px;
        border-radius: 36px;
        background: linear-gradient(90deg, #fa709a, #fee140, #fa709a);
        background-size: 200% auto;
        animation:
          spinGrad 4s linear infinite,
          spin 6s linear infinite;
        z-index: -1;
      }
      @keyframes spinGrad {
        to {
          background-position: 200% 0;
        }
      }

      /* 6. 旋转光弧 */
      .avatar-arc::before {
        content: '';
        position: absolute;
        inset: -10px;
        border-radius: 50%;
        background: conic-gradient(
          from 0deg,
          transparent 0%,
          transparent 70%,
          #a18cd1 85%,
          #fbc2eb 100%
        );
        animation: spin 2s linear infinite;
        z-index: -1;
      }
      .avatar-arc::after {
        content: '';
        position: absolute;
        inset: -4px;
        border-radius: 50%;
        background: #1a1a2e;
        z-index: -1;
      }

      footer {
        text-align: center;
        margin-top: 60px;
        color: #667;
        font-size: 0.85rem;
      }
    </style>
  </head>
  <body>
    <h1>旋转头像动画</h1>
    <p class="subtitle">六种风格各异的旋转头像边框与光效动画</p>

    <div class="grid">
      <div class="avatar-cell">
        <div class="avatar avatar-spin-ring">🐱</div>
        <div class="name">小橘</div>
        <div class="role">连续旋转渐变环</div>
      </div>

      <div class="avatar-cell">
        <div class="avatar avatar-hover-ring">🦊</div>
        <div class="name">阿狐</div>
        <div class="role">悬停旋转虚线环</div>
      </div>

      <div class="avatar-cell">
        <div class="avatar avatar-pulse">🐰</div>
        <div class="name">兔兔</div>
        <div class="role">脉冲发光环</div>
      </div>

      <div class="avatar-cell">
        <div class="avatar avatar-dual-ring">🐼</div>
        <div class="name">团团</div>
        <div class="role">双层反向旋转环</div>
      </div>

      <div class="avatar-cell">
        <div class="avatar avatar-square-ring">🐯</div>
        <div class="name">虎哥</div>
        <div class="role">旋转渐变方框</div>
      </div>

      <div class="avatar-cell">
        <div class="avatar avatar-arc">🦉</div>
        <div class="name">夜枭</div>
        <div class="role">旋转光弧</div>
      </div>
    </div>

    <footer>纯 CSS3 conic-gradient 与 transform 动画</footer>
  </body>
</html>
