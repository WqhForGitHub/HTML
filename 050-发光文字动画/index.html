<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>发光文字动画</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
        background: radial-gradient(ellipse at center, #1a0a2e 0%, #0a0515 70%, #000 100%);
        color: #fff;
        padding: 60px 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 70px;
      }

      h1.title {
        font-size: 1.4rem;
        color: #556;
        letter-spacing: 3px;
        text-align: center;
      }

      .row {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 60px;
        max-width: 1100px;
      }

      .item {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
      }
      .item .label {
        font-size: 0.8rem;
        color: #556;
        letter-spacing: 1px;
      }

      /* 1. 霓虹灯效果 */
      .neon {
        font-size: 3.5rem;
        font-weight: 900;
        color: #fff;
        text-shadow:
          0 0 5px #fff,
          0 0 10px #fff,
          0 0 20px #0ff,
          0 0 40px #0ff,
          0 0 80px #0ff;
        animation: neonFlicker 3s infinite;
      }
      @keyframes neonFlicker {
        0%,
        18%,
        22%,
        25%,
        53%,
        57%,
        100% {
          text-shadow:
            0 0 5px #fff,
            0 0 10px #fff,
            0 0 20px #0ff,
            0 0 40px #0ff,
            0 0 80px #0ff;
        }
        20%,
        24%,
        55% {
          text-shadow: none;
        }
      }

      /* 2. 脉冲发光 */
      .pulse-glow {
        font-size: 3rem;
        font-weight: 700;
        color: #ff6ec4;
        text-shadow: 0 0 20px #ff6ec4;
        animation: pulseGlow 2s ease-in-out infinite;
      }
      @keyframes pulseGlow {
        0%,
        100% {
          text-shadow:
            0 0 10px #ff6ec4,
            0 0 20px #ff6ec4;
          opacity: 0.8;
        }
        50% {
          text-shadow:
            0 0 20px #ff6ec4,
            0 0 40px #ff6ec4,
            0 0 60px #ff6ec4,
            0 0 80px #ff6ec4;
          opacity: 1;
        }
      }

      /* 3. 渐变流动文字 */
      .gradient-flow {
        font-size: 3rem;
        font-weight: 900;
        background: linear-gradient(90deg, #ff0080, #ff8c00, #ffe600, #40e0d0, #ff0080);
        background-size: 300% auto;
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: gradFlow 4s linear infinite;
        filter: drop-shadow(0 0 15px rgba(255, 140, 0, 0.5));
      }
      @keyframes gradFlow {
        to {
          background-position: 300% center;
        }
      }

      /* 4. 光环呼吸 */
      .aura {
        font-size: 3rem;
        font-weight: 700;
        color: #4ade80;
        position: relative;
        animation: auraBreath 3s ease-in-out infinite;
      }
      @keyframes auraBreath {
        0%,
        100% {
          text-shadow:
            0 0 10px #4ade80,
            0 0 20px #4ade80,
            0 0 30px rgba(74, 222, 128, 0.5);
        }
        50% {
          text-shadow:
            0 0 20px #4ade80,
            0 0 50px #4ade80,
            0 0 80px #4ade80,
            0 0 120px rgba(74, 222, 128, 0.6);
        }
      }

      /* 5. 字母逐个发光 */
      .letter-glow {
        font-size: 3rem;
        font-weight: 900;
        color: #fff;
      }
      .letter-glow span {
        display: inline-block;
        animation: letterGlow 3s ease-in-out infinite;
      }
      .letter-glow span:nth-child(1) {
        animation-delay: 0s;
      }
      .letter-glow span:nth-child(2) {
        animation-delay: 0.2s;
      }
      .letter-glow span:nth-child(3) {
        animation-delay: 0.4s;
      }
      .letter-glow span:nth-child(4) {
        animation-delay: 0.6s;
      }
      @keyframes letterGlow {
        0%,
        100% {
          color: #fff;
          text-shadow: 0 0 5px #7873f5;
        }
        50% {
          color: #7873f5;
          text-shadow:
            0 0 20px #7873f5,
            0 0 40px #7873f5,
            0 0 60px #7873f5;
        }
      }

      /* 6. 描边发光 */
      .stroke-glow {
        font-size: 3.5rem;
        font-weight: 900;
        color: transparent;
        -webkit-text-stroke: 2px #fee140;
        text-shadow:
          0 0 10px #fee140,
          0 0 30px #fa709a,
          0 0 60px #fa709a;
        animation: strokeGlow 2.5s ease-in-out infinite;
      }
      @keyframes strokeGlow {
        0%,
        100% {
          text-shadow:
            0 0 10px #fee140,
            0 0 20px #fa709a;
        }
        50% {
          text-shadow:
            0 0 20px #fee140,
            0 0 50px #fa709a,
            0 0 80px #fa709a;
        }
      }

      /* 7. 闪烁故障 */
      .glitch {
        font-size: 3rem;
        font-weight: 900;
        color: #fff;
        position: relative;
        text-shadow: 0 0 10px #fff;
        animation: glitch 2.5s infinite;
      }
      @keyframes glitch {
        0%,
        100% {
          text-shadow:
            0 0 10px #fff,
            0 0 20px #0ff;
        }
        25% {
          text-shadow:
            2px 0 #ff00c8,
            -2px 0 #00fff2,
            0 0 20px #0ff;
        }
        50% {
          text-shadow:
            -2px 0 #ff00c8,
            2px 0 #00fff2,
            0 0 30px #0ff;
        }
        75% {
          text-shadow:
            0 0 10px #fff,
            0 0 20px #0ff;
        }
      }

      /* 8. 彩虹光环 */
      .rainbow-aura {
        font-size: 3rem;
        font-weight: 900;
        color: #fff;
        background: linear-gradient(
          90deg,
          #ff0080,
          #ff8c00,
          #ffe600,
          #00ff80,
          #00f2fe,
          #7873f5,
          #ff0080
        );
        background-size: 300% auto;
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        animation:
          rainbowMove 4s linear infinite,
          rainbowGlow 2s ease-in-out infinite;
        filter: drop-shadow(0 0 15px rgba(255, 140, 0, 0.6));
      }
      @keyframes rainbowMove {
        to {
          background-position: 300% center;
        }
      }
      @keyframes rainbowGlow {
        0%,
        100% {
          filter: drop-shadow(0 0 10px rgba(255, 140, 0, 0.4));
        }
        50% {
          filter: drop-shadow(0 0 25px rgba(255, 140, 0, 0.8))
            drop-shadow(0 0 40px rgba(120, 115, 245, 0.4));
        }
      }

      footer {
        text-align: center;
        margin-top: 30px;
        color: #445;
        font-size: 0.85rem;
      }
    </style>
  </head>
  <body>
    <h1 class="title">发光文字动画集合 · 暗夜中的璀璨光芒</h1>

    <div class="row">
      <div class="item">
        <div class="neon">霓虹</div>
        <span class="label">霓虹灯闪烁</span>
      </div>

      <div class="item">
        <div class="pulse-glow">脉冲</div>
        <span class="label">脉冲发光</span>
      </div>

      <div class="item">
        <div class="gradient-flow">流光</div>
        <span class="label">渐变流动</span>
      </div>

      <div class="item">
        <div class="aura">光环</div>
        <span class="label">光环呼吸</span>
      </div>
    </div>

    <div class="row">
      <div class="item">
        <div class="letter-glow">
          <span>逐</span>
          <span>字</span>
          <span>发</span>
          <span>光</span>
        </div>
        <span class="label">字母逐个发光</span>
      </div>

      <div class="item">
        <div class="stroke-glow">描边</div>
        <span class="label">描边发光</span>
      </div>

      <div class="item">
        <div class="glitch">故障</div>
        <span class="label">故障闪烁</span>
      </div>

      <div class="item">
        <div class="rainbow-aura">彩虹</div>
        <span class="label">彩虹光环</span>
      </div>
    </div>

    <footer>纯 CSS3 text-shadow · background-clip · 动画</footer>
  </body>
</html>
