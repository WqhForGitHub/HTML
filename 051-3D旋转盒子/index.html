<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D旋转盒子</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: radial-gradient(circle at center, #1a1a2e 0%, #050510 100%);
        font-family: 'Microsoft YaHei', sans-serif;
        color: #fff;
      }
      .scene {
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        perspective: 1200px;
        cursor: grab;
      }
      .scene:active {
        cursor: grabbing;
      }
      .cube {
        position: relative;
        width: 220px;
        height: 220px;
        transform-style: preserve-3d;
        animation: autoRotate 18s linear infinite;
      }
      .face {
        position: absolute;
        width: 220px;
        height: 220px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 40px;
        font-weight: bold;
        color: #fff;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
        border: 2px solid rgba(255, 255, 255, 0.2);
        box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.3);
        backface-visibility: visible;
      }
      .front {
        transform: translateZ(110px);
        background: linear-gradient(135deg, #ff416c, #ff4b2b);
      }
      .back {
        transform: rotateY(180deg) translateZ(110px);
        background: linear-gradient(135deg, #00c6ff, #0072ff);
      }
      .right {
        transform: rotateY(90deg) translateZ(110px);
        background: linear-gradient(135deg, #11998e, #38ef7d);
      }
      .left {
        transform: rotateY(-90deg) translateZ(110px);
        background: linear-gradient(135deg, #f7971e, #ffd200);
      }
      .top {
        transform: rotateX(90deg) translateZ(110px);
        background: linear-gradient(135deg, #8e2de2, #4a00e0);
      }
      .bottom {
        transform: rotateX(-90deg) translateZ(110px);
        background: linear-gradient(135deg, #fc5c7d, #6a82fb);
      }

      @keyframes autoRotate {
        from {
          transform: rotateX(-15deg) rotateY(0deg);
        }
        to {
          transform: rotateX(-15deg) rotateY(360deg);
        }
      }
      .hint {
        position: absolute;
        bottom: 30px;
        left: 0;
        right: 0;
        text-align: center;
        font-size: 14px;
        color: rgba(255, 255, 255, 0.6);
        letter-spacing: 2px;
        pointer-events: none;
      }
      .title {
        position: absolute;
        top: 30px;
        left: 0;
        right: 0;
        text-align: center;
        font-size: 28px;
        letter-spacing: 6px;
        color: rgba(255, 255, 255, 0.9);
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div class="title">3D 旋 转 盒 子</div>
    <div class="scene" id="scene">
      <div class="cube" id="cube">
        <div class="face front">前</div>
        <div class="face back">后</div>
        <div class="face right">右</div>
        <div class="face left">左</div>
        <div class="face top">上</div>
        <div class="face bottom">下</div>
      </div>
    </div>
    <div class="hint">拖拽鼠标可自由旋转 · 松开后自动旋转</div>

    <script>
      const cube = document.getElementById('cube');
      const scene = document.getElementById('scene');
      let isDragging = false;
      let startX = 0,
        startY = 0;
      let curX = -15,
        curY = 0;

      // 暂停自动旋转动画
      function pauseAuto() {
        cube.style.animationPlayState = 'paused';
      }
      function resumeAuto() {
        cube.style.animation = 'none';
        // 重新读取当前角度后启动
        requestAnimationFrame(() => {
          cube.style.transition = 'none';
          cube.style.transform = `rotateX(${curX}deg) rotateY(${curY}deg)`;
          requestAnimationFrame(() => {
            cube.style.transition = '';
            cube.style.animation = '';
            cube.style.animationPlayState = 'running';
          });
        });
      }

      scene.addEventListener('mousedown', (e) => {
        isDragging = true;
        startX = e.clientX;
        startY = e.clientY;
        pauseAuto();
        cube.style.transition = 'none';
      });

      window.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        const dx = e.clientX - startX;
        const dy = e.clientY - startY;
        curY += dx * 0.5;
        curX -= dy * 0.5;
        curX = Math.max(-80, Math.min(80, curX));
        startX = e.clientX;
        startY = e.clientY;
        cube.style.transform = `rotateX(${curX}deg) rotateY(${curY}deg)`;
      });

      window.addEventListener('mouseup', () => {
        if (isDragging) {
          isDragging = false;
          // 一段平滑过渡后恢复自动旋转
          setTimeout(() => {
            if (!isDragging) resumeAuto();
          }, 600);
        }
      });

      // 触屏支持
      scene.addEventListener('touchstart', (e) => {
        isDragging = true;
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
        pauseAuto();
        cube.style.transition = 'none';
      });
      window.addEventListener('touchmove', (e) => {
        if (!isDragging) return;
        const dx = e.touches[0].clientX - startX;
        const dy = e.touches[0].clientY - startY;
        curY += dx * 0.5;
        curX -= dy * 0.5;
        curX = Math.max(-80, Math.min(80, curX));
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
        cube.style.transform = `rotateX(${curX}deg) rotateY(${curY}deg)`;
      });
      window.addEventListener('touchend', () => {
        if (isDragging) {
          isDragging = false;
          setTimeout(() => {
            if (!isDragging) resumeAuto();
          }, 600);
        }
      });
    </script>
  </body>
</html>
