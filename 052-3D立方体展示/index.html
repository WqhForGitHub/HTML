<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D立方体展示</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        min-height: 100vh;
        background: radial-gradient(ellipse at top, #1a1a3a 0%, #0a0a1a 70%);
        font-family: 'Microsoft YaHei', sans-serif;
        color: #fff;
        overflow-x: hidden;
      }
      h1 {
        text-align: center;
        padding: 30px 0 10px;
        font-size: 30px;
        letter-spacing: 6px;
        background: linear-gradient(90deg, #66d9ff, #c084fc, #f472b6);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .subtitle {
        text-align: center;
        color: rgba(255, 255, 255, 0.5);
        margin-bottom: 30px;
        letter-spacing: 2px;
      }
      .controls {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 20px;
        flex-wrap: wrap;
        margin-bottom: 40px;
        padding: 0 20px;
      }
      .controls label {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 14px;
        color: rgba(255, 255, 255, 0.8);
      }
      .controls input[type='range'] {
        width: 200px;
        accent-color: #66d9ff;
      }
      .controls span {
        min-width: 60px;
        color: #66d9ff;
        font-weight: bold;
      }
      .gallery {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 40px;
        padding: 0 40px 60px;
        max-width: 1400px;
        margin: 0 auto;
      }
      .card {
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 16px;
        padding: 30px 20px 40px;
        text-align: center;
        backdrop-filter: blur(10px);
      }
      .card h3 {
        font-size: 18px;
        margin-bottom: 6px;
        letter-spacing: 2px;
      }
      .card p {
        font-size: 12px;
        color: rgba(255, 255, 255, 0.5);
        margin-bottom: 20px;
      }
      .stage {
        width: 100%;
        height: 200px;
        display: flex;
        align-items: center;
        justify-content: center;
        perspective: 800px;
      }
      .cube {
        position: relative;
        width: 100px;
        height: 100px;
        transform-style: preserve-3d;
      }
      .face {
        position: absolute;
        width: 100px;
        height: 100px;
        border: 1px solid rgba(255, 255, 255, 0.25);
        box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.3);
      }

      /* 1. 旋转立方体 */
      .cube1 {
        animation: spin1 8s linear infinite;
      }
      .cube1 .f1 {
        transform: translateZ(50px);
        background: linear-gradient(135deg, #ff416c, #ff4b2b);
      }
      .cube1 .f2 {
        transform: rotateY(180deg) translateZ(50px);
        background: linear-gradient(135deg, #ff416c, #ff4b2b);
      }
      .cube1 .f3 {
        transform: rotateY(90deg) translateZ(50px);
        background: linear-gradient(135deg, #ff416c, #ff4b2b);
      }
      .cube1 .f4 {
        transform: rotateY(-90deg) translateZ(50px);
        background: linear-gradient(135deg, #ff416c, #ff4b2b);
      }
      .cube1 .f5 {
        transform: rotateX(90deg) translateZ(50px);
        background: linear-gradient(135deg, #ff416c, #ff4b2b);
      }
      .cube1 .f6 {
        transform: rotateX(-90deg) translateZ(50px);
        background: linear-gradient(135deg, #ff416c, #ff4b2b);
      }
      @keyframes spin1 {
        from {
          transform: rotateX(0) rotateY(0);
        }
        to {
          transform: rotateX(360deg) rotateY(360deg);
        }
      }

      /* 2. 浮动立方体 */
      .cube2 {
        animation: float2 4s ease-in-out infinite;
        transform-style: preserve-3d;
      }
      .cube2 .inner {
        animation: spin2 10s linear infinite;
        transform-style: preserve-3d;
        width: 100px;
        height: 100px;
        position: absolute;
      }
      .cube2 .face {
        background: linear-gradient(135deg, #00c6ff, #0072ff);
      }
      .cube2 .f1 {
        transform: translateZ(50px);
      }
      .cube2 .f2 {
        transform: rotateY(180deg) translateZ(50px);
      }
      .cube2 .f3 {
        transform: rotateY(90deg) translateZ(50px);
      }
      .cube2 .f4 {
        transform: rotateY(-90deg) translateZ(50px);
      }
      .cube2 .f5 {
        transform: rotateX(90deg) translateZ(50px);
      }
      .cube2 .f6 {
        transform: rotateX(-90deg) translateZ(50px);
      }
      @keyframes spin2 {
        from {
          transform: rotateY(0);
        }
        to {
          transform: rotateY(360deg);
        }
      }
      @keyframes float2 {
        0%,
        100% {
          transform: translateY(-20px);
        }
        50% {
          transform: translateY(20px);
        }
      }

      /* 3. 脉动立方体 */
      .cube3 {
        animation: pulse3 2s ease-in-out infinite;
      }
      .cube3 .inner {
        animation: spin3 12s linear infinite;
        transform-style: preserve-3d;
        width: 100px;
        height: 100px;
        position: absolute;
      }
      .cube3 .face {
        background: linear-gradient(135deg, #11998e, #38ef7d);
      }
      .cube3 .f1 {
        transform: translateZ(50px);
      }
      .cube3 .f2 {
        transform: rotateY(180deg) translateZ(50px);
      }
      .cube3 .f3 {
        transform: rotateY(90deg) translateZ(50px);
      }
      .cube3 .f4 {
        transform: rotateY(-90deg) translateZ(50px);
      }
      .cube3 .f5 {
        transform: rotateX(90deg) translateZ(50px);
      }
      .cube3 .f6 {
        transform: rotateX(-90deg) translateZ(50px);
      }
      @keyframes spin3 {
        from {
          transform: rotateX(0) rotateY(0);
        }
        to {
          transform: rotateX(360deg) rotateY(360deg);
        }
      }
      @keyframes pulse3 {
        0%,
        100% {
          transform: scale(0.8);
        }
        50% {
          transform: scale(1.2);
        }
      }

      /* 4. 翻滚立方体 */
      .cube4 {
        animation: tumble4 6s ease-in-out infinite;
      }
      .cube4 .face {
        background: linear-gradient(135deg, #f7971e, #ffd200);
      }
      .cube4 .f1 {
        transform: translateZ(50px);
      }
      .cube4 .f2 {
        transform: rotateY(180deg) translateZ(50px);
      }
      .cube4 .f3 {
        transform: rotateY(90deg) translateZ(50px);
      }
      .cube4 .f4 {
        transform: rotateY(-90deg) translateZ(50px);
      }
      .cube4 .f5 {
        transform: rotateX(90deg) translateZ(50px);
      }
      .cube4 .f6 {
        transform: rotateX(-90deg) translateZ(50px);
      }
      @keyframes tumble4 {
        0% {
          transform: rotateX(0) rotateY(0);
        }
        25% {
          transform: rotateX(90deg) rotateY(90deg);
        }
        50% {
          transform: rotateX(180deg) rotateY(180deg);
        }
        75% {
          transform: rotateX(270deg) rotateY(270deg);
        }
        100% {
          transform: rotateX(360deg) rotateY(360deg);
        }
      }

      /* 5. 摇摆立方体 */
      .cube5 {
        animation: sway5 3s ease-in-out infinite;
      }
      .cube5 .inner {
        animation: spin5 8s linear infinite;
        transform-style: preserve-3d;
        width: 100px;
        height: 100px;
        position: absolute;
      }
      .cube5 .face {
        background: linear-gradient(135deg, #8e2de2, #4a00e0);
      }
      .cube5 .f1 {
        transform: translateZ(50px);
      }
      .cube5 .f2 {
        transform: rotateY(180deg) translateZ(50px);
      }
      .cube5 .f3 {
        transform: rotateY(90deg) translateZ(50px);
      }
      .cube5 .f4 {
        transform: rotateY(-90deg) translateZ(50px);
      }
      .cube5 .f5 {
        transform: rotateX(90deg) translateZ(50px);
      }
      .cube5 .f6 {
        transform: rotateX(-90deg) translateZ(50px);
      }
      @keyframes spin5 {
        from {
          transform: rotateY(0);
        }
        to {
          transform: rotateY(-360deg);
        }
      }
      @keyframes sway5 {
        0%,
        100% {
          transform: rotateZ(-15deg) translateX(-20px);
        }
        50% {
          transform: rotateZ(15deg) translateX(20px);
        }
      }

      /* 6. 拆解立方体 */
      .cube6 {
        animation: spin6 10s linear infinite;
      }
      .cube6 .face {
        background: linear-gradient(135deg, #fc5c7d, #6a82fb);
        transition: transform 1s ease;
      }
      .cube6 .f1 {
        transform: translateZ(50px);
        animation: explode1 3s ease-in-out infinite;
      }
      .cube6 .f2 {
        transform: rotateY(180deg) translateZ(50px);
        animation: explode2 3s ease-in-out infinite;
      }
      .cube6 .f3 {
        transform: rotateY(90deg) translateZ(50px);
        animation: explode3 3s ease-in-out infinite;
      }
      .cube6 .f4 {
        transform: rotateY(-90deg) translateZ(50px);
        animation: explode4 3s ease-in-out infinite;
      }
      .cube6 .f5 {
        transform: rotateX(90deg) translateZ(50px);
        animation: explode5 3s ease-in-out infinite;
      }
      .cube6 .f6 {
        transform: rotateX(-90deg) translateZ(50px);
        animation: explode6 3s ease-in-out infinite;
      }
      @keyframes spin6 {
        from {
          transform: rotateX(-20deg) rotateY(0);
        }
        to {
          transform: rotateX(-20deg) rotateY(360deg);
        }
      }
      @keyframes explode1 {
        0%,
        100% {
          transform: translateZ(50px);
        }
        50% {
          transform: translateZ(90px);
        }
      }
      @keyframes explode2 {
        0%,
        100% {
          transform: rotateY(180deg) translateZ(50px);
        }
        50% {
          transform: rotateY(180deg) translateZ(90px);
        }
      }
      @keyframes explode3 {
        0%,
        100% {
          transform: rotateY(90deg) translateZ(50px);
        }
        50% {
          transform: rotateY(90deg) translateZ(90px);
        }
      }
      @keyframes explode4 {
        0%,
        100% {
          transform: rotateY(-90deg) translateZ(50px);
        }
        50% {
          transform: rotateY(-90deg) translateZ(90px);
        }
      }
      @keyframes explode5 {
        0%,
        100% {
          transform: rotateX(90deg) translateZ(50px);
        }
        50% {
          transform: rotateX(90deg) translateZ(90px);
        }
      }
      @keyframes explode6 {
        0%,
        100% {
          transform: rotateX(-90deg) translateZ(50px);
        }
        50% {
          transform: rotateX(-90deg) translateZ(90px);
        }
      }
    </style>
  </head>
  <body>
    <h1>3D 立方体展示馆</h1>
    <p class="subtitle">多种 3D 立方体动画效果集合 · 调节透视感受变化</p>

    <div class="controls">
      <label>
        透视距离
        <input type="range" id="persp" min="300" max="2000" value="800" />
        <span id="perspVal">800px</span>
      </label>
      <label>
        X轴旋转
        <input type="range" id="rotX" min="-60" max="60" value="-20" />
        <span id="rotXVal">-20°</span>
      </label>
      <label>
        整体缩放
        <input type="range" id="scale" min="50" max="150" value="100" />
        <span id="scaleVal">100%</span>
      </label>
    </div>

    <div class="gallery" id="gallery">
      <div class="card">
        <h3>持续旋转</h3>
        <p>双轴无限自转</p>
        <div class="stage">
          <div class="cube cube1">
            <div class="face f1"></div>
            <div class="face f2"></div>
            <div class="face f3"></div>
            <div class="face f4"></div>
            <div class="face f5"></div>
            <div class="face f6"></div>
          </div>
        </div>
      </div>
      <div class="card">
        <h3>悬浮飘动</h3>
        <p>上下浮动 · 水平自转</p>
        <div class="stage">
          <div class="cube cube2">
            <div class="inner">
              <div class="face f1"></div>
              <div class="face f2"></div>
              <div class="face f3"></div>
              <div class="face f4"></div>
              <div class="face f5"></div>
              <div class="face f6"></div>
            </div>
          </div>
        </div>
      </div>
      <div class="card">
        <h3>脉动呼吸</h3>
        <p>缩放脉动 · 全向自转</p>
        <div class="stage">
          <div class="cube cube3">
            <div class="inner">
              <div class="face f1"></div>
              <div class="face f2"></div>
              <div class="face f3"></div>
              <div class="face f4"></div>
              <div class="face f5"></div>
              <div class="face f6"></div>
            </div>
          </div>
        </div>
      </div>
      <div class="card">
        <h3>翻滚跳跃</h3>
        <p>阶梯式翻滚旋转</p>
        <div class="stage">
          <div class="cube cube4">
            <div class="face f1"></div>
            <div class="face f2"></div>
            <div class="face f3"></div>
            <div class="face f4"></div>
            <div class="face f5"></div>
            <div class="face f6"></div>
          </div>
        </div>
      </div>
      <div class="card">
        <h3>钟摇摆动</h3>
        <p>Z轴摇摆 · 反向自转</p>
        <div class="stage">
          <div class="cube cube5">
            <div class="inner">
              <div class="face f1"></div>
              <div class="face f2"></div>
              <div class="face f3"></div>
              <div class="face f4"></div>
              <div class="face f5"></div>
              <div class="face f6"></div>
            </div>
          </div>
        </div>
      </div>
      <div class="card">
        <h3>爆炸重组</h3>
        <p>面块周期性爆裂</p>
        <div class="stage">
          <div class="cube cube6">
            <div class="face f1"></div>
            <div class="face f2"></div>
            <div class="face f3"></div>
            <div class="face f4"></div>
            <div class="face f5"></div>
            <div class="face f6"></div>
          </div>
        </div>
      </div>
    </div>

    <script>
      const gallery = document.getElementById('gallery');
      const persp = document.getElementById('persp');
      const rotX = document.getElementById('rotX');
      const scale = document.getElementById('scale');
      const perspVal = document.getElementById('perspVal');
      const rotXVal = document.getElementById('rotXVal');
      const scaleVal = document.getElementById('scaleVal');

      function update() {
        perspVal.textContent = persp.value + 'px';
        rotXVal.textContent = rotX.value + '°';
        scaleVal.textContent = scale.value + '%';
        gallery.querySelectorAll('.stage').forEach((s) => {
          s.style.perspective = persp.value + 'px';
        });
        // 为每个cube的容器添加旋转和缩放包裹层效果（通过CSS变量）
        gallery.querySelectorAll('.cube').forEach((c) => {
          c.style.setProperty('--rx', rotX.value + 'deg');
          c.style.zoom = scale.value / 100;
        });
      }
      persp.addEventListener('input', update);
      rotX.addEventListener('input', update);
      scale.addEventListener('input', update);
      update();
    </script>
  </body>
</html>
