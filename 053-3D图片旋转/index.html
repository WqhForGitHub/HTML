<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D图片旋转</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100vh;
        overflow: hidden;
        background: radial-gradient(ellipse at center, #1a0a2e 0%, #050108 100%);
        font-family: 'Microsoft YaHei', sans-serif;
        color: #fff;
      }
      h1 {
        position: absolute;
        top: 30px;
        left: 0;
        right: 0;
        text-align: center;
        font-size: 28px;
        letter-spacing: 6px;
        z-index: 10;
        background: linear-gradient(90deg, #f093fb, #f5576c, #4facfe);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .controls {
        position: absolute;
        bottom: 40px;
        left: 0;
        right: 0;
        display: flex;
        justify-content: center;
        gap: 20px;
        z-index: 10;
      }
      .btn {
        padding: 10px 24px;
        border: 1px solid rgba(255, 255, 255, 0.3);
        background: rgba(255, 255, 255, 0.05);
        color: #fff;
        border-radius: 30px;
        cursor: pointer;
        font-size: 14px;
        letter-spacing: 2px;
        backdrop-filter: blur(10px);
        transition: all 0.3s;
      }
      .btn:hover {
        background: rgba(255, 255, 255, 0.15);
        border-color: rgba(255, 255, 255, 0.6);
      }
      .btn.active {
        background: linear-gradient(90deg, #f5576c, #4facfe);
        border-color: transparent;
      }

      .scene {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        perspective: 1400px;
      }
      .carousel {
        position: relative;
        width: 220px;
        height: 280px;
        transform-style: preserve-3d;
        transition: transform 1s cubic-bezier(0.25, 0.1, 0.25, 1);
      }
      .item {
        position: absolute;
        width: 220px;
        height: 280px;
        border-radius: 14px;
        overflow: hidden;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
        border: 2px solid rgba(255, 255, 255, 0.15);
        backface-visibility: visible;
      }
      .item .img {
        width: 100%;
        height: 75%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 50px;
        color: #fff;
      }
      .item .cap {
        height: 25%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.7);
        font-size: 15px;
        letter-spacing: 3px;
      }
      .nav {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        width: 50px;
        height: 50px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.3);
        color: #fff;
        font-size: 24px;
        cursor: pointer;
        z-index: 10;
        backdrop-filter: blur(10px);
        transition: all 0.3s;
      }
      .nav:hover {
        background: rgba(255, 255, 255, 0.25);
      }
      .nav.left {
        left: 5%;
      }
      .nav.right {
        right: 5%;
      }
      .hint {
        position: absolute;
        bottom: 100px;
        left: 0;
        right: 0;
        text-align: center;
        color: rgba(255, 255, 255, 0.5);
        font-size: 13px;
        letter-spacing: 2px;
      }
    </style>
  </head>
  <body>
    <h1>3D 图 片 旋 转 画 廊</h1>
    <div class="scene">
      <div class="carousel" id="carousel"></div>
    </div>
    <button class="nav left" id="prev">&#10094;</button>
    <button class="nav right" id="next">&#10095;</button>
    <p class="hint">点击左右按钮旋转 · 或点击图片切换 · 可开启自动旋转</p>
    <div class="controls">
      <button class="btn" id="autoBtn">开启自动旋转</button>
      <button class="btn" id="reverseBtn">反向旋转</button>
    </div>

    <script>
      const carousel = document.getElementById('carousel');
      const prev = document.getElementById('prev');
      const next = document.getElementById('next');
      const autoBtn = document.getElementById('autoBtn');
      const reverseBtn = document.getElementById('reverseBtn');

      const data = [
        { grad: 'linear-gradient(135deg,#ff9a9e,#fad0c4)', icon: '🌸', cap: '春日花海' },
        { grad: 'linear-gradient(135deg,#a1c4fd,#c2e9fb)', icon: '🌊', cap: '夏日海洋' },
        { grad: 'linear-gradient(135deg(#f6d365,#fda085))', icon: '🍂', cap: '秋日落叶' },
        { grad: 'linear-gradient(135deg,#a8edea,#fed6e3)', icon: '❄️', cap: '冬日雪景' },
        { grad: 'linear-gradient(135deg,#84fab0,#8fd3f4)', icon: '🌳', cap: '森林秘境' },
        { grad: 'linear-gradient(135deg,#ffecd2,#fcb69f)', icon: '🌅', cap: '黎明破晓' },
        { grad: 'linear-gradient(135deg(#667eea,#764ba2))', icon: '🌃', cap: '城市夜景' },
        { grad: 'linear-gradient(135deg,#f093fb,#f5576c)', icon: '🎨', cap: '梦幻色彩' },
      ];

      const count = data.length;
      const angleStep = 360 / count;
      const radius = 320;
      let current = 0;
      let auto = false;
      let reverse = false;
      let autoTimer = null;

      data.forEach((d, i) => {
        const el = document.createElement('div');
        el.className = 'item';
        el.style.transform = `rotateY(${i * angleStep}deg) translateZ(${radius}px)`;
        el.innerHTML = `
      <div class="img" style="background:${d.grad}">${d.icon}</div>
      <div class="cap">${d.cap}</div>`;
        el.addEventListener('click', () => {
          current = i;
          update();
        });
        carousel.appendChild(el);
      });

      function update() {
        carousel.style.transform = `rotateY(${-current * angleStep}deg)`;
      }

      prev.addEventListener('click', () => {
        current = (current - 1 + count) % count;
        update();
      });
      next.addEventListener('click', () => {
        current = (current + 1) % count;
        update();
      });

      function startAuto() {
        stopAuto();
        autoTimer = setInterval(() => {
          current = reverse ? (current - 1 + count) % count : (current + 1) % count;
          update();
        }, 2200);
      }
      function stopAuto() {
        if (autoTimer) {
          clearInterval(autoTimer);
          autoTimer = null;
        }
      }

      autoBtn.addEventListener('click', () => {
        auto = !auto;
        if (auto) {
          autoBtn.textContent = '停止自动旋转';
          autoBtn.classList.add('active');
          startAuto();
        } else {
          autoBtn.textContent = '开启自动旋转';
          autoBtn.classList.remove('active');
          stopAuto();
        }
      });

      reverseBtn.addEventListener('click', () => {
        reverse = !reverse;
        if (reverse) reverseBtn.classList.add('active');
        else reverseBtn.classList.remove('active');
        if (auto) startAuto();
      });

      update();
    </script>
  </body>
</html>
