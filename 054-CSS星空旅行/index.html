<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS星空旅行</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100vh;
        overflow: hidden;
        background: #000;
        font-family: 'Microsoft YaHei', sans-serif;
        color: #fff;
      }
      .space {
        position: relative;
        width: 100vw;
        height: 100vh;
        background: radial-gradient(ellipse at center, #0a0a20 0%, #000 70%);
        perspective: 600px;
        overflow: hidden;
      }
      .stars-layer {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 4px;
        height: 4px;
        transform-style: preserve-3d;
      }
      .star {
        position: absolute;
        top: 0;
        left: 0;
        width: 3px;
        height: 3px;
        border-radius: 50%;
        background: #fff;
        box-shadow: 0 0 6px #fff;
        transform-origin: center;
        animation: warp linear infinite;
        opacity: 0;
      }
      @keyframes warp {
        0% {
          transform: translate3d(0, 0, 0) scale(0);
          opacity: 0;
        }
        10% {
          opacity: 1;
        }
        100% {
          transform: translate3d(var(--tx), var(--ty), 1200px) scale(2);
          opacity: 0;
        }
      }

      /* 中心光晕 */
      .core {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 120px;
        height: 120px;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        background: radial-gradient(circle, rgba(180, 220, 255, 0.9) 0%, rgba(100, 150, 255, 0.4) 40%, transparent 70%);
        filter: blur(2px);
        animation: corePulse 3s ease-in-out infinite;
        pointer-events: none;
      }
      @keyframes corePulse {
        0%,
        100% {
          transform: translate(-50%, -50%) scale(0.8);
          opacity: 0.7;
        }
        50% {
          transform: translate(-50%, -50%) scale(1.3);
          opacity: 1;
        }
      }

      /* 远景静态星点 */
      .bg-star {
        position: absolute;
        width: 2px;
        height: 2px;
        background: #fff;
        border-radius: 50%;
        opacity: 0.6;
        animation: twinkle 3s ease-in-out infinite;
      }
      @keyframes twinkle {
        0%,
        100% {
          opacity: 0.2;
        }
        50% {
          opacity: 0.9;
        }
      }

      h1 {
        position: absolute;
        top: 40px;
        left: 0;
        right: 0;
        text-align: center;
        font-size: 26px;
        letter-spacing: 8px;
        color: rgba(180, 220, 255, 0.85);
        text-shadow: 0 0 20px rgba(100, 150, 255, 0.8);
        z-index: 10;
        pointer-events: none;
      }
      .info {
        position: absolute;
        bottom: 40px;
        left: 0;
        right: 0;
        text-align: center;
        color: rgba(180, 220, 255, 0.6);
        font-size: 13px;
        letter-spacing: 3px;
        z-index: 10;
        pointer-events: none;
      }
      .speed-ctrl {
        position: absolute;
        bottom: 80px;
        left: 0;
        right: 0;
        text-align: center;
        z-index: 10;
      }
      .speed-ctrl input {
        width: 220px;
        accent-color: #66aaff;
        vertical-align: middle;
      }
      .speed-ctrl label {
        color: rgba(180, 220, 255, 0.8);
        font-size: 13px;
        letter-spacing: 2px;
        margin-right: 10px;
      }
      .speed-ctrl span {
        color: #66aaff;
        font-weight: bold;
        margin-left: 8px;
      }
    </style>
  </head>
  <body>
    <div class="space" id="space">
      <div class="core"></div>
      <h1>星 际 旅 行 · 曲 速 跃 迁</h1>
      <div class="speed-ctrl">
        <label>曲速引擎</label>
        <input type="range" id="speed" min="0.3" max="3" step="0.1" value="1" />
        <span id="speedVal">1.0x</span>
      </div>
      <div class="info">恒星正以光速向四周飞掠 · 拖动滑块调节航行速度</div>
    </div>

    <script>
      const space = document.getElementById('space');
      const speed = document.getElementById('speed');
      const speedVal = document.getElementById('speedVal');

      // 远景星点
      for (let i = 0; i < 150; i++) {
        const s = document.createElement('div');
        s.className = 'bg-star';
        s.style.left = Math.random() * 100 + '%';
        s.style.top = Math.random() * 100 + '%';
        s.style.animationDelay = Math.random() * 3 + 's';
        s.style.animationDuration = 2 + Math.random() * 3 + 's';
        space.appendChild(s);
      }

      // 曲速星轨
      const STAR_COUNT = 180;
      const stars = [];
      for (let i = 0; i < STAR_COUNT; i++) {
        const star = document.createElement('div');
        star.className = 'star';
        // 随机颜色（白、蓝、青、黄）
        const colors = ['#ffffff', '#aaccff', '#88ddff', '#ffeebb', '#ffccdd'];
        const c = colors[Math.floor(Math.random() * colors.length)];
        star.style.background = c;
        star.style.boxShadow = `0 0 8px ${c}`;
        const size = 1 + Math.random() * 3;
        star.style.width = size + 'px';
        star.style.height = size + 'px';
        space.appendChild(star);
        stars.push(star);
        resetStar(star, true);
      }

      function resetStar(star, initial) {
        // 起点：靠近中心的随机偏移
        const angle = Math.random() * Math.PI * 2;
        const r = Math.random() * 60;
        const sx = Math.cos(angle) * r;
        const sy = Math.sin(angle) * r;
        // 终点：朝外径向延伸
        const dist = 600 + Math.random() * 600;
        const tx = Math.cos(angle) * dist;
        const ty = Math.sin(angle) * dist;
        star.style.setProperty('--tx', tx + 'px');
        star.style.setProperty('--ty', ty + 'px');
        star.style.left = '50%';
        star.style.top = '50%';
        star.style.transform = `translate(${sx}px, ${sy}px)`;
        const dur = 1.5 + Math.random() * 2.5;
        star.style.animationDuration = dur / parseFloat(speed.value) + 's';
        star.style.animationDelay = initial ? -Math.random() * dur + 's' : '0s';
        // 重新触发动画
        star.style.animation = 'none';
        void star.offsetWidth;
        star.style.animation = `warp ${dur / parseFloat(speed.value)}s linear infinite`;
        star.style.animationDelay = initial ? -Math.random() * dur + 's' : '0s';
      }

      speed.addEventListener('input', () => {
        speedVal.textContent = parseFloat(speed.value).toFixed(1) + 'x';
        stars.forEach((s) => resetStar(s, true));
      });
    </script>
  </body>
</html>
