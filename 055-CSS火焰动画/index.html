<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS火焰动画</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100vh;
        overflow: hidden;
        background: radial-gradient(ellipse at center bottom, #2a0a00 0%, #0a0500 50%, #000 100%);
        font-family: 'Microsoft YaHei', sans-serif;
        color: #fff;
      }
      h1 {
        position: absolute;
        top: 40px;
        left: 0;
        right: 0;
        text-align: center;
        font-size: 28px;
        letter-spacing: 8px;
        color: rgba(255, 160, 80, 0.9);
        text-shadow: 0 0 20px rgba(255, 100, 0, 0.7);
        z-index: 5;
      }
      .scene {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        padding-bottom: 80px;
      }
      .campfire {
        position: relative;
        width: 400px;
        height: 500px;
        display: flex;
        align-items: flex-end;
        justify-content: center;
      }

      /* 柴火堆 */
      .logs {
        position: absolute;
        bottom: 0;
        width: 220px;
        height: 50px;
        z-index: 3;
      }
      .log {
        position: absolute;
        width: 200px;
        height: 22px;
        background: linear-gradient(90deg, #3d2817 0%, #5a3a22 50%, #3d2817 100%);
        border-radius: 12px;
        box-shadow: 0 0 20px rgba(255, 100, 0, 0.4);
      }
      .log1 {
        bottom: 10px;
        left: 10px;
        transform: rotate(-12deg);
      }
      .log2 {
        bottom: 10px;
        left: 10px;
        transform: rotate(12deg);
      }
      .log::before {
        content: '';
        position: absolute;
        top: 0;
        left: 50%;
        width: 6px;
        height: 22px;
        transform: translateX(-50%);
        background: repeating-linear-gradient(90deg, #4a2f1a 0, #2a1a0d 3px, #4a2f1a 6px);
        border-radius: 3px;
      }

      /* 火焰容器 */
      .flames {
        position: absolute;
        bottom: 40px;
        left: 50%;
        transform: translateX(-50%);
        width: 160px;
        height: 320px;
        z-index: 2;
      }
      .flame {
        position: absolute;
        bottom: 0;
        left: 50%;
        border-radius: 50% 50% 20% 20% / 60% 60% 40% 40%;
        filter: blur(2px);
        mix-blend-mode: screen;
        transform-origin: center bottom;
      }

      .f1 {
        width: 160px;
        height: 260px;
        background: radial-gradient(
          ellipse at center bottom,
          #ff6a00 0%,
          #ff3d00 40%,
          transparent 75%
        );
        transform: translateX(-50%);
        animation:
          flicker1 1.4s ease-in-out infinite,
          sway 3s ease-in-out infinite;
        filter: blur(6px);
      }
      .f2 {
        width: 120px;
        height: 220px;
        background: radial-gradient(
          ellipse at center bottom,
          #ffd000 0%,
          #ff8c00 50%,
          transparent 80%
        );
        transform: translateX(-50%);
        animation:
          flicker2 1.1s ease-in-out infinite,
          sway 2.4s ease-in-out infinite reverse;
        filter: blur(4px);
      }
      .f3 {
        width: 80px;
        height: 180px;
        background: radial-gradient(
          ellipse at center bottom,
          #fff5b8 0%,
          #ffe066 45%,
          transparent 85%
        );
        transform: translateX(-50%);
        animation:
          flicker3 0.9s ease-in-out infinite,
          sway 2s ease-in-out infinite;
        filter: blur(3px);
      }
      .f4 {
        width: 50px;
        height: 130px;
        background: radial-gradient(
          ellipse at center bottom,
          #ffffff 0%,
          #fff3a0 50%,
          transparent 90%
        );
        transform: translateX(-50%);
        animation:
          flicker4 0.7s ease-in-out infinite,
          sway 1.6s ease-in-out infinite reverse;
        filter: blur(2px);
      }

      @keyframes flicker1 {
        0%,
        100% {
          height: 260px;
          opacity: 0.95;
          border-radius: 50% 50% 20% 20% / 60% 60% 40% 40%;
        }
        50% {
          height: 290px;
          opacity: 1;
          border-radius: 50% 50% 30% 30% / 70% 70% 30% 30%;
        }
      }
      @keyframes flicker2 {
        0%,
        100% {
          height: 220px;
          opacity: 0.9;
        }
        33% {
          height: 240px;
          opacity: 1;
        }
        66% {
          height: 200px;
          opacity: 0.85;
        }
      }
      @keyframes flicker3 {
        0%,
        100% {
          height: 180px;
          opacity: 0.95;
        }
        50% {
          height: 210px;
          opacity: 1;
        }
      }
      @keyframes flicker4 {
        0%,
        100% {
          height: 130px;
          opacity: 0.9;
        }
        50% {
          height: 160px;
          opacity: 1;
        }
      }
      @keyframes sway {
        0%,
        100% {
          transform: translateX(-50%) rotate(-3deg) skewX(-2deg);
        }
        50% {
          transform: translateX(-50%) rotate(3deg) skewX(2deg);
        }
      }

      /* 火光地面发光 */
      .glow {
        position: absolute;
        bottom: -20px;
        left: 50%;
        transform: translateX(-50%);
        width: 400px;
        height: 200px;
        background: radial-gradient(
          ellipse at center,
          rgba(255, 120, 0, 0.4) 0%,
          rgba(255, 60, 0, 0.15) 40%,
          transparent 70%
        );
        filter: blur(20px);
        animation: glowPulse 2s ease-in-out infinite;
        z-index: 1;
      }
      @keyframes glowPulse {
        0%,
        100% {
          opacity: 0.7;
          transform: translateX(-50%) scale(1);
        }
        50% {
          opacity: 1;
          transform: translateX(-50%) scale(1.1);
        }
      }

      /* 飘散的火星 */
      .spark {
        position: absolute;
        bottom: 60px;
        left: 50%;
        width: 3px;
        height: 3px;
        background: #ffcc44;
        border-radius: 50%;
        box-shadow: 0 0 6px #ff8800;
        opacity: 0;
      }

      .hint {
        position: absolute;
        bottom: 20px;
        left: 0;
        right: 0;
        text-align: center;
        color: rgba(255, 160, 80, 0.5);
        font-size: 13px;
        letter-spacing: 3px;
      }
    </style>
  </head>
  <body>
    <h1>熊 熊 烈 火</h1>
    <div class="scene">
      <div class="campfire">
        <div class="glow"></div>
        <div class="flames">
          <div class="flame f1"></div>
          <div class="flame f2"></div>
          <div class="flame f3"></div>
          <div class="flame f4"></div>
        </div>
        <div class="logs">
          <div class="log log1"></div>
          <div class="log log2"></div>
        </div>
      </div>
    </div>
    <div class="hint">多层火焰叠加 · 边缘变形 · 颜色渐变 · 模糊混合</div>

    <script>
      // 生成飘散的火星
      const campfire = document.querySelector('.campfire');
      function spawnSpark() {
        const spark = document.createElement('div');
        spark.className = 'spark';
        const startX = (Math.random() - 0.5) * 80;
        const drift = (Math.random() - 0.5) * 120;
        const rise = 200 + Math.random() * 200;
        const dur = 1.5 + Math.random() * 1.5;
        spark.style.left = `calc(50% + ${startX}px)`;
        spark.style.background = Math.random() > 0.5 ? '#ffcc44' : '#ff8833';
        campfire.appendChild(spark);

        const anim = spark.animate(
          [
            { transform: 'translate(0,0) scale(1)', opacity: 1 },
            { transform: `translate(${drift}px, -${rise}px) scale(0)`, opacity: 0 },
          ],
          { duration: dur * 1000, easing: 'ease-out' }
        );
        anim.onfinish = () => spark.remove();
      }
      setInterval(spawnSpark, 120);
    </script>
  </body>
</html>
