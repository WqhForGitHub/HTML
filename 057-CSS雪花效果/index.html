<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS雪花效果</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100vh;
        overflow: hidden;
        font-family: 'Microsoft YaHei', sans-serif;
        color: #fff;
      }
      body {
        background: linear-gradient(to bottom, #1a2a4a 0%, #2c4a7a 40%, #5a7baa 75%, #8aabcd 100%);
        position: relative;
      }
      h1 {
        position: absolute;
        top: 40px;
        left: 0;
        right: 0;
        text-align: center;
        font-size: 30px;
        letter-spacing: 10px;
        color: rgba(255, 255, 255, 0.95);
        text-shadow: 0 4px 20px rgba(0, 40, 80, 0.5);
        z-index: 10;
      }
      .hint {
        position: absolute;
        bottom: 25px;
        left: 0;
        right: 0;
        text-align: center;
        color: rgba(255, 255, 255, 0.7);
        font-size: 13px;
        letter-spacing: 3px;
        z-index: 10;
      }

      /* 远山雪景剪影 */
      .landscape {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 35%;
        z-index: 2;
      }
      .hill {
        position: absolute;
        bottom: 0;
        border-radius: 50% 50% 0 0 / 100% 100% 0 0;
        background: linear-gradient(to top, #ffffff 0%, #e8f0fa 40%, #c8d8e8 100%);
      }
      .hill1 {
        left: -10%;
        width: 70%;
        height: 60%;
        opacity: 0.9;
      }
      .hill2 {
        right: -10%;
        width: 65%;
        height: 70%;
        opacity: 0.85;
      }
      .hill3 {
        left: 30%;
        width: 55%;
        height: 45%;
        opacity: 0.95;
        background: linear-gradient(to top, #f0f6fc 0%, #d8e6f2 60%, #b8cce0 100%);
      }
      /* 树木 */
      .tree {
        position: absolute;
        bottom: 0;
        width: 0;
        height: 0;
        border-left: 12px solid transparent;
        border-right: 12px solid transparent;
        border-bottom: 50px solid #2a4a3a;
      }
      .tree::after {
        content: '';
        position: absolute;
        top: 30px;
        left: -8px;
        width: 0;
        height: 0;
        border-left: 10px solid transparent;
        border-right: 10px solid transparent;
        border-bottom: 40px solid #2a4a3a;
      }

      .snowfield {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 15%;
        background: linear-gradient(to top, #ffffff, #d8e6f2);
        z-index: 3;
        box-shadow: 0 5px 30px rgba(255, 255, 255, 0.5);
      }

      /* 雪花容器 */
      .snow-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 5;
      }
      .snowflake {
        position: absolute;
        top: -20px;
        color: #fff;
        user-select: none;
        text-shadow: 0 0 5px rgba(255, 255, 255, 0.8);
        animation-name: fall;
        animation-timing-function: linear;
        animation-iteration-count: infinite;
      }
      @keyframes fall {
        0% {
          transform: translate3d(0, -10vh, 0) rotate(0deg);
          opacity: 0;
        }
        10% {
          opacity: 1;
        }
        90% {
          opacity: 1;
        }
        100% {
          transform: translate3d(var(--drift), 110vh, 0) rotate(360deg);
          opacity: 0.3;
        }
      }
      .controls {
        position: absolute;
        top: 100px;
        left: 0;
        right: 0;
        text-align: center;
        z-index: 10;
      }
      .controls button {
        padding: 8px 20px;
        margin: 0 8px;
        background: rgba(255, 255, 255, 0.15);
        border: 1px solid rgba(255, 255, 255, 0.4);
        color: #fff;
        border-radius: 20px;
        cursor: pointer;
        letter-spacing: 2px;
        font-size: 13px;
        backdrop-filter: blur(8px);
        transition: all 0.3s;
      }
      .controls button:hover {
        background: rgba(255, 255, 255, 0.3);
      }
      .controls button.active {
        background: rgba(255, 255, 255, 0.4);
        border-color: #fff;
      }
    </style>
  </head>
  <body>
    <h1>漫 天 飞 雪</h1>
    <div class="controls">
      <button id="bLight">小雪</button>
      <button id="bMed" class="active">中雪</button>
      <button id="bHeavy">大雪</button>
      <button id="bBliz">暴雪</button>
    </div>
    <div class="landscape">
      <div class="hill hill1"></div>
      <div class="hill hill3"></div>
      <div class="hill hill2"></div>
      <div class="tree" style="left: 15%; bottom: 8%"></div>
      <div class="tree" style="left: 75%; bottom: 10%; transform: scale(0.8)"></div>
      <div class="tree" style="left: 85%; bottom: 5%; transform: scale(1.2)"></div>
      <div class="tree" style="left: 8%; bottom: 3%; transform: scale(0.7)"></div>
    </div>
    <div class="snowfield"></div>
    <div class="snow-container" id="container"></div>
    <div class="hint">不同尺寸 · 速度 · 漂移的雪花飘落 · 切换雪量感受变化</div>

    <script>
      const container = document.getElementById('container');
      const symbols = ['❄', '❅', '❆', '✻', '✼', '•'];
      const densityMap = { light: 50, med: 120, heavy: 220, bliz: 380 };

      function clearSnow() {
        container.innerHTML = '';
      }

      function makeSnow(count) {
        clearSnow();
        for (let i = 0; i < count; i++) {
          const flake = document.createElement('div');
          flake.className = 'snowflake';
          const size = 6 + Math.random() * 18;
          const symbol = symbols[Math.floor(Math.random() * symbols.length)];
          flake.textContent = symbol;
          flake.style.fontSize = size + 'px';
          flake.style.left = Math.random() * 100 + 'vw';
          const dur = 5 + Math.random() * 8;
          flake.style.animationDuration = dur + 's';
          flake.style.animationDelay = -Math.random() * dur + 's';
          const drift = (Math.random() - 0.5) * 200;
          flake.style.setProperty('--drift', drift + 'px');
          flake.style.opacity = 0.5 + Math.random() * 0.5;
          container.appendChild(flake);
        }
      }

      function setActive(btn) {
        document.querySelectorAll('.controls button').forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
      }

      document.getElementById('bLight').addEventListener('click', (e) => {
        setActive(e.target);
        makeSnow(densityMap.light);
      });
      document.getElementById('bMed').addEventListener('click', (e) => {
        setActive(e.target);
        makeSnow(densityMap.med);
      });
      document.getElementById('bHeavy').addEventListener('click', (e) => {
        setActive(e.target);
        makeSnow(densityMap.heavy);
      });
      document.getElementById('bBliz').addEventListener('click', (e) => {
        setActive(e.target);
        makeSnow(densityMap.bliz);
      });

      makeSnow(densityMap.med);
    </script>
  </body>
</html>
