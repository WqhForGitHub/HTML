<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Canvas画板</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 20px;
      }
      h1 {
        color: #fff;
        margin-bottom: 15px;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
      }
      .toolbar {
        background: #fff;
        border-radius: 12px;
        padding: 15px 20px;
        display: flex;
        flex-wrap: wrap;
        gap: 18px;
        align-items: center;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
        margin-bottom: 15px;
        width: 100%;
        max-width: 900px;
      }
      .tool-group {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .tool-group label {
        font-size: 14px;
        color: #333;
        font-weight: 600;
      }
      input[type='color'] {
        width: 50px;
        height: 36px;
        border: 2px solid #ddd;
        border-radius: 8px;
        cursor: pointer;
        padding: 2px;
        background: #fff;
      }
      input[type='range'] {
        width: 140px;
        cursor: pointer;
      }
      .size-value {
        min-width: 35px;
        text-align: center;
        font-weight: 700;
        color: #667eea;
      }
      button {
        background: linear-gradient(135deg, #667eea, #764ba2);
        color: #fff;
        border: none;
        padding: 9px 18px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 14px;
        font-weight: 600;
        transition:
          transform 0.15s,
          box-shadow 0.15s;
      }
      button:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
      }
      button:active {
        transform: translateY(0);
      }
      button.danger {
        background: linear-gradient(135deg, #f5576c, #f093fb);
      }
      button.success {
        background: linear-gradient(135deg, #43e97b, #38f9d7);
        color: #006d3a;
      }
      .canvas-wrapper {
        background: #fff;
        border-radius: 12px;
        padding: 10px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
      }
      canvas {
        border: 2px solid #e0e0e0;
        border-radius: 8px;
        cursor: crosshair;
        display: block;
        background: #fff;
        touch-action: none;
      }
      .hint {
        color: rgba(255, 255, 255, 0.85);
        font-size: 13px;
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <h1>Canvas画板</h1>
    <div class="toolbar">
      <div class="tool-group">
        <label>颜色:</label>
        <input type="color" id="colorPicker" value="#667eea" />
      </div>
      <div class="tool-group">
        <label>笔刷大小:</label>
        <input type="range" id="brushSize" min="1" max="50" value="5" />
        <span class="size-value" id="sizeValue">5</span>
      </div>
      <div class="tool-group">
        <button class="danger" id="clearBtn">清空画板</button>
        <button class="success" id="saveBtn">保存为PNG</button>
      </div>
    </div>
    <div class="canvas-wrapper">
      <canvas id="drawCanvas" width="860" height="520"></canvas>
    </div>
    <p class="hint">使用鼠标或触摸在画板上自由绘画</p>

    <script>
      (function () {
        const canvas = document.getElementById('drawCanvas');
        const ctx = canvas.getContext('2d');
        const colorPicker = document.getElementById('colorPicker');
        const brushSize = document.getElementById('brushSize');
        const sizeValue = document.getElementById('sizeValue');
        const clearBtn = document.getElementById('clearBtn');
        const saveBtn = document.getElementById('saveBtn');

        let drawing = false;
        let lastX = 0,
          lastY = 0;
        let currentColor = '#667eea';
        let currentSize = 5;

        // 初始化白色背景
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        function getPos(e) {
          const rect = canvas.getBoundingClientRect();
          const scaleX = canvas.width / rect.width;
          const scaleY = canvas.height / rect.height;
          let clientX, clientY;
          if (e.touches && e.touches.length) {
            clientX = e.touches[0].clientX;
            clientY = e.touches[0].clientY;
          } else {
            clientX = e.clientX;
            clientY = e.clientY;
          }
          return {
            x: (clientX - rect.left) * scaleX,
            y: (clientY - rect.top) * scaleY,
          };
        }

        function startDraw(e) {
          e.preventDefault();
          drawing = true;
          const p = getPos(e);
          lastX = p.x;
          lastY = p.y;
          // 画一个点
          ctx.beginPath();
          ctx.fillStyle = currentColor;
          ctx.arc(lastX, lastY, currentSize / 2, 0, Math.PI * 2);
          ctx.fill();
        }

        function draw(e) {
          if (!drawing) return;
          e.preventDefault();
          const p = getPos(e);
          ctx.strokeStyle = currentColor;
          ctx.lineWidth = currentSize;
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          ctx.beginPath();
          ctx.moveTo(lastX, lastY);
          // 使用二次贝塞尔曲线平滑
          const midX = (lastX + p.x) / 2;
          const midY = (lastY + p.y) / 2;
          ctx.quadraticCurveTo(lastX, lastY, midX, midY);
          ctx.stroke();
          lastX = p.x;
          lastY = p.y;
        }

        function endDraw() {
          drawing = false;
        }

        canvas.addEventListener('mousedown', startDraw);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', endDraw);
        canvas.addEventListener('mouseleave', endDraw);
        canvas.addEventListener('touchstart', startDraw, { passive: false });
        canvas.addEventListener('touchmove', draw, { passive: false });
        canvas.addEventListener('touchend', endDraw);

        colorPicker.addEventListener('input', function () {
          currentColor = this.value;
        });

        brushSize.addEventListener('input', function () {
          currentSize = parseInt(this.value, 10);
          sizeValue.textContent = currentSize;
        });

        clearBtn.addEventListener('click', function () {
          if (confirm('确定要清空画板吗？')) {
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
          }
        });

        saveBtn.addEventListener('click', function () {
          const link = document.createElement('a');
          link.download = '我的画板作品.png';
          link.href = canvas.toDataURL('image/png');
          link.click();
        });
      })();
    </script>
  </body>
</html>
