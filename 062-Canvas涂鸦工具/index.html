<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Canvas涂鸦工具</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
        background: #1a1a2e;
        color: #eee;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 20px;
      }
      h1 {
        margin-bottom: 15px;
        background: linear-gradient(90deg, #e94057, #f27121);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .toolbar {
        background: #16213e;
        border-radius: 12px;
        padding: 15px 20px;
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        align-items: center;
        margin-bottom: 15px;
        width: 100%;
        max-width: 920px;
        border: 1px solid #0f3460;
      }
      .tool-group {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 10px;
        border-right: 1px solid #0f3460;
      }
      .tool-group:last-child {
        border-right: none;
      }
      label {
        font-size: 13px;
        color: #a0a0c0;
        font-weight: 600;
      }
      .brush-types {
        display: flex;
        gap: 6px;
      }
      .brush-btn {
        background: #0f3460;
        color: #eee;
        border: 2px solid transparent;
        padding: 7px 14px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 13px;
        transition: all 0.2s;
      }
      .brush-btn:hover {
        background: #1a4a8a;
      }
      .brush-btn.active {
        background: linear-gradient(135deg, #e94057, #f27121);
        border-color: #f27121;
      }
      input[type='color'] {
        width: 46px;
        height: 34px;
        border: 2px solid #0f3460;
        border-radius: 8px;
        cursor: pointer;
        background: transparent;
        padding: 2px;
      }
      input[type='range'] {
        width: 120px;
        cursor: pointer;
      }
      .size-value {
        min-width: 30px;
        text-align: center;
        font-weight: 700;
        color: #f27121;
      }
      .palette {
        display: flex;
        gap: 4px;
      }
      .color-swatch {
        width: 24px;
        height: 24px;
        border-radius: 6px;
        cursor: pointer;
        border: 2px solid transparent;
        transition: transform 0.15s;
      }
      .color-swatch:hover {
        transform: scale(1.15);
      }
      .color-swatch.active {
        border-color: #fff;
        transform: scale(1.15);
      }
      button.action {
        background: #0f3460;
        color: #eee;
        border: none;
        padding: 8px 14px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 13px;
        font-weight: 600;
        transition: all 0.2s;
      }
      button.action:hover {
        background: #1a4a8a;
      }
      button.action.danger {
        background: #c0392b;
      }
      button.action.danger:hover {
        background: #e74c3c;
      }
      button.action.success {
        background: #27ae60;
      }
      button.action.success:hover {
        background: #2ecc71;
      }
      button.action:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      .canvas-wrapper {
        background: #fff;
        border-radius: 12px;
        padding: 8px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      }
      canvas {
        border-radius: 8px;
        cursor: crosshair;
        display: block;
        touch-action: none;
        background: #fff;
      }
      .hint {
        color: #888;
        font-size: 12px;
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <h1>Canvas涂鸦工具</h1>
    <div class="toolbar">
      <div class="tool-group">
        <label>笔刷:</label>
        <div class="brush-types">
          <button class="brush-btn active" data-brush="pen">钢笔</button>
          <button class="brush-btn" data-brush="marker">马克笔</button>
          <button class="brush-btn" data-brush="spray">喷雾</button>
          <button class="brush-btn" data-brush="neon">霓虹</button>
        </div>
      </div>
      <div class="tool-group">
        <label>调色板:</label>
        <div class="palette">
          <div class="color-swatch active" style="background: #000000" data-color="#000000"></div>
          <div class="color-swatch" style="background: #e74c3c" data-color="#e74c3c"></div>
          <div class="color-swatch" style="background: #e67e22" data-color="#e67e22"></div>
          <div class="color-swatch" style="background: #f1c40f" data-color="#f1c40f"></div>
          <div class="color-swatch" style="background: #2ecc71" data-color="#2ecc71"></div>
          <div class="color-swatch" style="background: #3498db" data-color="#3498db"></div>
          <div class="color-swatch" style="background: #9b59b6" data-color="#9b59b6"></div>
          <div class="color-swatch" style="background: #ec407a" data-color="#ec407a"></div>
        </div>
        <input type="color" id="customColor" value="#000000" />
      </div>
      <div class="tool-group">
        <label>大小:</label>
        <input type="range" id="brushSize" min="1" max="60" value="6" />
        <span class="size-value" id="sizeValue">6</span>
      </div>
      <div class="tool-group">
        <button class="brush-btn" data-brush="eraser">橡皮擦</button>
      </div>
      <div class="tool-group">
        <button class="action" id="undoBtn">撤销</button>
        <button class="action" id="redoBtn">重做</button>
        <button class="action danger" id="clearBtn">清空</button>
        <button class="action success" id="saveBtn">保存</button>
      </div>
    </div>
    <div class="canvas-wrapper">
      <canvas id="drawCanvas" width="880" height="500"></canvas>
    </div>
    <p class="hint">提示: 选择笔刷类型和颜色，在画板上自由涂鸦。支持撤销/重做。</p>

    <script>
      (function () {
        const canvas = document.getElementById('drawCanvas');
        const ctx = canvas.getContext('2d');
        const brushSizeInput = document.getElementById('brushSize');
        const sizeValue = document.getElementById('sizeValue');
        const customColor = document.getElementById('customColor');
        const clearBtn = document.getElementById('clearBtn');
        const saveBtn = document.getElementById('saveBtn');
        const undoBtn = document.getElementById('undoBtn');
        const redoBtn = document.getElementById('redoBtn');

        let drawing = false;
        let lastX = 0,
          lastY = 0;
        let currentColor = '#000000';
        let currentSize = 6;
        let currentBrush = 'pen';
        let isEraser = false;

        // 历史记录
        const history = [];
        let historyIndex = -1;
        const MAX_HISTORY = 30;

        function saveState() {
          // 删除当前位置之后的历史
          if (historyIndex < history.length - 1) {
            history.splice(historyIndex + 1);
          }
          history.push(canvas.toDataURL());
          if (history.length > MAX_HISTORY) {
            history.shift();
          } else {
            historyIndex++;
          }
          updateUndoRedo();
        }

        function restoreState(index) {
          if (index < 0 || index >= history.length) return;
          const img = new Image();
          img.onload = function () {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(img, 0, 0);
          };
          img.src = history[index];
        }

        function updateUndoRedo() {
          undoBtn.disabled = historyIndex <= 0;
          redoBtn.disabled = historyIndex >= history.length - 1;
        }

        // 初始化白色背景
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        saveState();

        function getPos(e) {
          const rect = canvas.getBoundingClientRect();
          const scaleX = canvas.width / rect.width;
          const scaleY = canvas.height / rect.height;
          let cx, cy;
          if (e.touches && e.touches.length) {
            cx = e.touches[0].clientX;
            cy = e.touches[0].clientY;
          } else {
            cx = e.clientX;
            cy = e.clientY;
          }
          return { x: (cx - rect.left) * scaleX, y: (cy - rect.top) * scaleY };
        }

        function startDraw(e) {
          e.preventDefault();
          drawing = true;
          const p = getPos(e);
          lastX = p.x;
          lastY = p.y;
          drawSegment(lastX, lastY, lastX, lastY);
        }

        function drawSegment(x1, y1, x2, y2) {
          if (isEraser) {
            ctx.globalCompositeOperation = 'destination-out';
            ctx.strokeStyle = 'rgba(0,0,0,1)';
            ctx.lineWidth = currentSize * 2;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.stroke();
            ctx.globalCompositeOperation = 'source-over';
            return;
          }

          ctx.globalCompositeOperation = 'source-over';

          if (currentBrush === 'pen') {
            ctx.strokeStyle = currentColor;
            ctx.lineWidth = currentSize;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.globalAlpha = 1;
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.stroke();
          } else if (currentBrush === 'marker') {
            ctx.strokeStyle = currentColor;
            ctx.lineWidth = currentSize * 2;
            ctx.lineCap = 'square';
            ctx.lineJoin = 'miter';
            ctx.globalAlpha = 0.35;
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.stroke();
            ctx.globalAlpha = 1;
          } else if (currentBrush === 'spray') {
            ctx.fillStyle = currentColor;
            ctx.globalAlpha = 0.6;
            const density = currentSize * 2;
            const radius = currentSize * 2;
            for (let i = 0; i < density; i++) {
              const angle = Math.random() * Math.PI * 2;
              const r = Math.random() * radius;
              const px = x2 + Math.cos(angle) * r;
              const py = y2 + Math.sin(angle) * r;
              ctx.beginPath();
              ctx.arc(px, py, Math.random() * 1.5 + 0.3, 0, Math.PI * 2);
              ctx.fill();
            }
            ctx.globalAlpha = 1;
          } else if (currentBrush === 'neon') {
            ctx.strokeStyle = currentColor;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.shadowColor = currentColor;
            ctx.shadowBlur = currentSize * 2;
            ctx.lineWidth = currentSize * 0.6;
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.stroke();
            // 内部亮线
            ctx.shadowBlur = 0;
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = currentSize * 0.25;
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.stroke();
          }
        }

        function draw(e) {
          if (!drawing) return;
          e.preventDefault();
          const p = getPos(e);
          drawSegment(lastX, lastY, p.x, p.y);
          lastX = p.x;
          lastY = p.y;
        }

        function endDraw() {
          if (drawing) {
            drawing = false;
            saveState();
          }
        }

        canvas.addEventListener('mousedown', startDraw);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', endDraw);
        canvas.addEventListener('mouseleave', endDraw);
        canvas.addEventListener('touchstart', startDraw, { passive: false });
        canvas.addEventListener('touchmove', draw, { passive: false });
        canvas.addEventListener('touchend', endDraw);

        // 笔刷类型选择
        document.querySelectorAll('.brush-btn').forEach(function (btn) {
          btn.addEventListener('click', function () {
            const brush = this.getAttribute('data-brush');
            if (brush === 'eraser') {
              isEraser = true;
              document.querySelectorAll('.brush-btn').forEach(function (b) {
                b.classList.remove('active');
              });
              this.classList.add('active');
              canvas.style.cursor = 'cell';
            } else {
              isEraser = false;
              currentBrush = brush;
              document.querySelectorAll('.brush-btn').forEach(function (b) {
                b.classList.remove('active');
              });
              this.classList.add('active');
              canvas.style.cursor = 'crosshair';
            }
          });
        });

        // 调色板
        document.querySelectorAll('.color-swatch').forEach(function (sw) {
          sw.addEventListener('click', function () {
            currentColor = this.getAttribute('data-color');
            customColor.value = currentColor;
            document.querySelectorAll('.color-swatch').forEach(function (s) {
              s.classList.remove('active');
            });
            this.classList.add('active');
            // 如果是橡皮擦，切回钢笔
            if (isEraser) {
              isEraser = false;
              currentBrush = 'pen';
              document.querySelectorAll('.brush-btn').forEach(function (b) {
                b.classList.toggle('active', b.getAttribute('data-brush') === 'pen');
              });
              canvas.style.cursor = 'crosshair';
            }
          });
        });

        customColor.addEventListener('input', function () {
          currentColor = this.value;
          document.querySelectorAll('.color-swatch').forEach(function (s) {
            s.classList.remove('active');
          });
          if (isEraser) {
            isEraser = false;
            currentBrush = 'pen';
            document.querySelectorAll('.brush-btn').forEach(function (b) {
              b.classList.toggle('active', b.getAttribute('data-brush') === 'pen');
            });
          }
        });

        brushSizeInput.addEventListener('input', function () {
          currentSize = parseInt(this.value, 10);
          sizeValue.textContent = currentSize;
        });

        undoBtn.addEventListener('click', function () {
          if (historyIndex > 0) {
            historyIndex--;
            restoreState(historyIndex);
            updateUndoRedo();
          }
        });

        redoBtn.addEventListener('click', function () {
          if (historyIndex < history.length - 1) {
            historyIndex++;
            restoreState(historyIndex);
            updateUndoRedo();
          }
        });

        clearBtn.addEventListener('click', function () {
          if (confirm('确定要清空画板吗？')) {
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            saveState();
          }
        });

        saveBtn.addEventListener('click', function () {
          const link = document.createElement('a');
          link.download = '涂鸦作品.png';
          link.href = canvas.toDataURL('image/png');
          link.click();
        });

        updateUndoRedo();
      })();
    </script>
  </body>
</html>
