<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Canvas电子签名</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
        background: #f5f7fa;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 30px 20px;
      }
      .header {
        text-align: center;
        margin-bottom: 20px;
      }
      h1 {
        color: #2c3e50;
        margin-bottom: 6px;
      }
      .subtitle {
        color: #7f8c8d;
        font-size: 14px;
      }
      .document {
        background: #fff;
        width: 100%;
        max-width: 800px;
        border-radius: 10px;
        box-shadow: 0 6px 30px rgba(0, 0, 0, 0.12);
        padding: 35px 45px;
        margin-bottom: 20px;
        position: relative;
      }
      .document::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 6px;
        background: linear-gradient(90deg, #3498db, #2c3e50);
        border-radius: 10px 10px 0 0;
      }
      .doc-title {
        font-size: 22px;
        color: #2c3e50;
        text-align: center;
        margin-bottom: 20px;
        font-weight: 700;
      }
      .doc-content {
        color: #555;
        line-height: 1.9;
        font-size: 14px;
        margin-bottom: 25px;
        text-indent: 2em;
      }
      .signature-area {
        position: relative;
        margin-top: 20px;
      }
      .signature-label {
        color: #2c3e50;
        font-size: 14px;
        margin-bottom: 8px;
        font-weight: 600;
      }
      .signature-canvas-wrapper {
        position: relative;
        background: #fff;
        border: 1px solid #d5dbdb;
        border-radius: 6px;
        overflow: hidden;
      }
      canvas {
        display: block;
        cursor: crosshair;
        touch-action: none;
        background: linear-gradient(to bottom, transparent 95%, #ecf0f1 95%);
      }
      .sign-line {
        position: absolute;
        bottom: 30px;
        left: 40px;
        right: 40px;
        height: 1px;
        background: #bdc3c7;
        pointer-events: none;
      }
      .sign-here {
        position: absolute;
        bottom: 10px;
        left: 40px;
        color: #bdc3c7;
        font-size: 13px;
        pointer-events: none;
        user-select: none;
      }
      .date-line {
        display: flex;
        justify-content: flex-end;
        margin-top: 15px;
        color: #7f8c8d;
        font-size: 14px;
      }
      .date-line span {
        border-bottom: 1px solid #bdc3c7;
        padding: 0 60px 2px 8px;
      }
      .toolbar {
        background: #fff;
        border-radius: 10px;
        padding: 14px 20px;
        display: flex;
        gap: 14px;
        align-items: center;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
        flex-wrap: wrap;
        width: 100%;
        max-width: 800px;
        justify-content: center;
      }
      button {
        border: none;
        padding: 10px 22px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 14px;
        font-weight: 600;
        transition: all 0.2s;
      }
      button:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
      }
      .btn-clear {
        background: #e74c3c;
        color: #fff;
      }
      .btn-undo {
        background: #95a5a6;
        color: #fff;
      }
      .btn-save {
        background: #27ae60;
        color: #fff;
      }
      .status {
        color: #7f8c8d;
        font-size: 13px;
        margin-top: 12px;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <h1>Canvas电子签名</h1>
      <p class="subtitle">请在下方签名区域内签署您的姓名</p>
    </div>

    <div class="document">
      <div class="doc-title">电子签名确认书</div>
      <div class="doc-content">
        本人已仔细阅读并完全理解上述文件的全部内容，确认所填写信息真实有效。本人同意以此电子签名作为本次操作的合法有效凭证，并承担由此产生的一切法律责任。特此签字确认。
      </div>
      <div class="signature-area">
        <div class="signature-label">请在此处签名:</div>
        <div class="signature-canvas-wrapper">
          <canvas id="sigCanvas" width="710" height="220"></canvas>
          <div class="sign-line"></div>
          <div class="sign-here">请在横线上方签名</div>
        </div>
      </div>
      <div class="date-line">
        日期:
        <span id="dateStr"></span>
      </div>
    </div>

    <div class="toolbar">
      <button class="btn-undo" id="undoBtn">撤销</button>
      <button class="btn-clear" id="clearBtn">清除签名</button>
      <button class="btn-save" id="saveBtn">下载签名(PNG)</button>
    </div>
    <p class="status" id="status">签名速度会影响线条粗细，慢签则粗，快签则细</p>

    <script>
      (function () {
        const canvas = document.getElementById('sigCanvas');
        const ctx = canvas.getContext('2d');
        const clearBtn = document.getElementById('clearBtn');
        const undoBtn = document.getElementById('undoBtn');
        const saveBtn = document.getElementById('saveBtn');
        const status = document.getElementById('status');

        // 显示日期
        const now = new Date();
        document.getElementById('dateStr').textContent =
          now.getFullYear() + '年' + (now.getMonth() + 1) + '月' + now.getDate() + '日';

        let drawing = false;
        let lastX = 0,
          lastY = 0,
          lastTime = 0;
        let lastWidth = 2.5;
        let strokes = []; // 存储所有笔画用于撤销
        let currentStroke = [];

        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.strokeStyle = '#1a2a4a';

        function getPos(e) {
          const rect = canvas.getBoundingClientRect();
          const scaleX = canvas.width / rect.width;
          const scaleY = canvas.height / rect.height;
          let cx, cy;
          if (e.touches && e.touches.length) {
            cx = e.touches[0].clientX;
            cy = e.touches[0].clientY;
          } else {
            cx = e.clientX;
            cy = e.clientY;
          }
          return { x: (cx - rect.left) * scaleX, y: (cy - rect.top) * scaleY };
        }

        function startDraw(e) {
          e.preventDefault();
          drawing = true;
          const p = getPos(e);
          lastX = p.x;
          lastY = p.y;
          lastTime = Date.now();
          lastWidth = 2.8;
          currentStroke = [{ x: p.x, y: p.y, w: lastWidth }];
          // 画起点
          ctx.beginPath();
          ctx.fillStyle = '#1a2a4a';
          ctx.arc(p.x, p.y, lastWidth / 2, 0, Math.PI * 2);
          ctx.fill();
        }

        function draw(e) {
          if (!drawing) return;
          e.preventDefault();
          const p = getPos(e);
          const now = Date.now();
          const dt = Math.max(1, now - lastTime);
          const dx = p.x - lastX;
          const dy = p.y - lastY;
          const dist = Math.sqrt(dx * dx + dy * dy);
          const speed = dist / dt; // px/ms

          // 速度越快线越细
          let targetWidth = 4.5 - speed * 3;
          if (targetWidth < 0.8) targetWidth = 0.8;
          if (targetWidth > 4.5) targetWidth = 4.5;

          // 平滑过渡
          const width = lastWidth * 0.6 + targetWidth * 0.4;
          const midWidth = (lastWidth + width) / 2;

          ctx.strokeStyle = '#1a2a4a';
          ctx.lineWidth = midWidth;
          ctx.beginPath();
          ctx.moveTo(lastX, lastY);
          const midX = (lastX + p.x) / 2;
          const midY = (lastY + p.y) / 2;
          ctx.quadraticCurveTo(lastX, lastY, midX, midY);
          ctx.stroke();

          currentStroke.push({ x: p.x, y: p.y, w: width });
          lastX = p.x;
          lastY = p.y;
          lastTime = now;
          lastWidth = width;
        }

        function endDraw() {
          if (drawing) {
            drawing = false;
            if (currentStroke.length > 1) {
              strokes.push(currentStroke);
            }
            currentStroke = [];
            status.textContent = '签名已记录，可继续签名或下载';
          }
        }

        function redrawAll() {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          strokes.forEach(function (stroke) {
            if (stroke.length < 2) {
              if (stroke.length === 1) {
                ctx.beginPath();
                ctx.fillStyle = '#1a2a4a';
                ctx.arc(stroke[0].x, stroke[0].y, stroke[0].w / 2, 0, Math.PI * 2);
                ctx.fill();
              }
              return;
            }
            // 画起点
            ctx.beginPath();
            ctx.fillStyle = '#1a2a4a';
            ctx.arc(stroke[0].x, stroke[0].y, stroke[0].w / 2, 0, Math.PI * 2);
            ctx.fill();

            for (let i = 1; i < stroke.length; i++) {
              const prev = stroke[i - 1];
              const cur = stroke[i];
              const midW = (prev.w + cur.w) / 2;
              ctx.strokeStyle = '#1a2a4a';
              ctx.lineWidth = midW;
              ctx.beginPath();
              ctx.moveTo(prev.x, prev.y);
              const midX = (prev.x + cur.x) / 2;
              const midY = (prev.y + cur.y) / 2;
              ctx.quadraticCurveTo(prev.x, prev.y, midX, midY);
              ctx.stroke();
            }
          });
        }

        canvas.addEventListener('mousedown', startDraw);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', endDraw);
        canvas.addEventListener('mouseleave', endDraw);
        canvas.addEventListener('touchstart', startDraw, { passive: false });
        canvas.addEventListener('touchmove', draw, { passive: false });
        canvas.addEventListener('touchend', endDraw);

        clearBtn.addEventListener('click', function () {
          strokes = [];
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          status.textContent = '签名已清除';
        });

        undoBtn.addEventListener('click', function () {
          if (strokes.length > 0) {
            strokes.pop();
            redrawAll();
            status.textContent = '已撤销最后一笔';
          } else {
            status.textContent = '没有可撤销的笔画';
          }
        });

        saveBtn.addEventListener('click', function () {
          if (strokes.length === 0) {
            status.textContent = '请先签名再下载';
            return;
          }
          // 合成白色背景
          const tmp = document.createElement('canvas');
          tmp.width = canvas.width;
          tmp.height = canvas.height;
          const tctx = tmp.getContext('2d');
          tctx.fillStyle = '#ffffff';
          tctx.fillRect(0, 0, tmp.width, tmp.height);
          tctx.drawImage(canvas, 0, 0);

          const link = document.createElement('a');
          link.download = '电子签名.png';
          link.href = tmp.toDataURL('image/png');
          link.click();
          status.textContent = '签名已下载';
        });
      })();
    </script>
  </body>
</html>
