<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Canvas手写笔</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: 'KaiTi', 'STKaiti', 'Microsoft YaHei', serif;
        background: #2b2b2b;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 25px 20px;
      }
      h1 {
        color: #d4af37;
        margin-bottom: 6px;
        font-size: 28px;
        letter-spacing: 4px;
      }
      .subtitle {
        color: #888;
        font-size: 13px;
        margin-bottom: 20px;
      }
      .layout {
        display: flex;
        gap: 20px;
        align-items: flex-start;
        flex-wrap: wrap;
        justify-content: center;
      }
      .sidebar {
        background: #1e1e1e;
        border: 1px solid #3a3a3a;
        border-radius: 10px;
        padding: 20px;
        width: 220px;
      }
      .sidebar h3 {
        color: #d4af37;
        font-size: 15px;
        margin-bottom: 14px;
        border-bottom: 1px solid #3a3a3a;
        padding-bottom: 8px;
        letter-spacing: 2px;
      }
      .control {
        margin-bottom: 18px;
      }
      .control label {
        display: block;
        color: #bbb;
        font-size: 13px;
        margin-bottom: 6px;
      }
      input[type='range'] {
        width: 100%;
        cursor: pointer;
      }
      .value-display {
        color: #d4af37;
        font-size: 13px;
        text-align: right;
        margin-top: 2px;
      }
      input[type='color'] {
        width: 100%;
        height: 34px;
        border: 1px solid #3a3a3a;
        border-radius: 5px;
        cursor: pointer;
        background: transparent;
        padding: 2px;
      }
      .btn-group {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-top: 8px;
      }
      button {
        border: none;
        padding: 10px;
        border-radius: 5px;
        cursor: pointer;
        font-size: 14px;
        font-weight: 600;
        transition: all 0.2s;
        font-family: inherit;
        letter-spacing: 2px;
      }
      button:hover {
        opacity: 0.85;
      }
      .btn-clear {
        background: #8b3a3a;
        color: #fff;
      }
      .btn-save {
        background: #5a7a3a;
        color: #fff;
      }
      .canvas-wrapper {
        background: #f5e6c8;
        border: 6px solid #6b4423;
        border-radius: 4px;
        padding: 0;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
        position: relative;
      }
      .canvas-wrapper::before {
        content: '';
        position: absolute;
        top: 8px;
        left: 8px;
        right: 8px;
        bottom: 8px;
        border: 1px solid #c9a96a;
        pointer-events: none;
        z-index: 1;
      }
      canvas {
        display: block;
        cursor: crosshair;
        touch-action: none;
        background: repeating-linear-gradient(
          to bottom,
          transparent,
          transparent 39px,
          rgba(107, 68, 35, 0.15) 39px,
          rgba(107, 68, 35, 0.15) 40px
        );
      }
      .hint {
        color: #888;
        font-size: 12px;
        margin-top: 14px;
        text-align: center;
        max-width: 600px;
      }
      .ink-info {
        color: #d4af37;
        font-size: 12px;
        margin-top: 10px;
        padding: 8px;
        background: #2b2b2b;
        border-radius: 5px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <h1>Canvas手写笔</h1>
    <p class="subtitle">水墨书法 · 速度感应笔锋</p>

    <div class="layout">
      <div class="sidebar">
        <h3>毛笔设置</h3>
        <div class="control">
          <label>墨色:</label>
          <input type="color" id="inkColor" value="#1a1a1a" />
        </div>
        <div class="control">
          <label>笔锋粗细 (基础):</label>
          <input type="range" id="brushSize" min="8" max="50" value="28" />
          <div class="value-display" id="sizeValue">28</div>
        </div>
        <div class="control">
          <label>速度敏感度:</label>
          <input type="range" id="sensitivity" min="1" max="10" value="6" />
          <div class="value-display" id="sensValue">6</div>
        </div>
        <div class="control">
          <label>墨水浓度:</label>
          <input type="range" id="opacity" min="30" max="100" value="85" />
          <div class="value-display" id="opacityValue">85%</div>
        </div>
        <div class="btn-group">
          <button class="btn-clear" id="clearBtn">清空宣纸</button>
          <button class="btn-save" id="saveBtn">保存作品</button>
        </div>
        <div class="ink-info" id="inkInfo">提示: 慢则粗，快则细</div>
      </div>

      <div class="canvas-wrapper">
        <canvas id="drawCanvas" width="640" height="520"></canvas>
      </div>
    </div>
    <p class="hint">运笔越慢，笔画越粗壮饱满；运笔越快，笔画越纤细轻盈，模拟毛笔提按效果。</p>

    <script>
      (function () {
        const canvas = document.getElementById('drawCanvas');
        const ctx = canvas.getContext('2d');
        const inkColor = document.getElementById('inkColor');
        const brushSize = document.getElementById('brushSize');
        const sizeValue = document.getElementById('sizeValue');
        const sensitivity = document.getElementById('sensitivity');
        const sensValue = document.getElementById('sensValue');
        const opacityInput = document.getElementById('opacity');
        const opacityValue = document.getElementById('opacityValue');
        const clearBtn = document.getElementById('clearBtn');
        const saveBtn = document.getElementById('saveBtn');
        const inkInfo = document.getElementById('inkInfo');

        let drawing = false;
        let lastX = 0,
          lastY = 0,
          lastTime = 0;
        let lastWidth = 0;
        let baseSize = 28;
        let sens = 6;
        let inkOpacity = 0.85;

        function getPos(e) {
          const rect = canvas.getBoundingClientRect();
          const scaleX = canvas.width / rect.width;
          const scaleY = canvas.height / rect.height;
          let cx, cy;
          if (e.touches && e.touches.length) {
            cx = e.touches[0].clientX;
            cy = e.touches[0].clientY;
          } else {
            cx = e.clientX;
            cy = e.clientY;
          }
          return { x: (cx - rect.left) * scaleX, y: (cy - rect.top) * scaleY };
        }

        function hexToRgb(hex) {
          const r = parseInt(hex.slice(1, 3), 16);
          const g = parseInt(hex.slice(3, 5), 16);
          const b = parseInt(hex.slice(5, 7), 16);
          return r + ',' + g + ',' + b;
        }

        function startDraw(e) {
          e.preventDefault();
          drawing = true;
          const p = getPos(e);
          lastX = p.x;
          lastY = p.y;
          lastTime = Date.now();
          lastWidth = baseSize * 0.7;
          // 起笔点
          ctx.fillStyle = 'rgba(' + hexToRgb(inkColor.value) + ',' + inkOpacity + ')';
          ctx.beginPath();
          ctx.arc(p.x, p.y, lastWidth / 2, 0, Math.PI * 2);
          ctx.fill();
        }

        function draw(e) {
          if (!drawing) return;
          e.preventDefault();
          const p = getPos(e);
          const now = Date.now();
          const dt = Math.max(1, now - lastTime);
          const dx = p.x - lastX;
          const dy = p.y - lastY;
          const dist = Math.sqrt(dx * dx + dy * dy);
          const speed = dist / dt;

          // 速度越快越细
          let targetWidth = baseSize - speed * sens * 2.5;
          if (targetWidth < baseSize * 0.15) targetWidth = baseSize * 0.15;
          if (targetWidth > baseSize) targetWidth = baseSize;

          // 平滑过渡
          const width = lastWidth * 0.5 + targetWidth * 0.5;
          const midWidth = (lastWidth + width) / 2;

          const rgb = hexToRgb(inkColor.value);
          ctx.strokeStyle = 'rgba(' + rgb + ',' + inkOpacity + ')';
          ctx.lineWidth = midWidth;
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          ctx.beginPath();
          ctx.moveTo(lastX, lastY);
          const midX = (lastX + p.x) / 2;
          const midY = (lastY + p.y) / 2;
          ctx.quadraticCurveTo(lastX, lastY, midX, midY);
          ctx.stroke();

          // 墨迹扩散效果（轻微）
          if (speed < 0.3) {
            ctx.fillStyle = 'rgba(' + rgb + ',' + inkOpacity * 0.15 + ')';
            ctx.beginPath();
            ctx.arc(p.x, p.y, width * 0.4, 0, Math.PI * 2);
            ctx.fill();
          }

          lastX = p.x;
          lastY = p.y;
          lastTime = now;
          lastWidth = width;

          inkInfo.textContent = '速度: ' + speed.toFixed(2) + ' | 笔锋: ' + width.toFixed(1);
        }

        function endDraw() {
          if (drawing) {
            drawing = false;
            // 收笔（顿笔）效果
            ctx.fillStyle = 'rgba(' + hexToRgb(inkColor.value) + ',' + inkOpacity * 0.6 + ')';
            ctx.beginPath();
            ctx.arc(lastX, lastY, lastWidth * 0.35, 0, Math.PI * 2);
            ctx.fill();
            inkInfo.textContent = '提示: 慢则粗，快则细';
          }
        }

        canvas.addEventListener('mousedown', startDraw);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', endDraw);
        canvas.addEventListener('mouseleave', endDraw);
        canvas.addEventListener('touchstart', startDraw, { passive: false });
        canvas.addEventListener('touchmove', draw, { passive: false });
        canvas.addEventListener('touchend', endDraw);

        inkColor.addEventListener('input', function () {});
        brushSize.addEventListener('input', function () {
          baseSize = parseInt(this.value, 10);
          sizeValue.textContent = baseSize;
        });
        sensitivity.addEventListener('input', function () {
          sens = parseInt(this.value, 10);
          sensValue.textContent = sens;
        });
        opacityInput.addEventListener('input', function () {
          inkOpacity = parseInt(this.value, 10) / 100;
          opacityValue.textContent = this.value + '%';
        });

        clearBtn.addEventListener('click', function () {
          if (confirm('确定要清空宣纸吗？')) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
          }
        });

        saveBtn.addEventListener('click', function () {
          // 合成宣纸背景
          const tmp = document.createElement('canvas');
          tmp.width = canvas.width;
          tmp.height = canvas.height;
          const tctx = tmp.getContext('2d');
          tctx.fillStyle = '#f5e6c8';
          tctx.fillRect(0, 0, tmp.width, tmp.height);
          tctx.drawImage(canvas, 0, 0);

          const link = document.createElement('a');
          link.download = '书法作品.png';
          link.href = tmp.toDataURL('image/png');
          link.click();
        });
      })();
    </script>
  </body>
</html>
