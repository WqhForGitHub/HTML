<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Canvas彩色画笔</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
        background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 20px;
      }
      h1 {
        background: linear-gradient(90deg, #ff0080, #ff8c00, #ffd700, #00ff80, #00bfff, #8b00ff);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-size: 200% auto;
        animation: rainbow 4s linear infinite;
        margin-bottom: 15px;
      }
      @keyframes rainbow {
        to {
          background-position: 200% center;
        }
      }
      .toolbar {
        background: rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 14px;
        padding: 16px 22px;
        display: flex;
        flex-wrap: wrap;
        gap: 18px;
        align-items: center;
        margin-bottom: 15px;
        width: 100%;
        max-width: 920px;
      }
      .tool-group {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .tool-group label {
        color: #ddd;
        font-size: 13px;
        font-weight: 600;
      }
      .mode-buttons {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .mode-btn {
        background: rgba(255, 255, 255, 0.1);
        color: #fff;
        border: 2px solid transparent;
        padding: 7px 14px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 13px;
        transition: all 0.2s;
      }
      .mode-btn:hover {
        background: rgba(255, 255, 255, 0.2);
      }
      .mode-btn.active {
        background: linear-gradient(90deg, #ff0080, #8b00ff);
        border-color: rgba(255, 255, 255, 0.5);
      }
      input[type='range'] {
        width: 130px;
        cursor: pointer;
      }
      .size-value {
        min-width: 32px;
        text-align: center;
        font-weight: 700;
        color: #ffd700;
      }
      input[type='color'] {
        width: 44px;
        height: 34px;
        border: 2px solid rgba(255, 255, 255, 0.3);
        border-radius: 8px;
        cursor: pointer;
        background: transparent;
        padding: 2px;
      }
      button.action {
        background: rgba(255, 255, 255, 0.15);
        color: #fff;
        border: none;
        padding: 8px 16px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 13px;
        font-weight: 600;
        transition: all 0.2s;
      }
      button.action:hover {
        background: rgba(255, 255, 255, 0.3);
      }
      button.action.danger {
        background: rgba(231, 76, 60, 0.7);
      }
      button.action.success {
        background: rgba(39, 174, 96, 0.7);
      }
      .canvas-wrapper {
        background: #fff;
        border-radius: 14px;
        padding: 8px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
      }
      canvas {
        border-radius: 10px;
        cursor: crosshair;
        display: block;
        touch-action: none;
        background: #fff;
      }
      .hint {
        color: rgba(255, 255, 255, 0.6);
        font-size: 13px;
        margin-top: 12px;
      }
      .color-preview {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: 3px solid #fff;
        box-shadow: 0 0 12px currentColor;
      }
    </style>
  </head>
  <body>
    <h1>Canvas彩色画笔</h1>
    <div class="toolbar">
      <div class="tool-group">
        <label>色彩模式:</label>
        <div class="mode-buttons">
          <button class="mode-btn active" data-mode="rainbow">彩虹</button>
          <button class="mode-btn" data-mode="random">随机</button>
          <button class="mode-btn" data-mode="gradient">渐变</button>
          <button class="mode-btn" data-mode="complementary">互补色</button>
        </div>
      </div>
      <div class="tool-group">
        <label>笔刷大小:</label>
        <input type="range" id="brushSize" min="2" max="50" value="12" />
        <span class="size-value" id="sizeValue">12</span>
      </div>
      <div class="tool-group">
        <label>渐变基色:</label>
        <input type="color" id="baseColor" value="#ff0080" />
        <div class="color-preview" id="colorPreview" style="background: #ff0080; color: #ff0080"></div>
      </div>
      <div class="tool-group">
        <button class="action danger" id="clearBtn">清空</button>
        <button class="action success" id="saveBtn">保存</button>
      </div>
    </div>
    <div class="canvas-wrapper">
      <canvas id="drawCanvas" width="880" height="500"></canvas>
    </div>
    <p class="hint">彩虹模式: 颜色随绘制循环变化 | 随机: 每段随机色 | 渐变: 基于基色过渡 | 互补色: 基色与互补色交替</p>

    <script>
      (function () {
        const canvas = document.getElementById('drawCanvas');
        const ctx = canvas.getContext('2d');
        const brushSize = document.getElementById('brushSize');
        const sizeValue = document.getElementById('sizeValue');
        const baseColor = document.getElementById('baseColor');
        const colorPreview = document.getElementById('colorPreview');
        const clearBtn = document.getElementById('clearBtn');
        const saveBtn = document.getElementById('saveBtn');

        let drawing = false;
        let lastX = 0,
          lastY = 0;
        let currentSize = 12;
        let mode = 'rainbow';
        let hue = 0;
        let gradientPos = 0;

        function getPos(e) {
          const rect = canvas.getBoundingClientRect();
          const scaleX = canvas.width / rect.width;
          const scaleY = canvas.height / rect.height;
          let cx, cy;
          if (e.touches && e.touches.length) {
            cx = e.touches[0].clientX;
            cy = e.touches[0].clientY;
          } else {
            cx = e.clientX;
            cy = e.clientY;
          }
          return { x: (cx - rect.left) * scaleX, y: (cy - rect.top) * scaleY };
        }

        function hslToHex(h, s, l) {
          s /= 100;
          l /= 100;
          const k = function (n) {
            return (n + h / 30) % 12;
          };
          const a = s * Math.min(l, 1 - l);
          const f = function (n) {
            return l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
          };
          const r = Math.round(255 * f(0));
          const g = Math.round(255 * f(8));
          const b = Math.round(255 * f(4));
          return 'rgb(' + r + ',' + g + ',' + b + ')';
        }

        function hexToHsl(hex) {
          const r = parseInt(hex.slice(1, 3), 16) / 255;
          const g = parseInt(hex.slice(3, 5), 16) / 255;
          const b = parseInt(hex.slice(5, 7), 16) / 255;
          const max = Math.max(r, g, b),
            min = Math.min(r, g, b);
          let h, s;
          const l = (max + min) / 2;
          if (max === min) {
            h = s = 0;
          } else {
            const d = max - min;
            s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
            switch (max) {
              case r:
                h = (g - b) / d + (g < b ? 6 : 0);
                break;
              case g:
                h = (b - r) / d + 2;
                break;
              case b:
                h = (r - g) / d + 4;
                break;
            }
            h /= 6;
          }
          return [h * 360, s * 100, l * 100];
        }

        function getCurrentColor() {
          if (mode === 'rainbow') {
            hue = (hue + 3) % 360;
            const c = hslToHex(hue, 90, 55);
            updatePreview(c);
            return c;
          } else if (mode === 'random') {
            const r = Math.floor(Math.random() * 256);
            const g = Math.floor(Math.random() * 256);
            const b = Math.floor(Math.random() * 256);
            const c = 'rgb(' + r + ',' + g + ',' + b + ')';
            updatePreview(c);
            return c;
          } else if (mode === 'gradient') {
            const baseHsl = hexToHsl(baseColor.value);
            gradientPos = (gradientPos + 5) % 360;
            const newHue = (baseHsl[0] + gradientPos) % 360;
            const c = hslToHex(newHue, 75, 55);
            updatePreview(c);
            return c;
          } else if (mode === 'complementary') {
            const baseHsl = hexToHsl(baseColor.value);
            // 在基色和互补色之间交替
            hue = (hue + 8) % 360;
            const offset = Math.sin((hue * Math.PI) / 180) * 180;
            const newHue = (baseHsl[0] + offset + 360) % 360;
            const c = hslToHex(newHue, 80, 55);
            updatePreview(c);
            return c;
          }
        }

        function updatePreview(c) {
          colorPreview.style.background = c;
          colorPreview.style.color = c;
        }

        function startDraw(e) {
          e.preventDefault();
          drawing = true;
          const p = getPos(e);
          lastX = p.x;
          lastY = p.y;
          // 起点圆
          ctx.fillStyle = getCurrentColor();
          ctx.beginPath();
          ctx.arc(p.x, p.y, currentSize / 2, 0, Math.PI * 2);
          ctx.fill();
        }

        function draw(e) {
          if (!drawing) return;
          e.preventDefault();
          const p = getPos(e);
          const color = getCurrentColor();
          ctx.strokeStyle = color;
          ctx.lineWidth = currentSize;
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          ctx.beginPath();
          ctx.moveTo(lastX, lastY);
          const midX = (lastX + p.x) / 2;
          const midY = (lastY + p.y) / 2;
          ctx.quadraticCurveTo(lastX, lastY, midX, midY);
          ctx.stroke();
          lastX = p.x;
          lastY = p.y;
        }

        function endDraw() {
          drawing = false;
        }

        canvas.addEventListener('mousedown', startDraw);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', endDraw);
        canvas.addEventListener('mouseleave', endDraw);
        canvas.addEventListener('touchstart', startDraw, { passive: false });
        canvas.addEventListener('touchmove', draw, { passive: false });
        canvas.addEventListener('touchend', endDraw);

        document.querySelectorAll('.mode-btn').forEach(function (btn) {
          btn.addEventListener('click', function () {
            mode = this.getAttribute('data-mode');
            document.querySelectorAll('.mode-btn').forEach(function (b) {
              b.classList.remove('active');
            });
            this.classList.add('active');
          });
        });

        brushSize.addEventListener('input', function () {
          currentSize = parseInt(this.value, 10);
          sizeValue.textContent = currentSize;
        });

        baseColor.addEventListener('input', function () {
          updatePreview(this.value);
        });

        clearBtn.addEventListener('click', function () {
          if (confirm('确定要清空画板吗？')) {
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
          }
        });

        // 初始化白底
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        saveBtn.addEventListener('click', function () {
          const link = document.createElement('a');
          link.download = '彩色画笔作品.png';
          link.href = canvas.toDataURL('image/png');
          link.click();
        });
      })();
    </script>
  </body>
</html>
