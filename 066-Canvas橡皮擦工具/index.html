<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Canvas橡皮擦工具</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
        background: #ecf0f1;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 20px;
      }
      h1 {
        color: #2c3e50;
        margin-bottom: 15px;
      }
      .toolbar {
        background: #fff;
        border-radius: 12px;
        padding: 15px 20px;
        display: flex;
        flex-wrap: wrap;
        gap: 18px;
        align-items: center;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        margin-bottom: 15px;
        width: 100%;
        max-width: 920px;
      }
      .tool-group {
        display: flex;
        align-items: center;
        gap: 10px;
        padding-right: 18px;
        border-right: 1px solid #e0e0e0;
      }
      .tool-group:last-child {
        border-right: none;
      }
      label {
        font-size: 13px;
        color: #555;
        font-weight: 600;
      }
      .tool-toggle {
        display: flex;
        gap: 6px;
      }
      .tool-btn {
        background: #ecf0f1;
        color: #2c3e50;
        border: 2px solid transparent;
        padding: 8px 16px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 13px;
        font-weight: 600;
        transition: all 0.2s;
      }
      .tool-btn:hover {
        background: #d5dbdb;
      }
      .tool-btn.active {
        background: linear-gradient(135deg, #3498db, #2c3e50);
        color: #fff;
        border-color: #2980b9;
      }
      .tool-btn.eraser-active {
        background: linear-gradient(135deg, #e74c3c, #c0392b);
        color: #fff;
        border-color: #c0392b;
      }
      input[type='color'] {
        width: 46px;
        height: 34px;
        border: 2px solid #d5dbdb;
        border-radius: 8px;
        cursor: pointer;
        padding: 2px;
        background: #fff;
      }
      input[type='range'] {
        width: 120px;
        cursor: pointer;
      }
      .size-value {
        min-width: 30px;
        text-align: center;
        font-weight: 700;
        color: #3498db;
      }
      .size-value.eraser {
        color: #e74c3c;
      }
      .layer-info {
        font-size: 12px;
        color: #7f8c8d;
        background: #f8f9fa;
        padding: 6px 10px;
        border-radius: 6px;
      }
      button.action {
        background: #34495e;
        color: #fff;
        border: none;
        padding: 8px 16px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 13px;
        font-weight: 600;
        transition: all 0.2s;
      }
      button.action:hover {
        background: #2c3e50;
      }
      button.action.danger {
        background: #e74c3c;
      }
      button.action.danger:hover {
        background: #c0392b;
      }
      button.action.success {
        background: #27ae60;
      }
      button.action.success:hover {
        background: #229954;
      }
      .canvas-container {
        position: relative;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
      }
      .canvas-stack {
        position: relative;
        width: 880px;
        height: 500px;
      }
      canvas {
        position: absolute;
        top: 0;
        left: 0;
        display: block;
        touch-action: none;
      }
      #bgCanvas {
        z-index: 1;
      }
      #drawCanvas {
        z-index: 2;
        cursor: crosshair;
      }
      .eraser-cursor {
        position: absolute;
        border: 2px dashed #e74c3c;
        border-radius: 50%;
        pointer-events: none;
        z-index: 3;
        display: none;
        background: rgba(231, 76, 60, 0.1);
      }
      .bg-controls {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .bg-swatch {
        width: 26px;
        height: 26px;
        border-radius: 6px;
        cursor: pointer;
        border: 2px solid transparent;
        transition: transform 0.15s;
      }
      .bg-swatch:hover {
        transform: scale(1.15);
      }
      .bg-swatch.active {
        border-color: #2c3e50;
      }
      .hint {
        color: #7f8c8d;
        font-size: 13px;
        margin-top: 12px;
      }
    </style>
  </head>
  <body>
    <h1>Canvas橡皮擦工具</h1>
    <div class="toolbar">
      <div class="tool-group">
        <label>工具:</label>
        <div class="tool-toggle">
          <button class="tool-btn active" id="brushToolBtn">画笔</button>
          <button class="tool-btn" id="eraserToolBtn">橡皮擦</button>
        </div>
      </div>
      <div class="tool-group">
        <label>画笔颜色:</label>
        <input type="color" id="brushColor" value="#3498db" />
        <label>大小:</label>
        <input type="range" id="brushSize" min="1" max="50" value="8" />
        <span class="size-value" id="brushSizeValue">8</span>
      </div>
      <div class="tool-group">
        <label>橡皮擦大小:</label>
        <input type="range" id="eraserSize" min="5" max="80" value="25" />
        <span class="size-value eraser" id="eraserSizeValue">25</span>
      </div>
      <div class="tool-group">
        <label>背景:</label>
        <div class="bg-controls">
          <div
            class="bg-swatch active"
            data-bg="#ffffff"
            style="background: #ffffff; border: 1px solid #ccc"
          ></div>
          <div class="bg-swatch" data-bg="#fff8dc" style="background: #fff8dc"></div>
          <div class="bg-swatch" data-bg="#d4edda" style="background: #d4edda"></div>
          <div class="bg-swatch" data-bg="#f8d7da" style="background: #f8d7da"></div>
          <div class="bg-swatch" data-bg="#2c3e50" style="background: #2c3e50"></div>
        </div>
      </div>
      <div class="tool-group">
        <button class="action danger" id="clearBtn">清空所有</button>
        <button class="action success" id="saveBtn">保存图片</button>
      </div>
    </div>
    <div class="canvas-container">
      <div class="canvas-stack">
        <canvas id="bgCanvas" width="880" height="500"></canvas>
        <canvas id="drawCanvas" width="880" height="500"></canvas>
        <div class="eraser-cursor" id="eraserCursor"></div>
      </div>
    </div>
    <p class="hint">
      背景层与绘画层分离。橡皮擦只擦除绘画层，不会影响背景。移动鼠标到画布上时显示橡皮擦范围。
    </p>

    <script>
      (function () {
        const bgCanvas = document.getElementById('bgCanvas');
        const bgCtx = bgCanvas.getContext('2d');
        const drawCanvas = document.getElementById('drawCanvas');
        const ctx = drawCanvas.getContext('2d');
        const eraserCursor = document.getElementById('eraserCursor');

        const brushColor = document.getElementById('brushColor');
        const brushSize = document.getElementById('brushSize');
        const brushSizeValue = document.getElementById('brushSizeValue');
        const eraserSize = document.getElementById('eraserSize');
        const eraserSizeValue = document.getElementById('eraserSizeValue');
        const brushToolBtn = document.getElementById('brushToolBtn');
        const eraserToolBtn = document.getElementById('eraserToolBtn');
        const clearBtn = document.getElementById('clearBtn');
        const saveBtn = document.getElementById('saveBtn');

        let drawing = false;
        let lastX = 0,
          lastY = 0;
        let currentTool = 'brush';
        let currentBrushSize = 8;
        let currentEraserSize = 25;
        let currentColor = '#3498db';

        // 初始化背景
        function drawBackground(color) {
          bgCtx.fillStyle = color;
          bgCtx.fillRect(0, 0, bgCanvas.width, bgCanvas.height);
        }
        drawBackground('#ffffff');

        function getPos(e) {
          const rect = drawCanvas.getBoundingClientRect();
          const scaleX = drawCanvas.width / rect.width;
          const scaleY = drawCanvas.height / rect.height;
          let cx, cy;
          if (e.touches && e.touches.length) {
            cx = e.touches[0].clientX;
            cy = e.touches[0].clientY;
          } else {
            cx = e.clientX;
            cy = e.clientY;
          }
          return {
            x: (cx - rect.left) * scaleX,
            y: (cy - rect.top) * scaleY,
            rx: cx - rect.left,
            ry: cy - rect.top,
            scale: rect.width / drawCanvas.width,
          };
        }

        function updateCursor(rx, ry, scale) {
          if (currentTool === 'eraser') {
            eraserCursor.style.display = 'block';
            const size = currentEraserSize * scale;
            eraserCursor.style.width = size + 'px';
            eraserCursor.style.height = size + 'px';
            eraserCursor.style.left = rx - size / 2 + 'px';
            eraserCursor.style.top = ry - size / 2 + 'px';
          } else {
            eraserCursor.style.display = 'none';
          }
        }

        function startDraw(e) {
          e.preventDefault();
          drawing = true;
          const p = getPos(e);
          lastX = p.x;
          lastY = p.y;
          drawAt(p.x, p.y, p.x, p.y);
        }

        function drawAt(x1, y1, x2, y2) {
          if (currentTool === 'brush') {
            ctx.globalCompositeOperation = 'source-over';
            ctx.strokeStyle = currentColor;
            ctx.fillStyle = currentColor;
            ctx.lineWidth = currentBrushSize;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            const midX = (x1 + x2) / 2;
            const midY = (y1 + y2) / 2;
            ctx.quadraticCurveTo(x1, y1, midX, midY);
            ctx.stroke();
            // 起点
            ctx.beginPath();
            ctx.arc(x2, y2, currentBrushSize / 2, 0, Math.PI * 2);
            ctx.fill();
          } else if (currentTool === 'eraser') {
            ctx.globalCompositeOperation = 'destination-out';
            ctx.strokeStyle = 'rgba(0,0,0,1)';
            ctx.fillStyle = 'rgba(0,0,0,1)';
            ctx.lineWidth = currentEraserSize;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(x2, y2, currentEraserSize / 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalCompositeOperation = 'source-over';
          }
        }

        function draw(e) {
          if (!drawing) return;
          e.preventDefault();
          const p = getPos(e);
          drawAt(lastX, lastY, p.x, p.y);
          lastX = p.x;
          lastY = p.y;
          updateCursor(p.rx, p.ry, p.scale);
        }

        function endDraw() {
          drawing = false;
        }

        drawCanvas.addEventListener('mousedown', startDraw);
        drawCanvas.addEventListener('mousemove', function (e) {
          if (drawing) {
            draw(e);
          } else {
            const p = getPos(e);
            updateCursor(p.rx, p.ry, p.scale);
          }
        });
        drawCanvas.addEventListener('mouseup', endDraw);
        drawCanvas.addEventListener('mouseleave', function () {
          endDraw();
          eraserCursor.style.display = 'none';
        });
        drawCanvas.addEventListener('mouseenter', function (e) {
          if (currentTool === 'eraser') {
            const p = getPos(e);
            updateCursor(p.rx, p.ry, p.scale);
          }
        });
        drawCanvas.addEventListener('touchstart', startDraw, { passive: false });
        drawCanvas.addEventListener('touchmove', draw, { passive: false });
        drawCanvas.addEventListener('touchend', endDraw);

        brushToolBtn.addEventListener('click', function () {
          currentTool = 'brush';
          brushToolBtn.classList.add('active');
          brushToolBtn.classList.remove('eraser-active');
          eraserToolBtn.classList.remove('active', 'eraser-active');
          drawCanvas.style.cursor = 'crosshair';
          eraserCursor.style.display = 'none';
        });

        eraserToolBtn.addEventListener('click', function () {
          currentTool = 'eraser';
          eraserToolBtn.classList.add('active', 'eraser-active');
          brushToolBtn.classList.remove('active');
          drawCanvas.style.cursor = 'none';
        });

        brushColor.addEventListener('input', function () {
          currentColor = this.value;
        });

        brushSize.addEventListener('input', function () {
          currentBrushSize = parseInt(this.value, 10);
          brushSizeValue.textContent = currentBrushSize;
        });

        eraserSize.addEventListener('input', function () {
          currentEraserSize = parseInt(this.value, 10);
          eraserSizeValue.textContent = currentEraserSize;
        });

        document.querySelectorAll('.bg-swatch').forEach(function (sw) {
          sw.addEventListener('click', function () {
            document.querySelectorAll('.bg-swatch').forEach(function (s) {
              s.classList.remove('active');
            });
            this.classList.add('active');
            drawBackground(this.getAttribute('data-bg'));
          });
        });

        clearBtn.addEventListener('click', function () {
          if (confirm('确定要清空绘画层吗？（背景保留）')) {
            ctx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
          }
        });

        saveBtn.addEventListener('click', function () {
          // 合成背景层和绘画层
          const tmp = document.createElement('canvas');
          tmp.width = drawCanvas.width;
          tmp.height = drawCanvas.height;
          const tctx = tmp.getContext('2d');
          tctx.drawImage(bgCanvas, 0, 0);
          tctx.drawImage(drawCanvas, 0, 0);

          const link = document.createElement('a');
          link.download = '绘画作品.png';
          link.href = tmp.toDataURL('image/png');
          link.click();
        });
      })();
    </script>
  </body>
</html>
