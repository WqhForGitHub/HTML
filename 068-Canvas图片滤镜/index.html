<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Canvas图片滤镜</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
        background: #0f0f1e;
        color: #eee;
        min-height: 100vh;
        padding: 20px;
      }
      h1 {
        text-align: center;
        color: #ff6b6b;
        margin-bottom: 20px;
      }
      .container {
        max-width: 1200px;
        margin: 0 auto;
      }
      .toolbar {
        background: #1e1e2e;
        border: 1px solid #2e2e4e;
        border-radius: 10px;
        padding: 14px 18px;
        margin-bottom: 16px;
      }
      .filter-buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 12px;
      }
      .filter-btn {
        background: #2e2e4e;
        color: #fff;
        border: 2px solid transparent;
        padding: 8px 16px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 13px;
        font-weight: 600;
        transition: all 0.2s;
      }
      .filter-btn:hover {
        background: #3e3e6e;
      }
      .filter-btn.active {
        background: linear-gradient(135deg, #ff6b6b, #ee5a6f);
        border-color: #ff6b6b;
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        align-items: center;
      }
      .control-group {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      label {
        font-size: 13px;
        color: #aaa;
        font-weight: 600;
      }
      input[type='range'] {
        width: 150px;
        cursor: pointer;
      }
      .value-display {
        min-width: 35px;
        color: #ff6b6b;
        font-weight: 700;
      }
      button.action {
        background: #2e2e4e;
        color: #fff;
        border: none;
        padding: 8px 16px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 13px;
        font-weight: 600;
      }
      button.action:hover {
        background: #3e3e6e;
      }
      button.action.primary {
        background: linear-gradient(135deg, #4ecdc4, #44a8a0);
      }
      button.action.success {
        background: #2ecc71;
      }
      .panels {
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
      }
      .panel {
        flex: 1;
        min-width: 320px;
        background: #1e1e2e;
        border: 1px solid #2e2e4e;
        border-radius: 10px;
        padding: 14px;
      }
      .panel-title {
        color: #ff6b6b;
        font-size: 14px;
        font-weight: 700;
        margin-bottom: 10px;
      }
      .canvas-wrapper {
        background: #000;
        border-radius: 6px;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 300px;
      }
      canvas {
        display: block;
        max-width: 100%;
      }
      .status {
        color: #888;
        font-size: 12px;
        margin-top: 8px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Canvas图片滤镜工具</h1>
      <div class="toolbar">
        <div class="filter-buttons">
          <button class="filter-btn active" data-filter="none">原图</button>
          <button class="filter-btn" data-filter="grayscale">灰度</button>
          <button class="filter-btn" data-filter="sepia">复古</button>
          <button class="filter-btn" data-filter="invert">反色</button>
          <button class="filter-btn" data-filter="brightness">亮度</button>
          <button class="filter-btn" data-filter="contrast">对比度</button>
          <button class="filter-btn" data-filter="blur">模糊</button>
          <button class="filter-btn" data-filter="warm">暖色</button>
          <button class="filter-btn" data-filter="cool">冷色</button>
          <button class="filter-btn" data-filter="vintage">老照片</button>
        </div>
        <div class="controls">
          <div class="control-group">
            <label>强度:</label>
            <input type="range" id="intensity" min="0" max="100" value="100" />
            <span class="value-display" id="intensityValue">100%</span>
          </div>
          <div class="control-group">
            <button class="action primary" id="loadBtn">加载新图片</button>
            <button class="action" id="resetBtn">重置</button>
            <button class="action success" id="saveBtn">保存结果</button>
          </div>
        </div>
      </div>
      <div class="panels">
        <div class="panel">
          <div class="panel-title">原始图片</div>
          <div class="canvas-wrapper">
            <canvas id="origCanvas" width="560" height="380"></canvas>
          </div>
          <div class="status" id="origStatus">原图</div>
        </div>
        <div class="panel">
          <div class="panel-title">滤镜效果</div>
          <div class="canvas-wrapper">
            <canvas id="filterCanvas" width="560" height="380"></canvas>
          </div>
          <div class="status" id="filterStatus">当前滤镜: 原图</div>
        </div>
      </div>
    </div>

    <script>
      (function () {
        const origCanvas = document.getElementById('origCanvas');
        const origCtx = origCanvas.getContext('2d');
        const filterCanvas = document.getElementById('filterCanvas');
        const filterCtx = filterCanvas.getContext('2d');
        const intensity = document.getElementById('intensity');
        const intensityValue = document.getElementById('intensityValue');
        const origStatus = document.getElementById('origStatus');
        const filterStatus = document.getElementById('filterStatus');
        const loadBtn = document.getElementById('loadBtn');
        const resetBtn = document.getElementById('resetBtn');
        const saveBtn = document.getElementById('saveBtn');

        const img = new Image();
        img.crossOrigin = 'anonymous';
        let origImageData = null;
        let currentFilter = 'none';

        function loadImage(seed) {
          const s = seed || Math.floor(Math.random() * 1000);
          img.onload = function () {
            // 适配画布
            const ratio = Math.min(origCanvas.width / img.width, origCanvas.height / img.height);
            const w = img.width * ratio;
            const h = img.height * ratio;
            const x = (origCanvas.width - w) / 2;
            const y = (origCanvas.height - h) / 2;

            origCtx.fillStyle = '#000';
            origCtx.fillRect(0, 0, origCanvas.width, origCanvas.height);
            origCtx.drawImage(img, x, y, w, h);
            filterCtx.fillStyle = '#000';
            filterCtx.fillRect(0, 0, filterCanvas.width, filterCanvas.height);
            filterCtx.drawImage(img, x, y, w, h);

            // 保存原始像素数据（只取图片区域）
            origImageData = origCtx.getImageData(0, 0, origCanvas.width, origCanvas.height);
            origStatus.textContent = '图片尺寸: ' + img.width + ' x ' + img.height;
            applyFilter();
          };
          img.onerror = function () {
            origStatus.textContent = '图片加载失败';
          };
          origStatus.textContent = '正在加载图片...';
          img.src = 'https://picsum.photos/seed/' + s + '/800/600.jpg';
        }

        function applyFilter() {
          if (!origImageData) return;
          const factor = parseInt(intensity.value, 10) / 100;
          // 复制原始数据
          const data = new Uint8ClampedArray(origImageData.data);
          const w = origImageData.width;
          const h = origImageData.height;

          if (currentFilter === 'none') {
            // 直接显示
          } else if (currentFilter === 'grayscale') {
            for (let i = 0; i < data.length; i += 4) {
              const gray = data[i] * 0.299 + data[i + 1] * 0.587 + data[i + 2] * 0.114;
              data[i] = data[i] * (1 - factor) + gray * factor;
              data[i + 1] = data[i + 1] * (1 - factor) + gray * factor;
              data[i + 2] = data[i + 2] * (1 - factor) + gray * factor;
            }
          } else if (currentFilter === 'sepia') {
            for (let i = 0; i < data.length; i += 4) {
              const r = data[i],
                g = data[i + 1],
                b = data[i + 2];
              const tr = 0.393 * r + 0.769 * g + 0.189 * b;
              const tg = 0.349 * r + 0.686 * g + 0.168 * b;
              const tb = 0.272 * r + 0.534 * g + 0.131 * b;
              data[i] = r * (1 - factor) + tr * factor;
              data[i + 1] = g * (1 - factor) + tg * factor;
              data[i + 2] = b * (1 - factor) + tb * factor;
            }
          } else if (currentFilter === 'invert') {
            for (let i = 0; i < data.length; i += 4) {
              data[i] = data[i] * (1 - factor) + (255 - data[i]) * factor;
              data[i + 1] = data[i + 1] * (1 - factor) + (255 - data[i + 1]) * factor;
              data[i + 2] = data[i + 2] * (1 - factor) + (255 - data[i + 2]) * factor;
            }
          } else if (currentFilter === 'brightness') {
            const adj = factor * 100 - 50;
            for (let i = 0; i < data.length; i += 4) {
              data[i] = Math.max(0, Math.min(255, data[i] + adj));
              data[i + 1] = Math.max(0, Math.min(255, data[i + 1] + adj));
              data[i + 2] = Math.max(0, Math.min(255, data[i + 2] + adj));
            }
          } else if (currentFilter === 'contrast') {
            const c = factor * 2; // 0-2
            const intercept = 128 * (1 - c);
            for (let i = 0; i < data.length; i += 4) {
              data[i] = Math.max(0, Math.min(255, data[i] * c + intercept));
              data[i + 1] = Math.max(0, Math.min(255, data[i + 1] * c + intercept));
              data[i + 2] = Math.max(0, Math.min(255, data[i + 2] * c + intercept));
            }
          } else if (currentFilter === 'blur') {
            // 简单盒模糊
            const radius = Math.floor(factor * 5);
            if (radius > 0) {
              const blurred = boxBlur(data, w, h, radius);
              for (let i = 0; i < data.length; i++) data[i] = blurred[i];
            }
          } else if (currentFilter === 'warm') {
            for (let i = 0; i < data.length; i += 4) {
              data[i] = Math.min(255, data[i] + 40 * factor);
              data[i + 1] = Math.min(255, data[i + 1] + 10 * factor);
              data[i + 2] = Math.max(0, data[i + 2] - 30 * factor);
            }
          } else if (currentFilter === 'cool') {
            for (let i = 0; i < data.length; i += 4) {
              data[i] = Math.max(0, data[i] - 30 * factor);
              data[i + 1] = Math.min(255, data[i + 1] + 10 * factor);
              data[i + 2] = Math.min(255, data[i + 2] + 40 * factor);
            }
          } else if (currentFilter === 'vintage') {
            for (let i = 0; i < data.length; i += 4) {
              const r = data[i],
                g = data[i + 1],
                b = data[i + 2];
              const tr = r * 0.9 + 30;
              const tg = g * 0.85 + 20;
              const tb = b * 0.75 + 10;
              data[i] = r * (1 - factor) + tr * factor;
              data[i + 1] = g * (1 - factor) + tg * factor;
              data[i + 2] = g * (1 - factor) + tb * factor;
              // 添加噪点
              if (factor > 0.3) {
                const noise = (Math.random() - 0.5) * 30 * factor;
                data[i] += noise;
                data[i + 1] += noise;
                data[i + 2] += noise;
              }
            }
          }

          const newData = new ImageData(data, w, h);
          filterCtx.putImageData(newData, 0, 0);

          const names = {
            none: '原图',
            grayscale: '灰度',
            sepia: '复古',
            invert: '反色',
            brightness: '亮度',
            contrast: '对比度',
            blur: '模糊',
            warm: '暖色',
            cool: '冷色',
            vintage: '老照片',
          };
          filterStatus.textContent =
            '当前滤镜: ' + names[currentFilter] + ' (强度 ' + intensity.value + '%)';
        }

        function boxBlur(data, w, h, radius) {
          const result = new Uint8ClampedArray(data.length);
          for (let y = 0; y < h; y++) {
            for (let x = 0; x < w; x++) {
              let r = 0,
                g = 0,
                b = 0,
                a = 0,
                count = 0;
              for (let dy = -radius; dy <= radius; dy++) {
                for (let dx = -radius; dx <= radius; dx++) {
                  const nx = x + dx,
                    ny = y + dy;
                  if (nx >= 0 && nx < w && ny >= 0 && ny < h) {
                    const idx = (ny * w + nx) * 4;
                    r += data[idx];
                    g += data[idx + 1];
                    b += data[idx + 2];
                    a += data[idx + 3];
                    count++;
                  }
                }
              }
              const idx = (y * w + x) * 4;
              result[idx] = r / count;
              result[idx + 1] = g / count;
              result[idx + 2] = b / count;
              result[idx + 3] = a / count;
            }
          }
          return result;
        }

        document.querySelectorAll('.filter-btn').forEach(function (btn) {
          btn.addEventListener('click', function () {
            currentFilter = this.getAttribute('data-filter');
            document.querySelectorAll('.filter-btn').forEach(function (b) {
              b.classList.remove('active');
            });
            this.classList.add('active');
            applyFilter();
          });
        });

        intensity.addEventListener('input', function () {
          intensityValue.textContent = this.value + '%';
          applyFilter();
        });

        loadBtn.addEventListener('click', function () {
          loadImage();
        });
        resetBtn.addEventListener('click', function () {
          currentFilter = 'none';
          intensity.value = 100;
          intensityValue.textContent = '100%';
          document.querySelectorAll('.filter-btn').forEach(function (b) {
            b.classList.remove('active');
          });
          document.querySelector('.filter-btn[data-filter="none"]').classList.add('active');
          applyFilter();
        });

        saveBtn.addEventListener('click', function () {
          const link = document.createElement('a');
          link.download = '滤镜效果.png';
          link.href = filterCanvas.toDataURL('image/png');
          link.click();
        });

        loadImage(101);
      })();
    </script>
  </body>
</html>
