<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Canvas图片旋转</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
        background: #1a1a2e;
        color: #eee;
        min-height: 100vh;
        padding: 20px;
      }
      h1 {
        text-align: center;
        background: linear-gradient(90deg, #00b4db, #0083b0);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 20px;
      }
      .container {
        max-width: 1000px;
        margin: 0 auto;
      }
      .toolbar {
        background: #16213e;
        border: 1px solid #0f3460;
        border-radius: 10px;
        padding: 16px 20px;
        margin-bottom: 16px;
      }
      .control-row {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        align-items: center;
        margin-bottom: 12px;
      }
      .control-row:last-child {
        margin-bottom: 0;
      }
      .control-group {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      label {
        font-size: 13px;
        color: #aaa;
        font-weight: 600;
      }
      .quick-buttons {
        display: flex;
        gap: 6px;
      }
      button {
        background: #0f3460;
        color: #fff;
        border: 2px solid transparent;
        padding: 8px 14px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 13px;
        font-weight: 600;
        transition: all 0.2s;
      }
      button:hover {
        background: #1a4a8a;
      }
      button.primary {
        background: linear-gradient(135deg, #00b4db, #0083b0);
      }
      button.primary:hover {
        background: linear-gradient(135deg, #00c4eb, #0093c0);
      }
      button.success {
        background: #2ecc71;
      }
      button.danger {
        background: #e74c3c;
      }
      button.flip-btn {
        background: #5b2c6f;
      }
      button.flip-btn:hover {
        background: #7d3c98;
      }
      input[type='range'] {
        width: 260px;
        cursor: pointer;
      }
      .angle-display {
        min-width: 70px;
        text-align: center;
        font-size: 18px;
        font-weight: 700;
        color: #00b4db;
        background: #0a1525;
        padding: 6px 12px;
        border-radius: 6px;
        border: 1px solid #0f3460;
      }
      .canvas-area {
        background: #0f1525;
        border: 1px solid #0f3460;
        border-radius: 10px;
        padding: 20px;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 480px;
        position: relative;
      }
      canvas {
        display: block;
        background:
          linear-gradient(45deg, #1a2333 25%, transparent 25%),
          linear-gradient(-45deg, #1a2333 25%, transparent 25%),
          linear-gradient(45deg, transparent 75%, #1a2333 75%),
          linear-gradient(-45deg, transparent 75%, #1a2333 75%);
        background-size: 20px 20px;
        background-position:
          0 0,
          0 10px,
          10px -10px,
          -10px 0px;
        background-color: #0f1525;
        border-radius: 6px;
        max-width: 100%;
      }
      .angle-indicator {
        position: absolute;
        top: 20px;
        right: 20px;
        width: 70px;
        height: 70px;
        background: rgba(0, 0, 0, 0.5);
        border-radius: 50%;
        border: 2px solid #00b4db;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 5;
      }
      .angle-indicator .needle {
        position: absolute;
        width: 3px;
        height: 28px;
        background: #00b4db;
        top: 7px;
        left: 50%;
        transform-origin: bottom center;
        transform: translateX(-50%) rotate(0deg);
        border-radius: 2px;
        transition: transform 0.3s;
      }
      .angle-indicator .center-dot {
        width: 8px;
        height: 8px;
        background: #00b4db;
        border-radius: 50%;
        z-index: 2;
      }
      .angle-indicator .label {
        position: absolute;
        bottom: -22px;
        font-size: 11px;
        color: #00b4db;
        white-space: nowrap;
      }
      .status {
        color: #888;
        font-size: 13px;
        margin-top: 12px;
        text-align: center;
      }
      .checkbox-group {
        display: flex;
        align-items: center;
        gap: 6px;
        color: #aaa;
        font-size: 13px;
        cursor: pointer;
      }
      input[type='checkbox'] {
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Canvas图片旋转工具</h1>
      <div class="toolbar">
        <div class="control-row">
          <div class="control-group">
            <label>旋转角度:</label>
            <input type="range" id="angleSlider" min="-180" max="180" value="0" step="1" />
            <span class="angle-display" id="angleValue">0°</span>
          </div>
          <div class="control-group">
            <label>快捷:</label>
            <div class="quick-buttons">
              <button data-angle="-90">-90°</button>
              <button data-angle="-45">-45°</button>
              <button data-angle="0">0°</button>
              <button data-angle="45">45°</button>
              <button data-angle="90">90°</button>
              <button data-angle="180">180°</button>
            </div>
          </div>
        </div>
        <div class="control-row">
          <div class="control-group">
            <button class="flip-btn" id="flipHBtn">水平翻转</button>
            <button class="flip-btn" id="flipVBtn">垂直翻转</button>
          </div>
          <div class="control-group">
            <label class="checkbox-group">
              <input type="checkbox" id="smoothToggle" checked />
              平滑插值
            </label>
          </div>
          <div class="control-group">
            <button class="primary" id="loadBtn">加载新图片</button>
            <button id="resetBtn">重置</button>
            <button class="success" id="saveBtn">保存结果</button>
          </div>
        </div>
      </div>
      <div class="canvas-area">
        <div class="angle-indicator">
          <div class="needle" id="needle"></div>
          <div class="center-dot"></div>
          <div class="label">角度指示</div>
        </div>
        <canvas id="canvas" width="800" height="460"></canvas>
      </div>
      <p class="status" id="status">拖动滑块或点击快捷按钮旋转图片，支持水平/垂直翻转</p>
    </div>

    <script>
      (function () {
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const angleSlider = document.getElementById('angleSlider');
        const angleValue = document.getElementById('angleValue');
        const needle = document.getElementById('needle');
        const flipHBtn = document.getElementById('flipHBtn');
        const flipVBtn = document.getElementById('flipVBtn');
        const smoothToggle = document.getElementById('smoothToggle');
        const loadBtn = document.getElementById('loadBtn');
        const resetBtn = document.getElementById('resetBtn');
        const saveBtn = document.getElementById('saveBtn');
        const status = document.getElementById('status');

        const img = new Image();
        img.crossOrigin = 'anonymous';
        let imgLoaded = false;
        let angle = 0;
        let flipH = false;
        let flipV = false;

        function loadImage(seed) {
          const s = seed || Math.floor(Math.random() * 1000);
          img.onload = function () {
            imgLoaded = true;
            status.textContent = '图片已加载，尺寸: ' + img.width + ' x ' + img.height;
            redraw();
          };
          img.onerror = function () {
            status.textContent = '图片加载失败';
          };
          status.textContent = '正在加载图片...';
          img.src = 'https://picsum.photos/seed/' + s + '/640/420.jpg';
        }

        function redraw() {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          if (!imgLoaded) return;

          ctx.imageSmoothingEnabled = smoothToggle.checked;
          ctx.imageSmoothingQuality = 'high';

          const rad = (angle * Math.PI) / 180;
          const cx = canvas.width / 2;
          const cy = canvas.height / 2;

          // 计算旋转后需要的画布尺寸（保持图片可见）
          // 我们用固定画布，居中绘制
          ctx.save();
          ctx.translate(cx, cy);
          ctx.rotate(rad);
          // 翻转
          const scaleX = flipH ? -1 : 1;
          const scaleY = flipV ? -1 : 1;
          ctx.scale(scaleX, scaleY);

          // 缩放图片以适应画布
          const maxW = canvas.width * 0.7;
          const maxH = canvas.height * 0.7;
          const ratio = Math.min(maxW / img.width, maxH / img.height);
          const w = img.width * ratio;
          const h = img.height * ratio;

          ctx.drawImage(img, -w / 2, -h / 2, w, h);

          // 绘制边框
          ctx.strokeStyle = 'rgba(0, 180, 219, 0.5)';
          ctx.lineWidth = 2;
          ctx.strokeRect(-w / 2, -h / 2, w, h);

          ctx.restore();

          // 更新指示器
          needle.style.transform = 'translateX(-50%) rotate(' + angle + 'deg)';
          angleValue.textContent = angle + '°';
        }

        angleSlider.addEventListener('input', function () {
          angle = parseInt(this.value, 10);
          redraw();
        });

        document.querySelectorAll('.quick-buttons button').forEach(function (btn) {
          btn.addEventListener('click', function () {
            angle = parseInt(this.getAttribute('data-angle'), 10);
            angleSlider.value = angle;
            redraw();
          });
        });

        flipHBtn.addEventListener('click', function () {
          flipH = !flipH;
          this.style.background = flipH ? '#00b4db' : '#5b2c6f';
          redraw();
        });

        flipVBtn.addEventListener('click', function () {
          flipV = !flipV;
          this.style.background = flipV ? '#00b4db' : '#5b2c6f';
          redraw();
        });

        smoothToggle.addEventListener('change', redraw);

        loadBtn.addEventListener('click', function () {
          angle = 0;
          flipH = false;
          flipV = false;
          angleSlider.value = 0;
          flipHBtn.style.background = '#5b2c6f';
          flipVBtn.style.background = '#5b2c6f';
          loadImage();
        });

        resetBtn.addEventListener('click', function () {
          angle = 0;
          flipH = false;
          flipV = false;
          angleSlider.value = 0;
          flipHBtn.style.background = '#5b2c6f';
          flipVBtn.style.background = '#5b2c6f';
          redraw();
          status.textContent = '已重置';
        });

        saveBtn.addEventListener('click', function () {
          const link = document.createElement('a');
          link.download = '旋转结果_' + angle + '度.png';
          link.href = canvas.toDataURL('image/png');
          link.click();
          status.textContent = '已保存旋转结果';
        });

        loadImage(77);
      })();
    </script>
  </body>
</html>
