<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Canvas图片缩放</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
        background: #0d1117;
        color: #e6edf3;
        min-height: 100vh;
        padding: 20px;
      }
      h1 {
        text-align: center;
        background: linear-gradient(90deg, #58a6ff, #bc8cff);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 20px;
      }
      .container {
        max-width: 1000px;
        margin: 0 auto;
      }
      .toolbar {
        background: #161b22;
        border: 1px solid #30363d;
        border-radius: 10px;
        padding: 14px 18px;
        margin-bottom: 14px;
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        align-items: center;
      }
      .control-group {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      label {
        font-size: 13px;
        color: #8b949e;
        font-weight: 600;
      }
      button {
        background: #21262d;
        color: #e6edf3;
        border: 1px solid #30363d;
        padding: 8px 14px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 13px;
        font-weight: 600;
        transition: all 0.15s;
      }
      button:hover {
        background: #30363d;
        border-color: #58a6ff;
      }
      button.primary {
        background: #1f6feb;
        border-color: #1f6feb;
      }
      button.primary:hover {
        background: #388bfd;
      }
      button.success {
        background: #238636;
        border-color: #238636;
      }
      button.danger {
        background: #da3633;
        border-color: #da3633;
      }
      input[type='range'] {
        width: 220px;
        cursor: pointer;
      }
      .zoom-display {
        min-width: 75px;
        text-align: center;
        font-size: 16px;
        font-weight: 700;
        color: #58a6ff;
        background: #0d1117;
        padding: 6px 10px;
        border-radius: 6px;
        border: 1px solid #30363d;
      }
      .checkbox-group {
        display: flex;
        align-items: center;
        gap: 6px;
        color: #8b949e;
        font-size: 13px;
        cursor: pointer;
      }
      input[type='checkbox'] {
        cursor: pointer;
      }
      .canvas-area {
        background: #0d1117;
        border: 1px solid #30363d;
        border-radius: 10px;
        padding: 0;
        position: relative;
        overflow: hidden;
      }
      .canvas-wrapper {
        position: relative;
        width: 100%;
        height: 520px;
        overflow: hidden;
        background:
          linear-gradient(45deg, #161b22 25%, transparent 25%),
          linear-gradient(-45deg, #161b22 25%, transparent 25%),
          linear-gradient(45deg, transparent 75%, #161b22 75%),
          linear-gradient(-45deg, transparent 75%, #161b22 75%);
        background-size: 20px 20px;
        background-position:
          0 0,
          0 10px,
          10px -10px,
          -10px 0px;
        background-color: #0d1117;
        cursor: grab;
      }
      .canvas-wrapper.grabbing {
        cursor: grabbing;
      }
      .canvas-wrapper.zoom-in {
        cursor: zoom-in;
      }
      canvas {
        display: block;
        position: absolute;
        top: 0;
        left: 0;
      }
      .status-bar {
        background: #161b22;
        border-top: 1px solid #30363d;
        padding: 10px 18px;
        display: flex;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 10px;
        font-size: 12px;
        color: #8b949e;
      }
      .status-bar span strong {
        color: #58a6ff;
      }
      .hint {
        color: #8b949e;
        font-size: 12px;
        margin-top: 12px;
        text-align: center;
      }
      .zoom-indicator {
        position: absolute;
        top: 12px;
        left: 12px;
        background: rgba(13, 17, 23, 0.85);
        color: #58a6ff;
        padding: 6px 12px;
        border-radius: 6px;
        font-size: 13px;
        font-weight: 700;
        border: 1px solid #30363d;
        z-index: 10;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Canvas图片缩放工具</h1>
      <div class="toolbar">
        <div class="control-group">
          <label>缩放:</label>
          <button id="zoomOutBtn">-</button>
          <input type="range" id="zoomSlider" min="10" max="400" value="100" step="5" />
          <button id="zoomInBtn">+</button>
          <span class="zoom-display" id="zoomValue">100%</span>
        </div>
        <div class="control-group">
          <button id="fitBtn">适应窗口</button>
          <button id="actualBtn">实际大小</button>
        </div>
        <div class="control-group">
          <label class="checkbox-group">
            <input type="checkbox" id="smoothToggle" checked />
            平滑插值
          </label>
        </div>
        <div class="control-group">
          <button class="primary" id="loadBtn">加载新图片</button>
          <button class="danger" id="resetBtn">重置</button>
          <button class="success" id="saveBtn">保存</button>
        </div>
      </div>
      <div class="canvas-area">
        <div class="canvas-wrapper" id="canvasWrapper">
          <div class="zoom-indicator" id="zoomIndicator">缩放: 100%</div>
          <canvas id="canvas" width="960" height="520"></canvas>
        </div>
        <div class="status-bar">
          <span>
            缩放比例:
            <strong id="statusZoom">100%</strong>
          </span>
          <span>
            偏移: X=
            <strong id="statusX">0</strong>
            , Y=
            <strong id="statusY">0</strong>
          </span>
          <span>
            图片尺寸:
            <strong id="statusSize">-</strong>
          </span>
          <span>提示: 滚轮缩放, 拖动平移</span>
        </div>
      </div>
      <p class="hint">使用鼠标滚轮缩放图片，按住鼠标拖动平移查看。支持平滑插值切换。</p>
    </div>

    <script>
      (function () {
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const wrapper = document.getElementById('canvasWrapper');
        const zoomSlider = document.getElementById('zoomSlider');
        const zoomValue = document.getElementById('zoomValue');
        const zoomIndicator = document.getElementById('zoomIndicator');
        const zoomInBtn = document.getElementById('zoomInBtn');
        const zoomOutBtn = document.getElementById('zoomOutBtn');
        const fitBtn = document.getElementById('fitBtn');
        const actualBtn = document.getElementById('actualBtn');
        const smoothToggle = document.getElementById('smoothToggle');
        const loadBtn = document.getElementById('loadBtn');
        const resetBtn = document.getElementById('resetBtn');
        const saveBtn = document.getElementById('saveBtn');
        const statusZoom = document.getElementById('statusZoom');
        const statusX = document.getElementById('statusX');
        const statusY = document.getElementById('statusY');
        const statusSize = document.getElementById('statusSize');

        const img = new Image();
        img.crossOrigin = 'anonymous';
        let imgLoaded = false;
        let scale = 1;
        let offsetX = 0;
        let offsetY = 0;
        let isDragging = false;
        let dragStartX = 0,
          dragStartY = 0;
        let dragOffsetX = 0,
          dragOffsetY = 0;

        function resizeCanvas() {
          canvas.width = wrapper.clientWidth;
          canvas.height = wrapper.clientHeight;
          redraw();
        }

        function loadImage(seed) {
          const s = seed || Math.floor(Math.random() * 1000);
          img.onload = function () {
            imgLoaded = true;
            statusSize.textContent = img.width + ' x ' + img.height;
            fitToWindow();
          };
          img.onerror = function () {
            statusSize.textContent = '加载失败';
          };
          statusSize.textContent = '加载中...';
          img.src = 'https://picsum.photos/seed/' + s + '/900/600.jpg';
        }

        function fitToWindow() {
          if (!imgLoaded) return;
          const ratio = Math.min(canvas.width / img.width, canvas.height / img.height);
          scale = Math.min(ratio, 1);
          if (scale < 0.1) scale = 0.1;
          offsetX = (canvas.width - img.width * scale) / 2;
          offsetY = (canvas.height - img.height * scale) / 2;
          updateZoomDisplay();
          redraw();
        }

        function actualSize() {
          if (!imgLoaded) return;
          scale = 1;
          offsetX = (canvas.width - img.width) / 2;
          offsetY = (canvas.height - img.height) / 2;
          if (offsetX < 0) offsetX = 0;
          if (offsetY < 0) offsetY = 0;
          updateZoomDisplay();
          redraw();
        }

        function redraw() {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          if (!imgLoaded) return;

          ctx.imageSmoothingEnabled = smoothToggle.checked;
          ctx.imageSmoothingQuality = 'high';

          ctx.save();
          ctx.translate(offsetX, offsetY);
          ctx.scale(scale, scale);
          ctx.drawImage(img, 0, 0);

          // 边框
          ctx.strokeStyle = 'rgba(88, 166, 255, 0.6)';
          ctx.lineWidth = 1 / scale;
          ctx.strokeRect(0, 0, img.width, img.height);
          ctx.restore();

          statusX.textContent = Math.round(offsetX);
          statusY.textContent = Math.round(offsetY);
        }

        function updateZoomDisplay() {
          const pct = Math.round(scale * 100);
          zoomValue.textContent = pct + '%';
          zoomIndicator.textContent = '缩放: ' + pct + '%';
          statusZoom.textContent = pct + '%';
          zoomSlider.value = Math.min(400, Math.max(10, pct));
        }

        function zoomAt(cx, cy, newScale) {
          if (!imgLoaded) return;
          newScale = Math.max(0.1, Math.min(4, newScale));
          // 保持鼠标点对应图片位置不变
          const imgX = (cx - offsetX) / scale;
          const imgY = (cy - offsetY) / scale;
          scale = newScale;
          offsetX = cx - imgX * scale;
          offsetY = cy - imgY * scale;
          updateZoomDisplay();
          redraw();
        }

        // 鼠标滚轮缩放
        wrapper.addEventListener('wheel', function (e) {
          e.preventDefault();
          if (!imgLoaded) return;
          const rect = wrapper.getBoundingClientRect();
          const cx = e.clientX - rect.left;
          const cy = e.clientY - rect.top;
          const delta = e.deltaY < 0 ? 1.1 : 0.9;
          zoomAt(cx, cy, scale * delta);
        });

        // 拖动平移
        wrapper.addEventListener('mousedown', function (e) {
          if (!imgLoaded) return;
          isDragging = true;
          dragStartX = e.clientX;
          dragStartY = e.clientY;
          dragOffsetX = offsetX;
          dragOffsetY = offsetY;
          wrapper.classList.add('grabbing');
        });

        window.addEventListener('mousemove', function (e) {
          if (!isDragging) return;
          offsetX = dragOffsetX + (e.clientX - dragStartX);
          offsetY = dragOffsetY + (e.clientY - dragStartY);
          redraw();
        });

        window.addEventListener('mouseup', function () {
          isDragging = false;
          wrapper.classList.remove('grabbing');
        });

        // 触摸支持
        let touchStart = null;
        let touchDist = 0;
        wrapper.addEventListener(
          'touchstart',
          function (e) {
            if (!imgLoaded) return;
            if (e.touches.length === 1) {
              touchStart = {
                x: e.touches[0].clientX,
                y: e.touches[0].clientY,
                ox: offsetX,
                oy: offsetY,
              };
            } else if (e.touches.length === 2) {
              const dx = e.touches[0].clientX - e.touches[1].clientX;
              const dy = e.touches[0].clientY - e.touches[1].clientY;
              touchDist = Math.sqrt(dx * dx + dy * dy);
            }
          },
          { passive: true }
        );

        wrapper.addEventListener(
          'touchmove',
          function (e) {
            if (!imgLoaded) return;
            e.preventDefault();
            if (e.touches.length === 1 && touchStart) {
              offsetX = touchStart.ox + (e.touches[0].clientX - touchStart.x);
              offsetY = touchStart.oy + (e.touches[0].clientY - touchStart.y);
              redraw();
            } else if (e.touches.length === 2) {
              const dx = e.touches[0].clientX - e.touches[1].clientX;
              const dy = e.touches[0].clientY - e.touches[1].clientY;
              const newDist = Math.sqrt(dx * dx + dy * dy);
              if (touchDist > 0) {
                const ratio = newDist / touchDist;
                const rect = wrapper.getBoundingClientRect();
                const cx = (e.touches[0].clientX + e.touches[1].clientX) / 2 - rect.left;
                const cy = (e.touches[0].clientY + e.touches[1].clientY) / 2 - rect.top;
                zoomAt(cx, cy, scale * ratio);
              }
              touchDist = newDist;
            }
          },
          { passive: false }
        );

        wrapper.addEventListener('touchend', function () {
          touchStart = null;
          touchDist = 0;
        });

        zoomSlider.addEventListener('input', function () {
          const newScale = parseInt(this.value, 10) / 100;
          if (imgLoaded) {
            zoomAt(canvas.width / 2, canvas.height / 2, newScale);
          }
        });

        zoomInBtn.addEventListener('click', function () {
          if (imgLoaded) zoomAt(canvas.width / 2, canvas.height / 2, scale * 1.2);
        });

        zoomOutBtn.addEventListener('click', function () {
          if (imgLoaded) zoomAt(canvas.width / 2, canvas.height / 2, scale * 0.8);
        });

        fitBtn.addEventListener('click', fitToWindow);
        actualBtn.addEventListener('click', actualSize);

        smoothToggle.addEventListener('change', redraw);

        loadBtn.addEventListener('click', function () {
          loadImage();
        });

        resetBtn.addEventListener('click', function () {
          if (imgLoaded) fitToWindow();
        });

        saveBtn.addEventListener('click', function () {
          if (!imgLoaded) return;
          const link = document.createElement('a');
          link.download = '缩放视图_' + Math.round(scale * 100) + '%.png';
          link.href = canvas.toDataURL('image/png');
          link.click();
        });

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        loadImage(2024);
      })();
    </script>
  </body>
</html>
