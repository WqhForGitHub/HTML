<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Canvas 烟花效果</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      canvas {
        display: block;
        cursor: pointer;
      }
      .ui {
        position: fixed;
        top: 20px;
        left: 20px;
        color: #ffd9a8;
        font-family: 'Microsoft YaHei', sans-serif;
        font-size: 14px;
        line-height: 1.9;
        text-shadow: 0 0 6px rgba(255, 150, 80, 0.6);
        pointer-events: none;
      }
      .ui b {
        color: #ffe9a8;
        font-size: 16px;
      }
      .controls {
        position: fixed;
        bottom: 20px;
        left: 20px;
        font-family: 'Microsoft YaHei', sans-serif;
        font-size: 13px;
      }
      .controls button {
        background: rgba(60, 30, 10, 0.6);
        color: #ffd9a8;
        border: 1px solid #a64;
        padding: 8px 16px;
        margin-right: 8px;
        cursor: pointer;
        border-radius: 4px;
        font-family: inherit;
        transition: all 0.2s;
      }
      .controls button:hover {
        background: rgba(120, 60, 20, 0.7);
      }
      .controls button.active {
        background: rgba(200, 100, 40, 0.6);
        border-color: #fc6;
      }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div class="ui">
      <b>绚烂烟花</b>
      <br />
      点击屏幕发射烟花
      <br />
      多种爆炸形态
    </div>
    <div class="controls">
      <button id="autoBtn">自动发射：开</button>
      <button id="typeBtn">类型：随机</button>
      <button id="clearBtn">清空</button>
    </div>
    <script>
      const canvas = document.getElementById('c');
      const ctx = canvas.getContext('2d');
      let W, H;
      let fireworks = [],
        particles = [];
      let autoFire = true;
      let forceType = 'random';
      let lastAuto = 0;

      function resize() {
        W = canvas.width = window.innerWidth;
        H = canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resize);

      function rand(a, b) {
        return a + Math.random() * (b - a);
      }

      const TYPES = ['burst', 'ring', 'willow', 'chrysanthemum', 'heart', 'star'];

      function launchFirework(tx, ty, type) {
        type = type || (forceType === 'random' ? TYPES[Math.floor(Math.random() * TYPES.length)] : forceType);
        const sx = tx + rand(-30, 30);
        fireworks.push({
          x: sx,
          y: H,
          tx: tx,
          ty: ty,
          vx: (tx - sx) / 60,
          vy: -Math.sqrt(2 * 0.12 * (H - ty)),
          trail: [],
          type: type,
          hue: rand(0, 360),
        });
      }

      function explode(f) {
        const type = f.type;
        const hue = f.hue;
        const count = type === 'willow' ? 80 : type === 'chrysanthemum' ? 120 : 70;

        if (type === 'burst') {
          for (let i = 0; i < count; i++) {
            const a = Math.random() * Math.PI * 2;
            const sp = rand(1, 6);
            particles.push(makeParticle(f.x, f.y, Math.cos(a) * sp, Math.sin(a) * sp, hue + rand(-20, 20), rand(2, 4)));
          }
        } else if (type === 'ring') {
          for (let i = 0; i < count; i++) {
            const a = (i / count) * Math.PI * 2;
            const sp = 4;
            particles.push(makeParticle(f.x, f.y, Math.cos(a) * sp, Math.sin(a) * sp, hue, 3));
          }
        } else if (type === 'willow') {
          for (let i = 0; i < count; i++) {
            const a = Math.random() * Math.PI * 2;
            const sp = rand(1, 3);
            const p = makeParticle(f.x, f.y, Math.cos(a) * sp, Math.sin(a) * sp, hue + rand(-10, 30), rand(2, 3.5));
            p.gravity = 0.08;
            p.decay = 0.006;
            p.willow = true;
            particles.push(p);
          }
        } else if (type === 'chrysanthemum') {
          for (let layer = 0; layer < 3; layer++) {
            const n = 40;
            for (let i = 0; i < n; i++) {
              const a = (i / n) * Math.PI * 2 + layer * 0.1;
              const sp = 2 + layer * 1.5;
              particles.push(makeParticle(f.x, f.y, Math.cos(a) * sp, Math.sin(a) * sp, hue + layer * 30, 3));
            }
          }
        } else if (type === 'heart') {
          for (let i = 0; i < count; i++) {
            const t = (i / count) * Math.PI * 2;
            const hx = 16 * Math.pow(Math.sin(t), 3);
            const hy = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
            const sp = 0.25;
            particles.push(makeParticle(f.x, f.y, hx * sp, hy * sp, 0 + rand(-15, 15), 3));
          }
        } else if (type === 'star') {
          const points = 5;
          for (let i = 0; i < count; i++) {
            const t = (i / count) * Math.PI * 2;
            const r = 4 + 2 * Math.cos(points * t);
            particles.push(makeParticle(f.x, f.y, Math.cos(t) * r, Math.sin(t) * r, hue, 3));
          }
        }
      }

      function makeParticle(x, y, vx, vy, hue, size) {
        return {
          x,
          y,
          vx,
          vy,
          hue,
          size,
          life: 1,
          decay: rand(0.008, 0.018),
          gravity: 0.04,
          trail: [],
        };
      }

      function updateFireworks() {
        for (let i = fireworks.length - 1; i >= 0; i--) {
          const f = fireworks[i];
          f.trail.push({ x: f.x, y: f.y });
          if (f.trail.length > 8) f.trail.shift();
          f.x += f.vx;
          f.y += f.vy;
          f.vy += 0.12;
          if (f.vy >= 0 || f.y <= f.ty) {
            explode(f);
            fireworks.splice(i, 1);
          }
        }
      }

      function updateParticles() {
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.trail.push({ x: p.x, y: p.y });
          if (p.trail.length > (p.willow ? 15 : 5)) p.trail.shift();
          p.x += p.vx;
          p.y += p.vy;
          p.vy += p.gravity;
          p.vx *= 0.99;
          p.vy *= 0.99;
          p.life -= p.decay;
          if (p.life <= 0) particles.splice(i, 1);
        }
      }

      function draw() {
        ctx.fillStyle = 'rgba(5,5,15,0.18)';
        ctx.fillRect(0, 0, W, H);

        for (const f of fireworks) {
          for (let j = 0; j < f.trail.length; j++) {
            const t = f.trail[j];
            const a = j / f.trail.length;
            ctx.fillStyle = `hsla(${f.hue},90%,75%,${a * 0.6})`;
            ctx.beginPath();
            ctx.arc(t.x, t.y, a * 2, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.fillStyle = `hsl(${f.hue},90%,80%)`;
          ctx.beginPath();
          ctx.arc(f.x, f.y, 2.5, 0, Math.PI * 2);
          ctx.fill();
        }

        for (const p of particles) {
          for (let j = 0; j < p.trail.length; j++) {
            const t = p.trail[j];
            const a = (j / p.trail.length) * p.life * 0.5;
            ctx.fillStyle = `hsla(${p.hue},90%,65%,${a})`;
            ctx.beginPath();
            ctx.arc(t.x, t.y, p.size * (j / p.trail.length) * 0.8, 0, Math.PI * 2);
            ctx.fill();
          }
          const glow = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, Math.max(1, p.size * 3));
          glow.addColorStop(0, `hsla(${p.hue},100%,70%,${p.life})`);
          glow.addColorStop(1, `hsla(${p.hue},100%,70%,0)`);
          ctx.fillStyle = glow;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size * 3, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = `hsla(${p.hue},100%,85%,${p.life})`;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      function loop(t) {
        if (autoFire && t - lastAuto > rand(600, 1400)) {
          launchFirework(rand(W * 0.15, W * 0.85), rand(H * 0.15, H * 0.45));
          lastAuto = t;
        }
        updateFireworks();
        updateParticles();
        draw();
        requestAnimationFrame(loop);
      }

      canvas.addEventListener('click', (e) => {
        launchFirework(e.clientX, e.clientY);
      });

      document.getElementById('autoBtn').onclick = function () {
        autoFire = !autoFire;
        this.textContent = '自动发射：' + (autoFire ? '开' : '关');
        this.classList.toggle('active', autoFire);
      };
      document.getElementById('typeBtn').onclick = function () {
        if (forceType === 'random') forceType = 'burst';
        else if (forceType === 'burst') forceType = 'ring';
        else if (forceType === 'ring') forceType = 'willow';
        else if (forceType === 'willow') forceType = 'chrysanthemum';
        else if (forceType === 'chrysanthemum') forceType = 'heart';
        else if (forceType === 'heart') forceType = 'star';
        else if (forceType === 'star') forceType = 'random';
        this.textContent =
          '类型：' +
          {
            burst: '球形',
            ring: '环形',
            willow: '柳枝',
            chrysanthemum: '菊花',
            heart: '心形',
            star: '星形',
            random: '随机',
          }[forceType];
      };
      document.getElementById('clearBtn').onclick = () => {
        fireworks = [];
        particles = [];
      };

      resize();
      document.getElementById('autoBtn').classList.add('active');
      requestAnimationFrame(loop);
    </script>
  </body>
</html>
