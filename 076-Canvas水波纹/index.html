<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Canvas 水波纹</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0a2030;
      }
      canvas {
        display: block;
        cursor: pointer;
      }
      .ui {
        position: fixed;
        top: 20px;
        left: 20px;
        color: #c8e8ff;
        font-family: 'Microsoft YaHei', sans-serif;
        font-size: 14px;
        line-height: 1.9;
        text-shadow: 0 0 8px rgba(80, 180, 255, 0.6);
        pointer-events: none;
      }
      .ui b {
        color: #a8e0ff;
        font-size: 16px;
      }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div class="ui">
      <b>水波涟漪</b>
      <br />
      点击水面 - 激起涟漪
      <br />
      多重波纹相互交织
    </div>
    <script>
      const canvas = document.getElementById('c');
      const ctx = canvas.getContext('2d');
      let W, H;
      const ripples = [];
      const drops = [];
      let bgTime = 0;

      function resize() {
        W = canvas.width = window.innerWidth;
        H = canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resize);

      function rand(a, b) {
        return a + Math.random() * (b - a);
      }

      function addRipple(x, y, strength = 1) {
        ripples.push({
          x,
          y,
          radius: 0,
          maxRadius: rand(150, 280) * strength,
          speed: rand(1.8, 2.6),
          life: 1,
          decay: rand(0.004, 0.008),
          thickness: rand(1.5, 3),
          strength: strength,
        });
        for (let i = 0; i < 3; i++) {
          ripples.push({
            x,
            y,
            radius: 0,
            maxRadius: rand(80, 150) * strength,
            speed: rand(2.5, 3.5),
            life: 1,
            decay: rand(0.008, 0.014),
            thickness: rand(1, 2),
            strength: strength * 0.7,
            delay: i * 8,
          });
        }
      }

      function spawnDrop() {
        if (Math.random() < 0.02) {
          drops.push({
            x: rand(W * 0.1, W * 0.9),
            y: -20,
            vy: rand(6, 10),
            size: rand(2, 4),
          });
        }
      }

      function drawBackground() {
        const g = ctx.createLinearGradient(0, 0, 0, H);
        g.addColorStop(0, '#1a3a5a');
        g.addColorStop(0.3, '#2a5878');
        g.addColorStop(0.7, '#1a4060');
        g.addColorStop(1, '#0a2030');
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, W, H);

        const lightX = W * 0.3 + Math.sin(bgTime * 0.0005) * 100;
        const lightG = ctx.createRadialGradient(lightX, H * 0.2, 0, lightX, H * 0.2, W * 0.6);
        lightG.addColorStop(0, 'rgba(180,220,255,0.15)');
        lightG.addColorStop(1, 'rgba(180,220,255,0)');
        ctx.fillStyle = lightG;
        ctx.fillRect(0, 0, W, H);

        ctx.strokeStyle = 'rgba(150,200,240,0.05)';
        ctx.lineWidth = 1;
        for (let y = 0; y < H; y += 4) {
          ctx.beginPath();
          ctx.moveTo(0, y);
          for (let x = 0; x <= W; x += 20) {
            const wave = Math.sin((x + bgTime * 0.5) * 0.01 + y * 0.02) * 1.5;
            ctx.lineTo(x, y + wave);
          }
          ctx.stroke();
        }
      }

      function drawRipples() {
        for (let i = ripples.length - 1; i >= 0; i--) {
          const r = ripples[i];
          if (r.delay && r.delay > 0) {
            r.delay--;
            continue;
          }
          r.radius += r.speed;
          r.life -= r.decay;
          if (r.life <= 0 || r.radius > r.maxRadius) {
            ripples.splice(i, 1);
            continue;
          }
          const alpha = r.life * 0.7 * r.strength;
          const innerR = Math.max(0.1, r.radius - r.thickness * 3);

          const g = ctx.createRadialGradient(
            r.x,
            r.y,
            innerR,
            r.x,
            r.y,
            Math.max(innerR + 1, r.radius)
          );
          g.addColorStop(0, 'rgba(200,230,255,0)');
          g.addColorStop(0.7, `rgba(200,230,255,${alpha * 0.3})`);
          g.addColorStop(0.9, `rgba(220,240,255,${alpha})`);
          g.addColorStop(1, 'rgba(200,230,255,0)');
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.arc(r.x, r.y, r.radius, 0, Math.PI * 2);
          ctx.arc(r.x, r.y, innerR, 0, Math.PI * 2, true);
          ctx.fill();

          ctx.strokeStyle = `rgba(255,255,255,${alpha * 0.6})`;
          ctx.lineWidth = r.thickness;
          ctx.beginPath();
          ctx.arc(r.x, r.y, r.radius, 0, Math.PI * 2);
          ctx.stroke();

          if (r.strength > 0.8) {
            const shadowG = ctx.createRadialGradient(r.x, r.y, 0, r.x, r.y, Math.max(1, r.radius));
            shadowG.addColorStop(0, `rgba(255,255,255,${alpha * 0.15})`);
            shadowG.addColorStop(0.8, 'rgba(255,255,255,0)');
            ctx.fillStyle = shadowG;
            ctx.beginPath();
            ctx.arc(r.x, r.y, r.radius, 0, Math.PI * 2);
            ctx.fill();
          }
        }
      }

      function drawDrops() {
        for (let i = drops.length - 1; i >= 0; i--) {
          const d = drops[i];
          d.y += d.vy;
          d.vy += 0.3;

          ctx.fillStyle = 'rgba(200,230,255,0.7)';
          ctx.beginPath();
          ctx.ellipse(d.x, d.y, d.size * 0.5, d.size * 1.5, 0, 0, Math.PI * 2);
          ctx.fill();

          if (d.y >= H * 0.5 + rand(-50, 50)) {
            addRipple(d.x, d.y, 0.5);
            drops.splice(i, 1);
          }
        }
      }

      function loop(t) {
        bgTime = t;
        drawBackground();
        spawnDrop();
        drawDrops();
        drawRipples();
        requestAnimationFrame(loop);
      }

      canvas.addEventListener('click', (e) => {
        addRipple(e.clientX, e.clientY, 1.2);
      });
      canvas.addEventListener('mousemove', (e) => {
        if (Math.random() < 0.03) addRipple(e.clientX, e.clientY, 0.3);
      });

      resize();
      requestAnimationFrame(loop);
    </script>
  </body>
</html>
