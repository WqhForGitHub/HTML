<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Canvas 波浪动画</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0a1830;
      }
      canvas {
        display: block;
      }
      .ui {
        position: fixed;
        top: 20px;
        left: 20px;
        color: #ffd8a0;
        font-family: 'Microsoft YaHei', sans-serif;
        font-size: 14px;
        line-height: 1.9;
        text-shadow: 0 0 8px rgba(255, 180, 100, 0.6);
        pointer-events: none;
      }
      .ui b {
        color: #ffe8b0;
        font-size: 16px;
      }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div class="ui">
      <b>海浪夕照</b>
      <br />
      多层正弦波浪叠加
      <br />
      日落海面光影流转
    </div>
    <script>
      const canvas = document.getElementById('c');
      const ctx = canvas.getContext('2d');
      let W, H;
      let t = 0;

      function resize() {
        W = canvas.width = window.innerWidth;
        H = canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resize);

      const waves = [
        {
          amp: 25,
          freq: 0.008,
          speed: 0.02,
          phase: 0,
          color1: 'rgba(255,160,80,0.35)',
          color2: 'rgba(180,80,40,0.3)',
          yOffset: 0.45,
        },
        {
          amp: 35,
          freq: 0.006,
          speed: 0.015,
          phase: 1,
          color1: 'rgba(200,100,60,0.45)',
          color2: 'rgba(120,50,40,0.4)',
          yOffset: 0.52,
        },
        {
          amp: 30,
          freq: 0.01,
          speed: 0.025,
          phase: 2,
          color1: 'rgba(120,60,80,0.55)',
          color2: 'rgba(60,30,60,0.5)',
          yOffset: 0.6,
        },
        {
          amp: 45,
          freq: 0.005,
          speed: 0.018,
          phase: 3,
          color1: 'rgba(60,40,80,0.65)',
          color2: 'rgba(30,20,50,0.6)',
          yOffset: 0.68,
        },
        {
          amp: 40,
          freq: 0.012,
          speed: 0.03,
          phase: 4,
          color1: 'rgba(30,30,60,0.8)',
          color2: 'rgba(10,10,30,0.9)',
          yOffset: 0.78,
        },
      ];

      function drawSky() {
        const g = ctx.createLinearGradient(0, 0, 0, H * 0.7);
        g.addColorStop(0, '#1a1840');
        g.addColorStop(0.3, '#4a2860');
        g.addColorStop(0.6, '#c8483a');
        g.addColorStop(0.85, '#f0a040');
        g.addColorStop(1, '#ffd870');
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, W, H * 0.7);
      }

      function drawSun() {
        const sx = W * 0.5;
        const sy = H * 0.42 + Math.sin(t * 0.005) * 3;
        const sr = Math.min(W, H) * 0.08;

        const glow = ctx.createRadialGradient(sx, sy, 0, sx, sy, sr * 6);
        glow.addColorStop(0, 'rgba(255,220,150,0.4)');
        glow.addColorStop(0.3, 'rgba(255,180,80,0.2)');
        glow.addColorStop(1, 'rgba(255,120,40,0)');
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(sx, sy, sr * 6, 0, Math.PI * 2);
        ctx.fill();

        const sg = ctx.createRadialGradient(sx, sy, 0, sx, sy, Math.max(1, sr));
        sg.addColorStop(0, '#fff8e0');
        sg.addColorStop(0.5, '#ffd870');
        sg.addColorStop(1, '#ff9040');
        ctx.fillStyle = sg;
        ctx.beginPath();
        ctx.arc(sx, sy, sr, 0, Math.PI * 2);
        ctx.fill();
      }

      function drawClouds() {
        ctx.fillStyle = 'rgba(80,40,60,0.4)';
        for (let i = 0; i < 4; i++) {
          const cx = ((t * 0.3 + i * W * 0.3) % (W + 200)) - 100;
          const cy = H * (0.15 + i * 0.05);
          ctx.beginPath();
          ctx.ellipse(cx, cy, 80, 12, 0, 0, Math.PI * 2);
          ctx.ellipse(cx + 50, cy - 5, 60, 10, 0, 0, Math.PI * 2);
          ctx.ellipse(cx - 40, cy + 3, 50, 8, 0, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      function drawSunReflection() {
        const sx = W * 0.5;
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        for (let y = H * 0.5; y < H; y += 6) {
          const wave = Math.sin((y + t * 2) * 0.05) * 8;
          const width = 40 + (y - H * 0.5) * 0.3;
          const alpha = Math.max(0, 0.4 - ((y - H * 0.5) / H) * 0.6);
          ctx.fillStyle = `rgba(255,200,100,${alpha})`;
          ctx.fillRect(sx - width / 2 + wave, y, width, 3);
        }
        ctx.restore();
      }

      function drawWaves() {
        for (const w of waves) {
          ctx.beginPath();
          const baseY = H * w.yOffset;
          ctx.moveTo(0, H);
          ctx.lineTo(0, baseY);
          for (let x = 0; x <= W; x += 4) {
            let y = baseY;
            y += Math.sin(x * w.freq + t * w.speed + w.phase) * w.amp;
            y += Math.sin(x * w.freq * 2.3 + t * w.speed * 1.5 + w.phase) * w.amp * 0.3;
            y += Math.sin(x * w.freq * 0.5 + t * w.speed * 0.7) * w.amp * 0.5;
            ctx.lineTo(x, y);
          }
          ctx.lineTo(W, H);
          ctx.closePath();

          const g = ctx.createLinearGradient(0, baseY - w.amp, 0, H);
          g.addColorStop(0, w.color1);
          g.addColorStop(1, w.color2);
          ctx.fillStyle = g;
          ctx.fill();

          ctx.strokeStyle = 'rgba(255,220,180,0.15)';
          ctx.lineWidth = 1;
          ctx.beginPath();
          for (let x = 0; x <= W; x += 4) {
            let y = baseY;
            y += Math.sin(x * w.freq + t * w.speed + w.phase) * w.amp;
            y += Math.sin(x * w.freq * 2.3 + t * w.speed * 1.5 + w.phase) * w.amp * 0.3;
            y += Math.sin(x * w.freq * 0.5 + t * w.speed * 0.7) * w.amp * 0.5;
            if (x === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
          }
          ctx.stroke();
        }
      }

      function loop() {
        drawSky();
        drawSun();
        drawClouds();
        drawWaves();
        drawSunReflection();
        t++;
        requestAnimationFrame(loop);
      }

      resize();
      requestAnimationFrame(loop);
    </script>
  </body>
</html>
