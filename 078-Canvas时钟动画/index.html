<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Canvas 时钟动画</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: radial-gradient(circle at center, #1a1530, #050510);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Microsoft YaHei', sans-serif;
      }
      canvas {
        display: block;
      }
      .info {
        position: fixed;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        color: #b8a8d8;
        font-size: 13px;
        letter-spacing: 2px;
        text-shadow: 0 0 8px rgba(160, 120, 220, 0.5);
      }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div class="info">精 致 模 拟 时 钟 · 实 时 走 动</div>
    <script>
      const canvas = document.getElementById('c');
      const ctx = canvas.getContext('2d');
      let size;

      function resize() {
        size = Math.min(window.innerWidth, window.innerHeight) * 0.85;
        canvas.width = size;
        canvas.height = size;
      }
      window.addEventListener('resize', resize);

      function drawClock() {
        const cx = size / 2;
        const cy = size / 2;
        const R = (size / 2) * 0.9;
        ctx.clearRect(0, 0, size, size);

        ctx.shadowColor = 'rgba(160,120,220,0.6)';
        ctx.shadowBlur = 40;
        const outerG = ctx.createRadialGradient(
          cx - R * 0.3,
          cy - R * 0.3,
          R * 0.2,
          cx,
          cy,
          Math.max(1, R)
        );
        outerG.addColorStop(0, '#3a2a50');
        outerG.addColorStop(0.7, '#1a1030');
        outerG.addColorStop(1, '#0a0518');
        ctx.fillStyle = outerG;
        ctx.beginPath();
        ctx.arc(cx, cy, R, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;

        ctx.strokeStyle = '#a888d0';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(cx, cy, R, 0, Math.PI * 2);
        ctx.stroke();

        ctx.strokeStyle = 'rgba(168,136,208,0.5)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(cx, cy, R * 0.92, 0, Math.PI * 2);
        ctx.stroke();

        const faceG = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(1, R * 0.88));
        faceG.addColorStop(0, '#251a3a');
        faceG.addColorStop(1, '#150a25');
        ctx.fillStyle = faceG;
        ctx.beginPath();
        ctx.arc(cx, cy, R * 0.88, 0, Math.PI * 2);
        ctx.fill();

        for (let i = 0; i < 60; i++) {
          const angle = (i / 60) * Math.PI * 2 - Math.PI / 2;
          const isHour = i % 5 === 0;
          const r1 = R * (isHour ? 0.78 : 0.83);
          const r2 = R * 0.86;
          ctx.strokeStyle = isHour ? '#e8c8ff' : 'rgba(168,136,208,0.4)';
          ctx.lineWidth = isHour ? 2.5 : 1;
          ctx.beginPath();
          ctx.moveTo(cx + Math.cos(angle) * r1, cy + Math.sin(angle) * r1);
          ctx.lineTo(cx + Math.cos(angle) * r2, cy + Math.sin(angle) * r2);
          ctx.stroke();
        }

        ctx.fillStyle = '#f0d8ff';
        ctx.font = `bold ${R * 0.09}px Georgia, serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        const nums = ['十二', '一', '二', '三', '四', '五', '六', '七', '八', '九', '十', '十一'];
        for (let i = 0; i < 12; i++) {
          const angle = (i / 12) * Math.PI * 2 - Math.PI / 2;
          const r = R * 0.68;
          ctx.fillText(nums[i], cx + Math.cos(angle) * r, cy + Math.sin(angle) * r);
        }

        const now = new Date();
        const ms = now.getMilliseconds();
        const sec = now.getSeconds() + ms / 1000;
        const min = now.getMinutes() + sec / 60;
        const hour = (now.getHours() % 12) + min / 60;

        drawHand(cx, cy, (hour / 12) * Math.PI * 2 - Math.PI / 2, R * 0.45, R * 0.05, '#e8c8ff', 6);
        drawHand(cx, cy, (min / 60) * Math.PI * 2 - Math.PI / 2, R * 0.65, R * 0.035, '#c8a8e8', 4);

        ctx.shadowColor = 'rgba(255,100,150,0.8)';
        ctx.shadowBlur = 12;
        drawHand(cx, cy, (sec / 60) * Math.PI * 2 - Math.PI / 2, R * 0.75, R * 0.01, '#ff6090', 2);
        ctx.shadowBlur = 0;

        ctx.strokeStyle = '#ff6090';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(
          cx - Math.cos((sec / 60) * Math.PI * 2 - Math.PI / 2) * R * 0.15,
          cy - Math.sin((sec / 60) * Math.PI * 2 - Math.PI / 2) * R * 0.15
        );
        ctx.lineTo(
          cx + Math.cos((sec / 60) * Math.PI * 2 - Math.PI / 2) * R * 0.75,
          cy + Math.sin((sec / 60) * Math.PI * 2 - Math.PI / 2) * R * 0.75
        );
        ctx.stroke();

        const centerG = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(1, R * 0.05));
        centerG.addColorStop(0, '#fff0ff');
        centerG.addColorStop(0.5, '#e8c8ff');
        centerG.addColorStop(1, '#8868a0');
        ctx.fillStyle = centerG;
        ctx.beginPath();
        ctx.arc(cx, cy, R * 0.045, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#ff6090';
        ctx.beginPath();
        ctx.arc(cx, cy, R * 0.015, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = 'rgba(200,168,232,0.7)';
        ctx.font = `${R * 0.06}px Georgia, serif`;
        ctx.fillText('自动·机械', cx, cy + R * 0.35);

        const h = String(now.getHours()).padStart(2, '0');
        const m = String(now.getMinutes()).padStart(2, '0');
        const s = String(now.getSeconds()).padStart(2, '0');
        ctx.fillStyle = '#a888d0';
        ctx.font = `${R * 0.05}px Consolas, monospace`;
        ctx.fillText(`${h}:${m}:${s}`, cx, cy - R * 0.35);
      }

      function drawHand(cx, cy, angle, length, width, color) {
        ctx.strokeStyle = color;
        ctx.lineWidth = Math.max(1, width * 30);
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(cx - Math.cos(angle) * length * 0.15, cy - Math.sin(angle) * length * 0.15);
        ctx.lineTo(cx + Math.cos(angle) * length, cy + Math.sin(angle) * length);
        ctx.stroke();
      }

      function loop() {
        drawClock();
        requestAnimationFrame(loop);
      }

      resize();
      requestAnimationFrame(loop);
    </script>
  </body>
</html>
