<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Canvas 雷达扫描</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #020a02;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Consolas', 'Microsoft YaHei', monospace;
      }
      canvas {
        display: block;
      }
      .hud {
        position: fixed;
        top: 20px;
        right: 20px;
        color: #4aff4a;
        font-size: 13px;
        line-height: 1.8;
        text-shadow: 0 0 6px rgba(74, 255, 74, 0.6);
        border: 1px solid rgba(74, 255, 74, 0.3);
        padding: 10px 14px;
        background: rgba(0, 20, 0, 0.4);
        border-radius: 4px;
      }
      .hud b {
        color: #8aff8a;
      }
      .hud .blink {
        animation: blink 1s infinite;
      }
      @keyframes blink {
        50% {
          opacity: 0.3;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div class="hud">
      <b>雷达扫描系统</b>
      <br />
      状态：
      <span class="blink">运行中</span>
      <br />
      范围：100 公里
      <br />
      扫描频率：1.2 转/秒
      <br />
      目标数：
      <span id="count">0</span>
    </div>
    <script>
      const canvas = document.getElementById('c');
      const ctx = canvas.getContext('2d');
      let size, cx, cy, R;
      let angle = 0;
      const blips = [];
      let lastBlipSpawn = 0;

      function resize() {
        size = Math.min(window.innerWidth, window.innerHeight) * 0.92;
        canvas.width = size;
        canvas.height = size;
        cx = size / 2;
        cy = size / 2;
        R = (size / 2) * 0.9;
      }
      window.addEventListener('resize', resize);

      function rand(a, b) {
        return a + Math.random() * (b - a);
      }

      const targetNames = [
        '敌机',
        '不明飞行物',
        '侦察机',
        '直升机',
        '民航机',
        '导弹',
        '无人机',
        '隐形战机',
        '轰炸机',
        '运输机',
      ];

      function spawnBlip() {
        const r = rand(R * 0.15, R * 0.95);
        const a = Math.random() * Math.PI * 2;
        blips.push({
          x: cx + Math.cos(a) * r,
          y: cy + Math.sin(a) * r,
          distance: ((r / R) * 100).toFixed(1),
          bearing: (((a * 180) / Math.PI + 90 + 360) % 360).toFixed(0),
          name: targetNames[Math.floor(Math.random() * targetNames.length)],
          life: 1,
          detected: false,
          detectedTime: 0,
          speed: rand(0.2, 0.8),
          angle: a,
          radius: r,
          id: Math.floor(rand(1000, 9999)),
        });
      }

      function drawBackground() {
        const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(1, R));
        g.addColorStop(0, '#0a1a0a');
        g.addColorStop(0.7, '#051205');
        g.addColorStop(1, '#020802');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(cx, cy, R, 0, Math.PI * 2);
        ctx.fill();
      }

      function drawGrid() {
        ctx.strokeStyle = 'rgba(74,255,74,0.25)';
        ctx.lineWidth = 1;
        for (let i = 1; i <= 4; i++) {
          ctx.beginPath();
          ctx.arc(cx, cy, (R * i) / 4, 0, Math.PI * 2);
          ctx.stroke();
        }
        for (let i = 0; i < 12; i++) {
          const a = (i / 12) * Math.PI * 2;
          ctx.beginPath();
          ctx.moveTo(cx, cy);
          ctx.lineTo(cx + Math.cos(a) * R, cy + Math.sin(a) * R);
          ctx.stroke();
        }

        ctx.strokeStyle = 'rgba(74,255,74,0.5)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(cx, cy, R, 0, Math.PI * 2);
        ctx.stroke();

        ctx.fillStyle = 'rgba(74,255,74,0.7)';
        ctx.font = '11px Consolas, monospace';
        ctx.textAlign = 'center';
        for (let i = 0; i < 4; i++) {
          const a = (i / 4) * Math.PI * 2 - Math.PI / 2;
          const dist = (R * (i + 1)) / 4;
          ctx.fillText(`${(i + 1) * 25}km`, cx + Math.cos(a) * dist, cy + Math.sin(a) * dist - 5);
        }

        ctx.fillStyle = 'rgba(74,255,74,0.6)';
        ctx.font = 'bold 12px Consolas, monospace';
        const dirs = ['北 000', '东 090', '南 180', '西 270'];
        for (let i = 0; i < 4; i++) {
          const a = (i / 4) * Math.PI * 2 - Math.PI / 2;
          ctx.fillText(dirs[i], cx + Math.cos(a) * (R + 18), cy + Math.sin(a) * (R + 18));
        }
      }

      function drawSweep() {
        const sweepG = ctx.createConicGradient(angle - Math.PI / 2, cx, cy);
        sweepG.addColorStop(0, 'rgba(74,255,74,0.5)');
        sweepG.addColorStop(0.15, 'rgba(74,255,74,0.2)');
        sweepG.addColorStop(0.3, 'rgba(74,255,74,0.05)');
        sweepG.addColorStop(1, 'rgba(74,255,74,0)');
        ctx.fillStyle = sweepG;
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.arc(cx, cy, R, angle - Math.PI / 2, angle + Math.PI * 1.5 - Math.PI / 2);
        ctx.closePath();
        ctx.fill();

        ctx.strokeStyle = 'rgba(120,255,120,0.9)';
        ctx.lineWidth = 2;
        ctx.shadowColor = 'rgba(74,255,74,0.8)';
        ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(cx + Math.cos(angle - Math.PI / 2) * R, cy + Math.sin(angle - Math.PI / 2) * R);
        ctx.stroke();
        ctx.shadowBlur = 0;
      }

      function updateBlips(t) {
        if (t - lastBlipSpawn > rand(800, 2000) && blips.length < 8) {
          spawnBlip();
          lastBlipSpawn = t;
        }

        for (let i = blips.length - 1; i >= 0; i--) {
          const b = blips[i];
          b.angle += b.speed * 0.002;
          b.x = cx + Math.cos(b.angle) * b.radius;
          b.y = cy + Math.sin(b.angle) * b.radius;
          b.distance = ((b.radius / R) * 100).toFixed(1);
          b.bearing = (((b.angle * 180) / Math.PI + 90 + 360) % 360).toFixed(0);

          const blipAngle = (b.angle + Math.PI / 2 + Math.PI * 2) % (Math.PI * 2);
          const sweepAngle = angle % (Math.PI * 2);
          const diff = Math.abs(blipAngle - sweepAngle);
          if (diff < 0.05 || diff > Math.PI * 2 - 0.05) {
            b.detected = true;
            b.detectedTime = t;
            b.life = 1;
          }

          if (b.detected) {
            b.life -= 0.003;
          }
          if (b.life <= 0) blips.splice(i, 1);
        }
        document.getElementById('count').textContent = blips.length;
      }

      function drawBlips() {
        for (const b of blips) {
          if (!b.detected) continue;
          const alpha = b.life;
          const pulse = Math.sin(Date.now() * 0.008) * 0.3 + 0.7;

          const g = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, Math.max(1, 12));
          g.addColorStop(0, `rgba(255,80,80,${alpha * pulse})`);
          g.addColorStop(1, 'rgba(255,80,80,0)');
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.arc(b.x, b.y, 12, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = `rgba(255,120,120,${alpha})`;
          ctx.beginPath();
          ctx.arc(b.x, b.y, 3, 0, Math.PI * 2);
          ctx.fill();

          if (alpha > 0.5) {
            ctx.strokeStyle = `rgba(255,150,150,${alpha * 0.6})`;
            ctx.lineWidth = 0.5;
            ctx.beginPath();
            ctx.moveTo(b.x + 5, b.y);
            ctx.lineTo(b.x + 30, b.y);
            ctx.stroke();

            ctx.fillStyle = `rgba(255,180,180,${alpha})`;
            ctx.font = '9px Consolas, monospace';
            ctx.textAlign = 'left';
            ctx.fillText(`${b.name} #${b.id}`, b.x + 8, b.y - 4);
            ctx.fillText(`距离:${b.distance}km 方位:${b.bearing}°`, b.x + 8, b.y + 8);
          }
        }
      }

      function drawCenter() {
        ctx.fillStyle = '#4aff4a';
        ctx.beginPath();
        ctx.arc(cx, cy, 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = 'rgba(74,255,74,0.5)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(cx, cy, 8, 0, Math.PI * 2);
        ctx.stroke();
      }

      function loop(t) {
        ctx.fillStyle = 'rgba(2,10,2,0.15)';
        ctx.fillRect(0, 0, size, size);

        drawBackground();
        drawGrid();
        drawBlips();
        drawSweep();
        drawCenter();

        angle += 0.02;
        updateBlips(t);
        requestAnimationFrame(loop);
      }

      resize();
      requestAnimationFrame(loop);
    </script>
  </body>
</html>
