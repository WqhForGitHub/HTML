<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SVG图标制作展示</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
        background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
        min-height: 100vh;
        color: #fff;
        padding: 30px 20px;
      }
      .container {
        max-width: 1200px;
        margin: 0 auto;
      }
      h1 {
        text-align: center;
        font-size: 2.4rem;
        margin-bottom: 8px;
        background: linear-gradient(90deg, #ffd194, #70e1f5);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      .subtitle {
        text-align: center;
        color: #b8d4f0;
        margin-bottom: 40px;
        font-size: 1rem;
      }
      .section-title {
        font-size: 1.5rem;
        margin: 40px 0 20px;
        padding-left: 14px;
        border-left: 4px solid #70e1f5;
      }
      .icon-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
        gap: 18px;
        margin-bottom: 30px;
      }
      .icon-card {
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 14px;
        padding: 20px 10px 14px;
        text-align: center;
        transition: all 0.3s ease;
        cursor: pointer;
        backdrop-filter: blur(8px);
      }
      .icon-card:hover {
        background: rgba(255, 255, 255, 0.18);
        transform: translateY(-6px);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      }
      .icon-card svg {
        width: 48px;
        height: 48px;
        fill: #b8d4f0;
        transition: all 0.3s ease;
      }
      .icon-card:hover svg {
        fill: #ffd194;
        transform: scale(1.15);
      }
      .icon-card .name {
        margin-top: 10px;
        font-size: 0.85rem;
        color: #d6e6ff;
      }
      .icon-card .path-info {
        font-size: 0.65rem;
        color: #8aa8c8;
        margin-top: 4px;
      }

      /* Construction section */
      .construction-area {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 30px;
        background: rgba(0, 0, 0, 0.25);
        border-radius: 16px;
        padding: 30px;
      }
      .grid-display {
        position: relative;
        background: #0d1f3c;
        border-radius: 12px;
        padding: 30px;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 320px;
      }
      .grid-display svg {
        width: 240px;
        height: 240px;
      }
      .info-panel h3 {
        color: #ffd194;
        margin-bottom: 14px;
        font-size: 1.15rem;
      }
      .info-panel p {
        color: #c8d8ee;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
      }
      .info-panel code {
        background: rgba(0, 0, 0, 0.4);
        padding: 2px 8px;
        border-radius: 4px;
        color: #70e1f5;
        font-size: 0.85rem;
      }
      .control-row {
        margin-top: 16px;
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }
      .control-row button {
        background: linear-gradient(135deg, #667eea, #764ba2);
        color: #fff;
        border: none;
        padding: 8px 16px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 0.85rem;
        transition: transform 0.2s;
      }
      .control-row button:hover {
        transform: scale(1.05);
      }
      .control-row button.active {
        background: linear-gradient(135deg, #ffd194, #ff8c69);
      }
      .grid-line {
        stroke: rgba(255, 255, 255, 0.08);
        stroke-width: 0.5;
      }
      .grid-line-major {
        stroke: rgba(255, 255, 255, 0.15);
        stroke-width: 0.5;
      }
      .icon-path-demo {
        fill: none;
        stroke: #70e1f5;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
        transition: all 0.3s;
      }
      .icon-path-demo.filled {
        fill: #ffd194;
        stroke: #ffd194;
      }
      .toggle-grid {
        display: block;
        margin-top: 14px;
        color: #b8d4f0;
        font-size: 0.85rem;
      }
      .toggle-grid input {
        margin-right: 6px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>SVG 图标制作展示</h1>
      <p class="subtitle">手工艺品级的 16+ 矢量图标 · 纯路径绘制 · 悬停色彩动画</p>

      <h2 class="section-title">图标画廊</h2>
      <div class="icon-grid" id="iconGrid"></div>

      <h2 class="section-title">图标构造解析</h2>
      <div class="construction-area">
        <div class="grid-display">
          <svg viewBox="0 0 24 24" id="constructionSvg">
            <!-- Grid lines -->
            <g id="gridLines"></g>
            <!-- Icon path -->
            <path class="icon-path-demo" id="iconDemo" d="" />
          </svg>
        </div>
        <div class="info-panel">
          <h3 id="iconTitle">首页 Home</h3>
          <p id="iconDesc">使用基础路径命令绘制。SVG 图标基于 24x24 网格系统，每个图标在网格内保持视觉一致性。</p>
          <p>
            路径数据：
            <br />
            <code id="pathData">M3 12 L12 3 L21 12 M5 10 L5 21 L19 21 L19 10</code>
          </p>
          <p>
            关键命令：
            <code>M</code>
            移动 ·
            <code>L</code>
            直线 ·
            <code>C</code>
            曲线 ·
            <code>Z</code>
            闭合
          </p>
          <div class="control-row" id="demoControls"></div>
          <label class="toggle-grid">
            <input type="checkbox" id="fillToggle" />
            填充模式
          </label>
          <label class="toggle-grid">
            <input type="checkbox" id="gridToggle" checked />
            显示网格
          </label>
        </div>
      </div>
    </div>

    <script>
      // Icon library - all hand-crafted paths on 24x24 grid
      const icons = [
        {
          name: '首页',
          path: 'M3 12 L12 3 L21 12 M5 10 L5 21 L10 21 L10 15 L14 15 L14 21 L19 21 L19 10',
          filled: false,
          desc: '经典房屋造型，屋顶三角形 + 主体矩形 + 门。使用直线命令构成。',
        },
        {
          name: '用户',
          path: 'M12 12 m-4 0 a4 4 0 1 0 8 0 a4 4 0 1 0 -8 0 M4 21 C4 17 7 15 12 15 C17 15 20 17 20 21',
          filled: false,
          desc: '用户头像，圆代表头部，弧线代表肩膀轮廓。',
        },
        {
          name: '设置',
          path: 'M12 8 a4 4 0 1 0 0 8 a4 4 0 1 0 0 -8 M12 2 L12 5 M12 19 L12 22 M2 12 L5 12 M19 12 L22 12 M4.9 4.9 L7 7 M17 17 L19.1 19.1 M4.9 19.1 L7 17 M17 7 L19.1 4.9',
          filled: false,
          desc: '齿轮简化版，中心圆 + 八个调节点代表齿轮齿牙。',
        },
        {
          name: '搜索',
          path: 'M11 11 m-7 0 a7 7 0 1 0 14 0 a7 7 0 1 0 -14 0 M16 16 L21 21',
          filled: false,
          desc: '放大镜，圆环表示镜片，斜线表示手柄。',
        },
        {
          name: '心形',
          path: 'M12 21 C12 21 4 14 4 8 C4 5 6 3 9 3 C10.5 3 12 4 12 5.5 C12 4 13.5 3 15 3 C18 3 20 5 20 8 C20 14 12 21 12 21 Z',
          filled: true,
          desc: '心形使用贝塞尔曲线绘制，对称结构带来美感。',
        },
        {
          name: '星星',
          path: 'M12 2 L14.5 9 L22 9 L16 13.5 L18 21 L12 16.5 L6 21 L8 13.5 L2 9 L9.5 9 Z',
          filled: true,
          desc: '五角星，十个顶点通过直线连接构成。',
        },
        {
          name: '铃铛',
          path: 'M6 17 L6 11 C6 7 8 5 12 5 C16 5 18 7 18 11 L18 17 Z M9 17 C9 19 10 20 12 20 C14 20 15 19 15 17 M11 3 a1 1 0 0 0 2 0',
          filled: false,
          desc: '通知铃铛，顶部小圆点 + 主体 + 底部摆锤。',
        },
        {
          name: '邮件',
          path: 'M3 6 L21 6 L21 18 L3 18 Z M3 6 L12 13 L21 6',
          filled: false,
          desc: '信封，矩形外框 + 内部V形折线表示信纸折叠。',
        },
        {
          name: '日历',
          path: 'M4 5 L20 5 L20 21 L4 21 Z M4 9 L20 9 M8 3 L8 7 M16 3 L16 7 M7 13 L9 13 M11 13 L13 13 M15 13 L17 13 M7 17 L9 17 M11 17 L13 17',
          filled: false,
          desc: '日历，顶部两个挂耳 + 主体 + 日期网格点。',
        },
        {
          name: '相机',
          path: 'M3 7 L7 7 L9 5 L15 5 L17 7 L21 7 L21 19 L3 19 Z M12 9 a4 4 0 1 0 0 8 a4 4 0 1 0 0 -8',
          filled: false,
          desc: '相机机身 + 镜头圆环，简洁的几何组合。',
        },
        {
          name: '云朵',
          path: 'M7 18 C4 18 3 16 3 14 C3 12 5 10 7 10 C7 7 10 5 13 6 C15 5 18 7 18 10 C20 10 21 12 21 14 C21 16 19 18 17 18 Z',
          filled: true,
          desc: '云朵由多个圆弧组合，贝塞尔曲线让边缘更柔和。',
        },
        {
          name: '音乐',
          path: 'M9 18 V5 L20 3 V16 M9 18 a2 2 0 1 1 -4 0 a2 2 0 1 1 4 0 M20 16 a2 2 0 1 1 -4 0 a2 2 0 1 1 4 0',
          filled: false,
          desc: '音符，两个符尾圆点 + 连接的符干和符横。',
        },
        {
          name: '书签',
          path: 'M6 3 L18 3 L18 21 L12 17 L6 21 Z',
          filled: true,
          desc: '书签形状，矩形顶部 + V形底部切角。',
        },
        {
          name: '聊天',
          path: 'M3 5 L21 5 L21 17 L13 17 L8 21 L8 17 L3 17 Z M7 9 L17 9 M7 13 L13 13',
          filled: false,
          desc: '对话气泡，圆角矩形 + 三角尾巴 + 内部三点。',
        },
        {
          name: '锁定',
          path: 'M6 10 L6 7 C6 4 8 2 12 2 C16 2 18 4 18 7 L18 10 M5 10 L19 10 L19 21 L5 21 Z M12 14 a1.5 1.5 0 0 0 0 3 a1.5 1.5 0 0 0 0 -3',
          filled: false,
          desc: '锁形，弧形锁梁 + 矩形锁体 + 钥匙孔。',
        },
        {
          name: '下载',
          path: 'M12 3 L12 15 M7 11 L12 16 L17 11 M4 19 L20 19',
          filled: false,
          desc: '下载箭头，垂直线 + 箭头头部 + 底部横线。',
        },
        {
          name: '位置',
          path: 'M12 2 C8 2 5 5 5 9 C5 14 12 22 12 22 C12 22 19 14 19 9 C19 5 16 2 12 2 Z M12 6 a3 3 0 1 0 0 6 a3 3 0 1 0 0 -6',
          filled: false,
          desc: '定位针，水滴形 + 内部圆孔，常用于地图标记。',
        },
        {
          name: '眼睛',
          path: 'M2 12 C5 7 8 5 12 5 C16 5 19 7 22 12 C19 17 16 19 12 19 C8 19 5 17 2 12 Z M12 8 a4 4 0 1 0 0 8 a4 4 0 1 0 0 -8',
          filled: false,
          desc: '眼睛，外眼形 + 内瞳孔圆。',
        },
      ];

      // Render icon gallery
      const grid = document.getElementById('iconGrid');
      icons.forEach((icon) => {
        const card = document.createElement('div');
        card.className = 'icon-card';
        card.innerHTML = `
    <svg viewBox="0 0 24 24">
      <path d="${icon.path}" fill="${icon.filled ? 'currentColor' : 'none'}" stroke="${icon.filled ? 'none' : 'currentColor'}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div class="name">${icon.name}</div>
    <div class="path-info">${icon.path.split(' ').length} 段路径</div>
  `;
        card.addEventListener('click', () => loadDemo(icon));
        grid.appendChild(card);
      });

      // Construction demo
      const demoControls = document.getElementById('demoControls');
      const gridLinesG = document.getElementById('gridLines');
      const iconDemo = document.getElementById('iconDemo');
      const iconTitle = document.getElementById('iconTitle');
      const iconDesc = document.getElementById('iconDesc');
      const pathData = document.getElementById('pathData');
      const fillToggle = document.getElementById('fillToggle');
      const gridToggle = document.getElementById('gridToggle');

      // Draw grid lines
      function drawGrid() {
        gridLinesG.innerHTML = '';
        if (!gridToggle.checked) return;
        for (let i = 0; i <= 24; i++) {
          const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
          line.setAttribute('x1', i);
          line.setAttribute('y1', 0);
          line.setAttribute('x2', i);
          line.setAttribute('y2', 24);
          line.setAttribute('class', i % 4 === 0 ? 'grid-line-major' : 'grid-line');
          gridLinesG.appendChild(line);
          const lineH = document.createElementNS('http://www.w3.org/2000/svg', 'line');
          lineH.setAttribute('x1', 0);
          lineH.setAttribute('y1', i);
          lineH.setAttribute('x2', 24);
          lineH.setAttribute('y2', i);
          lineH.setAttribute('class', i % 4 === 0 ? 'grid-line-major' : 'grid-line');
          gridLinesG.appendChild(lineH);
        }
      }

      // Demo controls - select first 8 icons as examples
      const demoIcons = icons.slice(0, 8);
      demoIcons.forEach((icon, idx) => {
        const btn = document.createElement('button');
        btn.textContent = icon.name;
        if (idx === 0) btn.classList.add('active');
        btn.addEventListener('click', () => {
          document.querySelectorAll('.control-row button').forEach((b) => b.classList.remove('active'));
          btn.classList.add('active');
          loadDemo(icon);
        });
        demoControls.appendChild(btn);
      });

      function loadDemo(icon) {
        iconTitle.textContent = `${icon.name} 图标`;
        iconDesc.textContent = icon.desc;
        pathData.textContent = icon.path;
        iconDemo.setAttribute('d', icon.path);
        iconDemo.classList.toggle('filled', icon.filled || fillToggle.checked);
        // Animate
        const len = iconDemo.getTotalLength ? iconDemo.getTotalLength() : 200;
        iconDemo.style.transition = 'none';
        iconDemo.style.strokeDasharray = len;
        iconDemo.style.strokeDashoffset = len;
        setTimeout(() => {
          iconDemo.style.transition = 'stroke-dashoffset 1.2s ease';
          iconDemo.style.strokeDashoffset = 0;
        }, 50);
      }

      fillToggle.addEventListener('change', () => {
        iconDemo.classList.toggle('filled', fillToggle.checked);
      });
      gridToggle.addEventListener('change', drawGrid);

      drawGrid();
      loadDemo(icons[0]);
    </script>
  </body>
</html>
