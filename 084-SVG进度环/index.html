<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SVG 进度环展示</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
        background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
        min-height: 100vh;
        color: #fff;
        padding: 40px 20px;
      }
      .container {
        max-width: 1100px;
        margin: 0 auto;
      }
      h1 {
        text-align: center;
        font-size: 2.4rem;
        margin-bottom: 8px;
        background: linear-gradient(90deg, #00f5a0, #00d9f5);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      .subtitle {
        text-align: center;
        color: #94a3b8;
        margin-bottom: 40px;
      }

      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: center;
        margin-bottom: 30px;
        background: rgba(255, 255, 255, 0.05);
        padding: 20px;
        border-radius: 14px;
      }
      .controls button {
        background: linear-gradient(135deg, #00f5a0, #00d9f5);
        color: #0f3460;
        border: none;
        padding: 10px 20px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: bold;
        font-size: 0.95rem;
        transition: all 0.2s;
        font-family: inherit;
      }
      .controls button:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(0, 245, 160, 0.3);
      }
      .controls .slider-group {
        display: flex;
        align-items: center;
        gap: 10px;
        background: rgba(0, 0, 0, 0.3);
        padding: 8px 16px;
        border-radius: 8px;
      }
      .controls input[type='range'] {
        width: 180px;
        accent-color: #00f5a0;
      }
      .controls label {
        font-size: 0.9rem;
        color: #cbd5e0;
      }
      .controls .val {
        color: #00f5a0;
        font-weight: bold;
        min-width: 40px;
      }

      .ring-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 24px;
      }
      .ring-card {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 18px;
        padding: 30px 20px 20px;
        text-align: center;
        transition: all 0.3s;
      }
      .ring-card:hover {
        background: rgba(255, 255, 255, 0.08);
        transform: translateY(-3px);
      }
      .ring-card svg {
        width: 220px;
        height: 220px;
      }
      .ring-card .title {
        margin-top: 12px;
        font-size: 1rem;
        color: #e2e8f0;
        font-weight: 600;
      }
      .ring-card .desc {
        font-size: 0.78rem;
        color: #94a3b8;
        margin-top: 4px;
      }

      .ring-text {
        fill: #fff;
        font-family: 'Microsoft YaHei', sans-serif;
        font-weight: 700;
      }
      .pct-input {
        background: rgba(0, 0, 0, 0.4);
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: #fff;
        padding: 6px 12px;
        border-radius: 6px;
        width: 70px;
        text-align: center;
        font-size: 0.95rem;
        margin-left: 10px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>SVG 进度环展示</h1>
      <p class="subtitle">多种风格的环形进度条 · 渐变 / 虚线 / 多环 · 实时控制百分比</p>

      <div class="controls">
        <button data-pct="0">0%</button>
        <button data-pct="25">25%</button>
        <button data-pct="50">50%</button>
        <button data-pct="75">75%</button>
        <button data-pct="100">100%</button>
        <div class="slider-group">
          <label>滑块：</label>
          <input type="range" id="slider" min="0" max="100" value="65" />
          <span class="val" id="sliderVal">65%</span>
        </div>
        <div class="slider-group">
          <label>手动：</label>
          <input type="number" class="pct-input" id="manualInput" min="0" max="100" value="65" />
        </div>
        <button id="animBtn">动画演示</button>
      </div>

      <div class="ring-grid">
        <!-- Ring 1: Simple gradient -->
        <div class="ring-card">
          <svg viewBox="0 0 200 200">
            <defs>
              <linearGradient id="r1g" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#00f5a0" />
                <stop offset="100%" stop-color="#00d9f5" />
              </linearGradient>
            </defs>
            <circle cx="100" cy="100" r="80" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="14" />
            <circle
              cx="100"
              cy="100"
              r="80"
              fill="none"
              stroke="url(#r1g)"
              stroke-width="14"
              stroke-linecap="round"
              id="ring1"
              transform="rotate(-90 100 100)"
              stroke-dasharray="502.4"
              stroke-dashoffset="502.4"
              style="transition: stroke-dashoffset 0.8s ease"
            />
            <text x="100" y="105" text-anchor="middle" class="ring-text" font-size="36" id="text1">0%</text>
          </svg>
          <div class="title">渐变进度环</div>
          <div class="desc">线性渐变描边</div>
        </div>

        <!-- Ring 2: Dashed -->
        <div class="ring-card">
          <svg viewBox="0 0 200 200">
            <circle
              cx="100"
              cy="100"
              r="80"
              fill="none"
              stroke="rgba(255,255,255,0.1)"
              stroke-width="10"
              stroke-dasharray="4 6"
            />
            <circle
              cx="100"
              cy="100"
              r="80"
              fill="none"
              stroke="#ff6b9d"
              stroke-width="10"
              stroke-linecap="round"
              id="ring2"
              transform="rotate(-90 100 100)"
              stroke-dasharray="4 6"
              stroke-dashoffset="502.4"
              style="transition: stroke-dashoffset 0.8s ease"
            />
            <text x="100" y="105" text-anchor="middle" class="ring-text" font-size="36" id="text2">0%</text>
          </svg>
          <div class="title">虚线进度环</div>
          <div class="desc">点状虚线描边</div>
        </div>

        <!-- Ring 3: Multi-ring -->
        <div class="ring-card">
          <svg viewBox="0 0 200 200">
            <defs>
              <linearGradient id="r3g1" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#f093fb" />
                <stop offset="100%" stop-color="#f5576c" />
              </linearGradient>
              <linearGradient id="r3g2" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#4facfe" />
                <stop offset="100%" stop-color="#00f2fe" />
              </linearGradient>
              <linearGradient id="r3g3" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#43e97b" />
                <stop offset="100%" stop-color="#38f9d7" />
              </linearGradient>
            </defs>
            <circle cx="100" cy="100" r="85" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="8" />
            <circle cx="100" cy="100" r="70" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="8" />
            <circle cx="100" cy="100" r="55" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="8" />
            <circle
              cx="100"
              cy="100"
              r="85"
              fill="none"
              stroke="url(#r3g1)"
              stroke-width="8"
              stroke-linecap="round"
              id="ring3a"
              transform="rotate(-90 100 100)"
              stroke-dasharray="534"
              stroke-dashoffset="534"
              style="transition: stroke-dashoffset 0.8s ease"
            />
            <circle
              cx="100"
              cy="100"
              r="70"
              fill="none"
              stroke="url(#r3g2)"
              stroke-width="8"
              stroke-linecap="round"
              id="ring3b"
              transform="rotate(-90 100 100)"
              stroke-dasharray="440"
              stroke-dashoffset="440"
              style="transition: stroke-dashoffset 0.8s ease"
            />
            <circle
              cx="100"
              cy="100"
              r="55"
              fill="none"
              stroke="url(#r3g3)"
              stroke-width="8"
              stroke-linecap="round"
              id="ring3c"
              transform="rotate(-90 100 100)"
              stroke-dasharray="346"
              stroke-dashoffset="346"
              style="transition: stroke-dashoffset 0.8s ease"
            />
            <text x="100" y="105" text-anchor="middle" class="ring-text" font-size="28" id="text3">0%</text>
          </svg>
          <div class="title">多层进度环</div>
          <div class="desc">三层嵌套环</div>
        </div>

        <!-- Ring 4: Half gauge -->
        <div class="ring-card">
          <svg viewBox="0 0 200 200">
            <defs>
              <linearGradient id="r4g" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#fa709a" />
                <stop offset="100%" stop-color="#fee140" />
              </linearGradient>
            </defs>
            <path
              d="M 30 130 A 70 70 0 0 1 170 130"
              fill="none"
              stroke="rgba(255,255,255,0.1)"
              stroke-width="14"
              stroke-linecap="round"
            />
            <path
              d="M 30 130 A 70 70 0 0 1 170 130"
              fill="none"
              stroke="url(#r4g)"
              stroke-width="14"
              stroke-linecap="round"
              id="ring4"
              stroke-dasharray="220"
              stroke-dashoffset="220"
              style="transition: stroke-dashoffset 0.8s ease"
            />
            <text x="100" y="120" text-anchor="middle" class="ring-text" font-size="36" id="text4">0%</text>
            <text x="100" y="150" text-anchor="middle" fill="#94a3b8" font-size="12">完成度</text>
          </svg>
          <div class="title">半圆仪表盘</div>
          <div class="desc">半弧形进度</div>
        </div>

        <!-- Ring 5: Glow ring -->
        <div class="ring-card">
          <svg viewBox="0 0 200 200">
            <defs>
              <filter id="glow">
                <feGaussianBlur stdDeviation="3" result="blur" />
                <feMerge>
                  <feMergeNode in="blur" />
                  <feMergeNode in="SourceGraphic" />
                </feMerge>
              </filter>
              <linearGradient id="r5g" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#ff0844" />
                <stop offset="100%" stop-color="#ffb199" />
              </linearGradient>
            </defs>
            <circle cx="100" cy="100" r="80" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="12" />
            <circle
              cx="100"
              cy="100"
              r="80"
              fill="none"
              stroke="url(#r5g)"
              stroke-width="12"
              stroke-linecap="round"
              id="ring5"
              transform="rotate(-90 100 100)"
              stroke-dasharray="502.4"
              stroke-dashoffset="502.4"
              filter="url(#glow)"
              style="transition: stroke-dashoffset 0.8s ease"
            />
            <text x="100" y="105" text-anchor="middle" class="ring-text" font-size="36" id="text5">0%</text>
          </svg>
          <div class="title">发光进度环</div>
          <div class="desc">带模糊滤镜光晕</div>
        </div>

        <!-- Ring 6: Rounded cap with marker -->
        <div class="ring-card">
          <svg viewBox="0 0 200 200">
            <defs>
              <linearGradient id="r6g" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#a8edea" />
                <stop offset="100%" stop-color="#fed6e3" />
              </linearGradient>
            </defs>
            <circle cx="100" cy="100" r="80" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="16" />
            <circle
              cx="100"
              cy="100"
              r="80"
              fill="none"
              stroke="url(#r6g)"
              stroke-width="16"
              stroke-linecap="round"
              id="ring6"
              transform="rotate(-90 100 100)"
              stroke-dasharray="502.4"
              stroke-dashoffset="502.4"
              style="transition: stroke-dashoffset 0.8s ease"
            />
            <circle
              cx="100"
              cy="20"
              r="8"
              fill="#fff"
              id="marker6"
              style="transform-origin: 100px 100px; transition: transform 0.8s ease"
            />
            <text x="100" y="105" text-anchor="middle" class="ring-text" font-size="36" fill="#0f3460" id="text6">
              0%
            </text>
          </svg>
          <div class="title">标记点进度环</div>
          <div class="desc">末端跟随标记点</div>
        </div>
      </div>
    </div>

    <script>
      const rings = [
        { id: 'ring1', text: 'text1', circumference: 502.4, marker: null },
        { id: 'ring2', text: 'text2', circumference: 502.4, marker: null },
        { id: 'ring3a', text: 'text3', circumference: 534, marker: null },
        { id: 'ring4', text: 'text4', circumference: 220, marker: null },
        { id: 'ring5', text: 'text5', circumference: 502.4, marker: null },
        { id: 'ring6', text: 'text6', circumference: 502.4, marker: 'marker6' },
      ];
      // ring3b and 3c are sub-rings
      const subRings = [
        { id: 'ring3b', circumference: 440, factor: 0.7 },
        { id: 'ring3c', circumference: 346, factor: 0.5 },
      ];

      function setProgress(pct) {
        pct = Math.max(0, Math.min(100, pct));
        rings.forEach((r) => {
          const offset = r.circumference * (1 - pct / 100);
          const el = document.getElementById(r.id);
          if (el) el.style.strokeDashoffset = offset;
          const txt = document.getElementById(r.text);
          if (txt) txt.textContent = Math.round(pct) + '%';
          if (r.marker) {
            const marker = document.getElementById(r.marker);
            if (marker) marker.style.transform = `rotate(${pct * 3.6}deg)`;
          }
        });
        // sub rings show different factors
        subRings.forEach((r) => {
          const sub = Math.min(100, pct / r.factor);
          const offset = r.circumference * (1 - sub / 100);
          const el = document.getElementById(r.id);
          if (el) el.style.strokeDashoffset = offset;
        });
        document.getElementById('sliderVal').textContent = Math.round(pct) + '%';
        document.getElementById('slider').value = pct;
        document.getElementById('manualInput').value = Math.round(pct);
      }

      // Button controls
      document.querySelectorAll('.controls button[data-pct]').forEach((btn) => {
        btn.addEventListener('click', () => setProgress(parseInt(btn.dataset.pct)));
      });

      document.getElementById('slider').addEventListener('input', (e) => {
        setProgress(parseInt(e.target.value));
      });

      document.getElementById('manualInput').addEventListener('input', (e) => {
        const v = parseInt(e.target.value);
        if (!isNaN(v)) setProgress(v);
      });

      document.getElementById('animBtn').addEventListener('click', () => {
        let current = 0;
        const interval = setInterval(() => {
          current += 2;
          if (current >= 100) {
            current = 100;
            clearInterval(interval);
            setTimeout(() => setProgress(0), 800);
          }
          setProgress(current);
        }, 30);
      });

      // Initial load animation
      setProgress(0);
      setTimeout(() => setProgress(65), 400);
    </script>
  </body>
</html>
