<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SVG 路径动画 - 描边绘制效果</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
        background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
        min-height: 100vh;
        color: #fff;
        padding: 30px 20px;
      }
      h1 {
        text-align: center;
        font-size: 36px;
        margin-bottom: 8px;
        background: linear-gradient(90deg, #ff6b6b, #feca57, #48dbfb, #ff9ff3);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .subtitle {
        text-align: center;
        color: #aaa;
        margin-bottom: 30px;
        font-size: 15px;
      }
      .gallery {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
        gap: 24px;
        max-width: 1200px;
        margin: 0 auto;
      }
      .card {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 16px;
        padding: 20px;
        backdrop-filter: blur(10px);
        transition:
          transform 0.3s,
          box-shadow 0.3s;
      }
      .card:hover {
        transform: translateY(-4px);
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
      }
      .card h3 {
        text-align: center;
        margin-bottom: 14px;
        font-size: 18px;
        color: #feca57;
      }
      .svg-wrap {
        background: rgba(0, 0, 0, 0.3);
        border-radius: 12px;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 16px;
        min-height: 280px;
      }
      svg {
        max-width: 100%;
        height: auto;
      }
      .draw-path {
        fill: none;
        stroke-width: 2.5;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 2000;
        stroke-dashoffset: 2000;
      }
      .draw-path.anim {
        animation: draw 4s ease-in-out forwards;
      }
      @keyframes draw {
        to {
          stroke-dashoffset: 0;
        }
      }
      .controls {
        display: flex;
        justify-content: center;
        gap: 12px;
        margin-top: 30px;
        flex-wrap: wrap;
      }
      button {
        background: linear-gradient(135deg, #ff6b6b, #ee5a6f);
        color: #fff;
        border: none;
        padding: 12px 28px;
        border-radius: 30px;
        font-size: 15px;
        cursor: pointer;
        font-family: inherit;
        transition:
          transform 0.2s,
          box-shadow 0.2s;
      }
      button:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(238, 90, 111, 0.5);
      }
      button.secondary {
        background: linear-gradient(135deg, #48dbfb, #0abde3);
      }
      button.secondary:hover {
        box-shadow: 0 6px 20px rgba(10, 189, 227, 0.5);
      }
      .fill-anim {
        opacity: 0;
      }
      .fill-anim.show {
        animation: fadeIn 1.5s ease forwards 3s;
      }
      @keyframes fadeIn {
        to {
          opacity: 1;
        }
      }
      .info {
        text-align: center;
        color: #888;
        margin-top: 16px;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <h1>SVG 路径绘制动画</h1>
    <p class="subtitle">使用 stroke-dashoffset 实现钢笔描边绘制效果 · 点击重播观看动画</p>

    <div class="gallery">
      <!-- 房子 -->
      <div class="card">
        <h3>房子</h3>
        <div class="svg-wrap">
          <svg viewBox="0 0 300 260" width="280">
            <defs>
              <linearGradient id="houseFill" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#ffeaa7" />
                <stop offset="1" stop-color="#fdcb6e" />
              </linearGradient>
            </defs>
            <!-- 屋顶 -->
            <path class="draw-path" stroke="#e17055" d="M40,140 L150,40 L260,140 Z" />
            <!-- 房身 -->
            <path class="draw-path" stroke="#0984e3" d="M60,140 L60,240 L240,240 L240,140" />
            <!-- 门 -->
            <path class="draw-path" stroke="#00b894" d="M130,240 L130,180 L170,180 L170,240" />
            <!-- 窗户 -->
            <path
              class="draw-path"
              stroke="#6c5ce7"
              d="M80,160 L80,200 L115,200 L115,160 Z M97,160 L97,200 M80,180 L115,180"
            />
            <path
              class="draw-path"
              stroke="#6c5ce7"
              d="M185,160 L185,200 L220,200 L220,160 Z M202,160 L202,200 M185,180 L220,180"
            />
            <!-- 烟囱 -->
            <path class="draw-path" stroke="#d63031" d="M200,90 L200,55 L225,55 L225,115" />
            <!-- 烟 -->
            <path class="draw-path" stroke="#b2bec3" d="M210,50 Q200,40 215,30 Q225,20 210,10" />
            <!-- 地面 -->
            <path class="draw-path" stroke="#00cec9" d="M20,240 L280,240" />
            <!-- 填充 -->
            <path
              class="fill-anim"
              fill="url(#houseFill)"
              stroke="none"
              d="M60,140 L60,240 L240,240 L240,140 L150,40 Z"
              opacity="0.4"
            />
          </svg>
        </div>
      </div>

      <!-- 树 -->
      <div class="card">
        <h3>大树</h3>
        <div class="svg-wrap">
          <svg viewBox="0 0 300 280" width="280">
            <defs>
              <radialGradient id="leafFill" cx="0.5" cy="0.5">
                <stop offset="0" stop-color="#55efc4" />
                <stop offset="1" stop-color="#00b894" />
              </radialGradient>
            </defs>
            <!-- 树干 -->
            <path
              class="draw-path"
              stroke="#8b6f47"
              stroke-width="4"
              d="M150,280 L150,160 M145,200 Q140,180 130,170 M155,210 Q165,190 175,180"
            />
            <!-- 树冠层 -->
            <path
              class="draw-path"
              stroke="#00b894"
              d="M150,30 Q90,40 90,100 Q60,110 70,150 Q40,160 60,200 Q90,210 130,200 Q150,220 180,200 Q220,210 250,180 Q270,150 240,130 Q260,90 220,80 Q210,40 150,30 Z"
            />
            <!-- 果实 -->
            <path class="draw-path" stroke="#e17055" d="M110,120 a8,8 0 1,0 16,0 a8,8 0 1,0 -16,0" />
            <path class="draw-path" stroke="#e17055" d="M190,140 a8,8 0 1,0 16,0 a8,8 0 1,0 -16,0" />
            <path class="draw-path" stroke="#e17055" d="M170,90 a8,8 0 1,0 16,0 a8,8 0 1,0 -16,0" />
            <path
              class="fill-anim"
              fill="url(#leafFill)"
              stroke="none"
              d="M150,30 Q90,40 90,100 Q60,110 70,150 Q40,160 60,200 Q90,210 130,200 Q150,220 180,200 Q220,210 250,180 Q270,150 240,130 Q260,90 220,80 Q210,40 150,30 Z"
              opacity="0.4"
            />
          </svg>
        </div>
      </div>

      <!-- 几何花纹 -->
      <div class="card">
        <h3>几何花纹</h3>
        <div class="svg-wrap">
          <svg viewBox="0 0 300 280" width="280">
            <!-- 外圆 -->
            <path class="draw-path" stroke="#ff6b6b" d="M150,30 a120,120 0 1,0 0.1,0" />
            <!-- 六角星 -->
            <path class="draw-path" stroke="#feca57" d="M150,60 L185,150 L150,240 L115,150 Z" />
            <path class="draw-path" stroke="#feca57" d="M60,150 L150,115 L240,150 L150,185 Z" />
            <!-- 内圆 -->
            <path class="draw-path" stroke="#48dbfb" d="M150,110 a40,40 0 1,0 0.1,0" />
            <!-- 花瓣 -->
            <path class="draw-path" stroke="#ff9ff3" d="M150,110 Q130,90 150,70 Q170,90 150,110" />
            <path class="draw-path" stroke="#ff9ff3" d="M150,190 Q130,210 150,230 Q170,210 150,190" />
            <path class="draw-path" stroke="#ff9ff3" d="M110,150 Q90,130 70,150 Q90,170 110,150" />
            <path class="draw-path" stroke="#ff9ff3" d="M190,150 Q210,130 230,150 Q210,170 190,150" />
            <!-- 中心点装饰 -->
            <path class="draw-path" stroke="#5f27cd" d="M150,135 a15,15 0 1,0 0.1,0" />
          </svg>
        </div>
      </div>

      <!-- 花朵 -->
      <div class="card">
        <h3>花朵</h3>
        <div class="svg-wrap">
          <svg viewBox="0 0 300 280" width="280">
            <!-- 茎 -->
            <path class="draw-path" stroke="#00b894" stroke-width="3" d="M150,280 Q145,220 150,160" />
            <!-- 叶子 -->
            <path class="draw-path" stroke="#00cec9" d="M150,230 Q110,210 100,240 Q130,250 150,235" />
            <path class="draw-path" stroke="#00cec9" d="M150,200 Q190,180 200,210 Q170,220 150,205" />
            <!-- 花瓣 5 片 -->
            <path class="draw-path" stroke="#ff6b6b" d="M150,160 Q120,120 150,80 Q180,120 150,160" />
            <path class="draw-path" stroke="#feca57" d="M150,160 Q190,140 220,100 Q180,90 150,160" />
            <path class="draw-path" stroke="#48dbfb" d="M150,160 Q190,180 230,170 Q200,140 150,160" />
            <path class="draw-path" stroke="#ff9ff3" d="M150,160 Q110,180 70,170 Q100,140 150,160" />
            <path class="draw-path" stroke="#a55eea" d="M150,160 Q110,140 80,100 Q120,90 150,160" />
            <!-- 花心 -->
            <path class="draw-path" stroke="#fdcb6e" d="M150,150 a12,12 0 1,0 0.1,0" />
          </svg>
        </div>
      </div>

      <!-- 城市天际线 -->
      <div class="card">
        <h3>城市天际线</h3>
        <div class="svg-wrap">
          <svg viewBox="0 0 300 280" width="280">
            <!-- 月亮 -->
            <path class="draw-path" stroke="#feca57" d="M240,50 a25,25 0 1,0 0.1,0" />
            <!-- 星星 -->
            <path
              class="draw-path"
              stroke="#fff"
              d="M60,40 L62,46 L68,46 L63,50 L65,56 L60,52 L55,56 L57,50 L52,46 L58,46 Z"
            />
            <path
              class="draw-path"
              stroke="#fff"
              d="M100,30 L101,33 L104,33 L102,35 L103,38 L100,36 L97,38 L98,35 L96,33 L99,33 Z"
            />
            <!-- 建筑物 -->
            <path class="draw-path" stroke="#a55eea" d="M20,240 L20,150 L60,150 L60,120 L100,120 L100,240" />
            <path class="draw-path" stroke="#48dbfb" d="M100,240 L100,80 L150,80 L150,240" />
            <path class="draw-path" stroke="#ff6b6b" d="M150,240 L150,160 L180,160 L180,140 L210,140 L210,240" />
            <path class="draw-path" stroke="#feca57" d="M210,240 L210,100 L260,100 L260,240" />
            <!-- 地面 -->
            <path class="draw-path" stroke="#74b9ff" d="M0,240 L300,240" />
            <!-- 窗户 -->
            <path
              class="draw-path"
              stroke="#fdcb6e"
              d="M30,165 L40,165 L40,175 L30,175 Z M70,135 L80,135 L80,145 L70,145 Z M115,100 L125,100 L125,110 L115,110 Z M160,180 L170,180 L170,190 L160,190 Z M220,120 L230,120 L230,130 L220,130 Z"
            />
          </svg>
        </div>
      </div>

      <!-- 纸飞机 -->
      <div class="card">
        <h3>纸飞机</h3>
        <div class="svg-wrap">
          <svg viewBox="0 0 300 280" width="280">
            <!-- 飞机主体 -->
            <path class="draw-path" stroke="#74b9ff" stroke-width="2.5" d="M30,250 L270,30 L160,90 L30,250 Z" />
            <!-- 折叠线 -->
            <path class="draw-path" stroke="#0984e3" d="M270,30 L160,90 L110,160" />
            <path class="draw-path" stroke="#0984e3" d="M160,90 L120,70" />
            <!-- 飞行轨迹 -->
            <path
              class="draw-path"
              stroke="#dfe6e9"
              stroke-dasharray="6 4"
              d="M50,260 Q100,200 80,140 Q60,80 140,60 Q220,40 280,50"
            />
            <!-- 云朵 -->
            <path
              class="draw-path"
              stroke="#b2bec3"
              d="M40,80 Q30,70 40,60 Q50,50 65,55 Q80,45 90,60 Q100,65 90,80 Q80,90 65,85 Q50,90 40,80 Z"
            />
            <path
              class="draw-path"
              stroke="#b2bec3"
              d="M200,200 Q190,190 200,180 Q215,170 225,180 Q240,170 245,185 Q255,195 240,205 Q225,215 210,205 Q200,210 200,200 Z"
            />
          </svg>
        </div>
      </div>
    </div>

    <div class="controls">
      <button onclick="replay()">重播动画</button>
      <button class="secondary" onclick="toggleFill()">显示/隐藏填充</button>
    </div>
    <p class="info">技术原理：通过 stroke-dasharray 设置虚线长度，stroke-dashoffset 从总长偏移到 0，实现描边绘制效果</p>

    <script>
      /* exported toggleFill */
      function replay() {
        document.querySelectorAll('.draw-path').forEach(function (p) {
          p.classList.remove('anim');
          void p.offsetWidth; // 触发回流
          p.classList.add('anim');
        });
      }
      function toggleFill() {
        document.querySelectorAll('.fill-anim').forEach(function (f) {
          f.classList.toggle('show');
        });
      }
      // 初始化
      window.addEventListener('load', function () {
        setTimeout(replay, 300);
      });
    </script>
  </body>
</html>
