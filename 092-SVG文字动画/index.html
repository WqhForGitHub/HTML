<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SVG 文字动画 - 创意文字效果</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
        background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
        min-height: 100vh;
        color: #fff;
        padding: 30px 20px;
      }
      h1 {
        text-align: center;
        font-size: 36px;
        margin-bottom: 8px;
        background: linear-gradient(90deg, #f72585, #b5179e, #7209b7, #3a0ca3);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .subtitle {
        text-align: center;
        color: #aaa;
        margin-bottom: 30px;
        font-size: 15px;
      }
      .gallery {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
        gap: 24px;
        max-width: 1200px;
        margin: 0 auto;
      }
      .card {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 16px;
        padding: 24px;
        backdrop-filter: blur(10px);
        transition: transform 0.3s;
      }
      .card:hover {
        transform: translateY(-4px);
      }
      .card h3 {
        color: #f72585;
        margin-bottom: 16px;
        font-size: 17px;
        text-align: center;
      }
      .svg-wrap {
        background: rgba(0, 0, 0, 0.3);
        border-radius: 12px;
        padding: 20px;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 200px;
      }
      svg {
        width: 100%;
        height: auto;
      }
      .controls {
        display: flex;
        justify-content: center;
        margin-top: 28px;
        gap: 12px;
      }
      button {
        background: linear-gradient(135deg, #f72585, #7209b7);
        color: #fff;
        border: none;
        padding: 12px 28px;
        border-radius: 30px;
        font-size: 15px;
        cursor: pointer;
        font-family: inherit;
        transition: transform 0.2s;
      }
      button:hover {
        transform: translateY(-2px);
      }
      .info {
        text-align: center;
        color: #888;
        margin-top: 14px;
        font-size: 13px;
      }

      /* 描边绘制文字 */
      .draw-text {
        fill: transparent;
        stroke: #4cc9f0;
        stroke-width: 1.5;
        stroke-dasharray: 800;
        stroke-dashoffset: 800;
        font-size: 70px;
        font-weight: 900;
      }
      .draw-text.anim {
        animation: drawText 3s ease forwards;
      }
      @keyframes drawText {
        to {
          stroke-dashoffset: 0;
        }
      }

      /* 渐变文字 */
      @keyframes gradMove {
        to {
          stop-color: #f72585;
        }
      }

      /* 逐字显现 */
      .reveal-char {
        opacity: 0;
        transform-origin: center;
      }
      .reveal-char.anim {
        animation: reveal 0.5s ease forwards;
      }
      @keyframes reveal {
        from {
          opacity: 0;
          transform: translateY(20px) scale(0.5);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      /* 变形文字 */
      .morph-text {
        font-size: 60px;
        font-weight: 900;
      }
    </style>
  </head>
  <body>
    <h1>SVG 文字动画集</h1>
    <p class="subtitle">描边绘制 · 路径文字 · 渐变流动 · 逐字显现 · 变形动画</p>

    <div class="gallery">
      <!-- 1. 描边绘制文字 -->
      <div class="card">
        <h3>描边绘制 (Stroke Draw)</h3>
        <div class="svg-wrap">
          <svg viewBox="0 0 400 160">
            <text class="draw-text" x="200" y="110" text-anchor="middle">创意无限</text>
          </svg>
        </div>
      </div>

      <!-- 2. 路径文字 -->
      <div class="card">
        <h3>路径文字 (Text on Path)</h3>
        <div class="svg-wrap">
          <svg viewBox="0 0 400 200">
            <defs>
              <path id="curve1" d="M50,150 Q200,30 350,150" />
              <path id="curve2" d="M50,80 Q200,200 350,80" />
            </defs>
            <path
              d="M50,150 Q200,30 350,150"
              fill="none"
              stroke="rgba(76,201,240,0.3)"
              stroke-width="1"
              stroke-dasharray="4 4"
            />
            <text font-size="28" font-weight="700" fill="#4cc9f0">
              <textPath href="#curve1" startOffset="0">★ SVG 路径文字沿着曲线排列 ★</textPath>
            </text>
            <text font-size="22" font-weight="700" fill="#f72585">
              <textPath href="#curve2" startOffset="0">
                HTML5 · CSS3 · JavaScript · 创意设计
              </textPath>
            </text>
          </svg>
        </div>
      </div>

      <!-- 3. 渐变流动文字 -->
      <div class="card">
        <h3>渐变流动 (Animated Gradient)</h3>
        <div class="svg-wrap">
          <svg viewBox="0 0 400 160">
            <defs>
              <linearGradient id="gradText" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0" stop-color="#f72585">
                  <animate
                    attributeName="stop-color"
                    values="#f72585;#7209b7;#3a0ca3;#4cc9f0;#f72585"
                    dur="6s"
                    repeatCount="indefinite"
                  />
                </stop>
                <stop offset="0.5" stop-color="#7209b7">
                  <animate
                    attributeName="stop-color"
                    values="#7209b7;#3a0ca3;#4cc9f0;#f72585;#7209b7"
                    dur="6s"
                    repeatCount="indefinite"
                  />
                </stop>
                <stop offset="1" stop-color="#4cc9f0">
                  <animate
                    attributeName="stop-color"
                    values="#4cc9f0;#f72585;#7209b7;#3a0ca3;#4cc9f0"
                    dur="6s"
                    repeatCount="indefinite"
                  />
                </stop>
              </linearGradient>
            </defs>
            <text
              x="200"
              y="105"
              text-anchor="middle"
              font-size="68"
              font-weight="900"
              fill="url(#gradText)"
            >
              流动渐变
            </text>
          </svg>
        </div>
      </div>

      <!-- 4. 逐字显现 -->
      <div class="card">
        <h3>逐字显现 (Letter Reveal)</h3>
        <div class="svg-wrap">
          <svg viewBox="0 0 400 160" id="revealSvg">
            <g font-size="60" font-weight="900" text-anchor="middle">
              <text class="reveal-char" x="80" y="105" fill="#4cc9f0">H</text>
              <text class="reveal-char" x="140" y="105" fill="#7209b7">T</text>
              <text class="reveal-char" x="200" y="105" fill="#f72585">M</text>
              <text class="reveal-char" x="260" y="105" fill="#4361ee">L</text>
              <text class="reveal-char" x="320" y="105" fill="#4cc9f0">5</text>
            </g>
          </svg>
        </div>
      </div>

      <!-- 5. 变形文字 -->
      <div class="card">
        <h3>变形文字 (Morph Text)</h3>
        <div class="svg-wrap">
          <svg viewBox="0 0 400 160">
            <defs>
              <filter id="blur1">
                <feGaussianBlur stdDeviation="3" />
              </filter>
            </defs>
            <text
              x="200"
              y="105"
              text-anchor="middle"
              font-size="64"
              font-weight="900"
              fill="#f72585"
            >
              变形
              <animate
                attributeName="font-size"
                values="64;80;64"
                dur="3s"
                repeatCount="indefinite"
              />
              <animate
                attributeName="fill"
                values="#f72585;#4cc9f0;#7209b7;#f72585"
                dur="4s"
                repeatCount="indefinite"
              />
              <animate
                attributeName="letter-spacing"
                values="0;10;0"
                dur="3s"
                repeatCount="indefinite"
              />
            </text>
            <text
              x="200"
              y="105"
              text-anchor="middle"
              font-size="64"
              font-weight="900"
              fill="#4cc9f0"
              filter="url(#blur1)"
              opacity="0.5"
            >
              变形
              <animate
                attributeName="font-size"
                values="64;80;64"
                dur="3s"
                repeatCount="indefinite"
              />
              <animate
                attributeName="letter-spacing"
                values="0;10;0"
                dur="3s"
                repeatCount="indefinite"
              />
            </text>
          </svg>
        </div>
      </div>

      <!-- 6. 环形文字 -->
      <div class="card">
        <h3>环形旋转文字 (Circular Text)</h3>
        <div class="svg-wrap">
          <svg viewBox="0 0 300 300">
            <defs>
              <path
                id="circle1"
                d="M 150,150 m -100,0 a 100,100 0 1,1 200,0 a 100,100 0 1,1 -200,0"
              />
            </defs>
            <g>
              <circle
                cx="150"
                cy="150"
                r="100"
                fill="none"
                stroke="rgba(76,201,240,0.2)"
                stroke-width="1"
              />
              <text font-size="22" font-weight="700" fill="#4cc9f0">
                <textPath href="#circle1">◆ SVG 环形文字 · 创意设计 · 动画展示 ·</textPath>
                <animateTransform
                  attributeName="transform"
                  type="rotate"
                  from="0 150 150"
                  to="360 150 150"
                  dur="20s"
                  repeatCount="indefinite"
                />
              </text>
              <circle cx="150" cy="150" r="40" fill="none" stroke="#f72585" stroke-width="2">
                <animate attributeName="r" values="40;50;40" dur="3s" repeatCount="indefinite" />
              </circle>
              <text
                x="150"
                y="158"
                text-anchor="middle"
                font-size="20"
                font-weight="900"
                fill="#f72585"
              >
                SVG
              </text>
            </g>
          </svg>
        </div>
      </div>
    </div>

    <div class="controls">
      <button onclick="replayAll()">重播动画</button>
    </div>
    <p class="info">
      利用 SVG &lt;text&gt;、&lt;textPath&gt;、stroke-dashoffset、SMIL animate 实现多种文字动效
    </p>

    <script>
      /* exported replayAll */
      function replayAll() {
        // 描边绘制
        document.querySelectorAll('.draw-text').forEach(function (t) {
          t.classList.remove('anim');
          void t.offsetWidth;
          t.classList.add('anim');
        });
        // 逐字显现
        const chars = document.querySelectorAll('.reveal-char');
        chars.forEach(function (c) {
          c.classList.remove('anim');
        });
        chars.forEach(function (c, i) {
          setTimeout(function () {
            c.classList.add('anim');
            c.style.animationDelay = '0s';
          }, i * 200);
        });
      }
      window.addEventListener('load', function () {
        setTimeout(function () {
          document.querySelectorAll('.draw-text').forEach(function (t) {
            t.classList.add('anim');
          });
          const chars = document.querySelectorAll('.reveal-char');
          chars.forEach(function (c, i) {
            setTimeout(
              function () {
                c.classList.add('anim');
              },
              500 + i * 200
            );
          });
        }, 300);
      });
    </script>
  </body>
</html>
