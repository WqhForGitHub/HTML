<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SVG 波浪文字 - 跳动波浪效果</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
        background: linear-gradient(180deg, #0a0e27, #1a1a4e, #2d1b69);
        min-height: 100vh;
        color: #fff;
        padding: 30px 20px;
        overflow-x: hidden;
      }
      h1 {
        text-align: center;
        font-size: 36px;
        margin-bottom: 8px;
        background: linear-gradient(90deg, #00f5d4, #00bbf9, #9b5de5, #f15bb5);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .subtitle {
        text-align: center;
        color: #aaa;
        margin-bottom: 30px;
        font-size: 15px;
      }
      .gallery {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
        gap: 24px;
        max-width: 1200px;
        margin: 0 auto;
      }
      .card {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 16px;
        padding: 24px;
        backdrop-filter: blur(10px);
        transition: transform 0.3s;
      }
      .card:hover {
        transform: translateY(-4px);
      }
      .card h3 {
        color: #00f5d4;
        margin-bottom: 14px;
        font-size: 17px;
        text-align: center;
      }
      .svg-wrap {
        background: rgba(0, 0, 0, 0.35);
        border-radius: 12px;
        padding: 20px;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 180px;
        overflow: hidden;
      }
      svg {
        width: 100%;
        height: auto;
      }
      .controls {
        display: flex;
        justify-content: center;
        gap: 12px;
        margin-top: 28px;
        flex-wrap: wrap;
      }
      button {
        background: linear-gradient(135deg, #00f5d4, #00bbf9);
        color: #0a0e27;
        border: none;
        padding: 12px 28px;
        border-radius: 30px;
        font-size: 15px;
        cursor: pointer;
        font-family: inherit;
        font-weight: 700;
        transition: transform 0.2s;
      }
      button:hover {
        transform: translateY(-2px);
      }
      .info {
        text-align: center;
        color: #888;
        margin-top: 14px;
        font-size: 13px;
      }

      .wave-letter {
        display: inline-block;
      }
    </style>
  </head>
  <body>
    <h1>SVG 波浪文字</h1>
    <p class="subtitle">正弦波动 · 海浪路径 · 彩虹波浪 · 弹跳字符 · 多种波浪文字动效</p>

    <div class="gallery">
      <!-- 1. 正弦波浪字符 -->
      <div class="card">
        <h3>正弦波浪字符 (Sine Wave)</h3>
        <div class="svg-wrap">
          <svg viewBox="0 0 400 180" id="sineWave">
            <g font-size="42" font-weight="900" text-anchor="middle" fill="#00f5d4">
              <!-- 字符由 JS 注入 -->
            </g>
          </svg>
        </div>
      </div>

      <!-- 2. 海浪路径文字 -->
      <div class="card">
        <h3>海浪路径文字 (Ocean Wave Path)</h3>
        <div class="svg-wrap">
          <svg viewBox="0 0 400 200">
            <defs>
              <path id="wave1" d="M0,100 Q50,60 100,100 T200,100 T300,100 T400,100" />
              <path id="wave2" d="M0,130 Q50,90 100,130 T200,130 T300,130 T400,130" />
              <linearGradient id="oceanGrad" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0" stop-color="#00f5d4" />
                <stop offset="0.5" stop-color="#00bbf9" />
                <stop offset="1" stop-color="#9b5de5" />
              </linearGradient>
            </defs>
            <!-- 海浪 -->
            <path
              d="M0,100 Q50,60 100,100 T200,100 T300,100 T400,100"
              fill="none"
              stroke="url(#oceanGrad)"
              stroke-width="2"
              opacity="0.5"
            >
              <animate
                attributeName="d"
                values="M0,100 Q50,60 100,100 T200,100 T300,100 T400,100;
                      M0,100 Q50,140 100,100 T200,100 T300,100 T400,100;
                      M0,100 Q50,60 100,100 T200,100 T300,100 T400,100"
                dur="4s"
                repeatCount="indefinite"
              />
            </path>
            <text font-size="26" font-weight="700" fill="url(#oceanGrad)">
              <textPath href="#wave1" startOffset="0">
                <animate
                  attributeName="startOffset"
                  values="0;50;0"
                  dur="8s"
                  repeatCount="indefinite"
                />
                海浪 ~ 波涛 ~ 汹涌 ~ 澎湃 ~ 浪花 ~ 海浪 ~ 波涛 ~ 汹涌 ~
              </textPath>
            </text>
            <text font-size="20" font-weight="700" fill="#9b5de5" opacity="0.7">
              <textPath href="#wave2" startOffset="20">
                <animate
                  attributeName="startOffset"
                  values="20;70;20"
                  dur="10s"
                  repeatCount="indefinite"
                />
                Ocean Wave ~ Surf ~ Tide ~ Ripple ~ Ocean Wave ~ Surf ~
              </textPath>
            </text>
          </svg>
        </div>
      </div>

      <!-- 3. 彩虹波浪 -->
      <div class="card">
        <h3>彩虹波浪 (Rainbow Wave)</h3>
        <div class="svg-wrap">
          <svg viewBox="0 0 400 180" id="rainbowWave">
            <g font-size="44" font-weight="900" text-anchor="middle">
              <!-- JS 注入 -->
            </g>
          </svg>
        </div>
      </div>

      <!-- 4. 弹跳字符 -->
      <div class="card">
        <h3>弹跳字符 (Bounce Letters)</h3>
        <div class="svg-wrap">
          <svg viewBox="0 0 400 180" id="bounceWave">
            <g font-size="40" font-weight="900" text-anchor="middle" fill="#f15bb5">
              <!-- JS 注入 -->
            </g>
          </svg>
        </div>
      </div>

      <!-- 5. 旋转波浪文字 -->
      <div class="card">
        <h3>螺旋波浪 (Spiral Wave)</h3>
        <div class="svg-wrap">
          <svg viewBox="0 0 300 200">
            <defs>
              <path id="spiral" d="M50,100 Q75,50 100,100 T150,100 T200,100 T250,100" />
            </defs>
            <path
              d="M50,100 Q75,50 100,100 T150,100 T200,100 T250,100"
              fill="none"
              stroke="rgba(155,93,229,0.3)"
              stroke-width="1"
              stroke-dasharray="3 3"
            />
            <text font-size="24" font-weight="700" fill="#fee440">
              <textPath href="#spiral" startOffset="0">
                <animate
                  attributeName="startOffset"
                  from="0"
                  to="100"
                  dur="6s"
                  repeatCount="indefinite"
                />
                ★ 螺旋 ★ 波浪 ★ 文字 ★ 动画 ★ 螺旋 ★ 波浪 ★
              </textPath>
            </text>
            <circle cx="50" cy="100" r="5" fill="#00f5d4">
              <animate attributeName="cx" values="50;250;50" dur="6s" repeatCount="indefinite" />
              <animate attributeName="cy" values="100;100;100" dur="6s" repeatCount="indefinite" />
            </circle>
          </svg>
        </div>
      </div>

      <!-- 6. 多层波浪 -->
      <div class="card">
        <h3>多层波浪 (Multi-Layer)</h3>
        <div class="svg-wrap">
          <svg viewBox="0 0 400 200" id="multiWave">
            <!-- JS 注入多层波浪 -->
          </svg>
        </div>
      </div>
    </div>

    <div class="controls">
      <button onclick="toggleSpeed()">切换速度</button>
      <button onclick="replay()">重播</button>
    </div>
    <p class="info">每个字符独立动画延迟，组合形成波浪起伏效果</p>

    <script>
      /* exported toggleSpeed, replay */
      let speedMul = 1;
      const speeds = [1, 1.8, 0.6];
      let speedIdx = 0;

      // 1. 正弦波浪字符
      function buildSineWave() {
        const g = document.querySelector('#sineWave g');
        g.innerHTML = '';
        const text = '波浪起伏';
        const cx = 200,
          spacing = 60,
          baseY = 90;
        for (let i = 0; i < text.length; i++) {
          const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
          t.setAttribute('x', cx - ((text.length - 1) * spacing) / 2 + i * spacing);
          t.setAttribute('y', baseY);
          t.textContent = text[i];
          t.innerHTML +=
            '<animate attributeName="y" values="' +
            baseY +
            ';' +
            (baseY - 30) +
            ';' +
            (baseY + 10) +
            ';' +
            baseY +
            '" dur="' +
            2 / speedMul +
            's" begin="' +
            i * 0.2 +
            's" repeatCount="indefinite"/><animate attributeName="fill" values="#00f5d4;#00bbf9;#9b5de5;#00f5d4" dur="' +
            4 / speedMul +
            's" begin="' +
            i * 0.2 +
            's" repeatCount="indefinite"/>';
          g.appendChild(t);
        }
      }

      // 3. 彩虹波浪
      function buildRainbowWave() {
        const g = document.querySelector('#rainbowWave g');
        g.innerHTML = '';
        const text = 'RAINBOW';
        const colors = [
          '#ff006e',
          '#fb5607',
          '#ffbe0b',
          '#8338ec',
          '#3a86ff',
          '#06ffa5',
          '#ff006e',
        ];
        const cx = 200,
          spacing = 45,
          baseY = 100;
        for (let i = 0; i < text.length; i++) {
          const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
          t.setAttribute('x', cx - ((text.length - 1) * spacing) / 2 + i * spacing);
          t.setAttribute('y', baseY);
          t.setAttribute('fill', colors[i % colors.length]);
          t.textContent = text[i];
          t.innerHTML +=
            '<animate attributeName="y" values="' +
            baseY +
            ';' +
            (baseY - 35) +
            ';' +
            baseY +
            '" dur="' +
            1.8 / speedMul +
            's" begin="' +
            i * 0.15 +
            's" repeatCount="indefinite"/><animateTransform attributeName="transform" type="rotate" values="0;' +
            (cx - ((text.length - 1) * spacing) / 2 + i * spacing) +
            ',' +
            baseY +
            ';15 ' +
            (cx - ((text.length - 1) * spacing) / 2 + i * spacing) +
            ',' +
            baseY +
            ';0 ' +
            (cx - ((text.length - 1) * spacing) / 2 + i * spacing) +
            ',' +
            baseY +
            '" dur="' +
            2.5 / speedMul +
            's" begin="' +
            i * 0.15 +
            's" repeatCount="indefinite"/>';
          g.appendChild(t);
        }
      }

      // 4. 弹跳字符
      function buildBounceWave() {
        const g = document.querySelector('#bounceWave g');
        g.innerHTML = '';
        const text = 'BOUNCE 弹跳';
        const cx = 200,
          spacing = 38,
          baseY = 110;
        for (let i = 0; i < text.length; i++) {
          const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
          const xpos = cx - ((text.length - 1) * spacing) / 2 + i * spacing;
          t.setAttribute('x', xpos);
          t.setAttribute('y', baseY);
          t.textContent = text[i] === ' ' ? '\u00A0' : text[i];
          t.innerHTML +=
            '<animate attributeName="y" values="' +
            baseY +
            ';' +
            (baseY - 40) +
            ';' +
            (baseY - 20) +
            ';' +
            baseY +
            '" keyTimes="0;0.4;0.6;1" dur="' +
            1.5 / speedMul +
            's" begin="' +
            i * 0.1 +
            's" repeatCount="indefinite"/><animate attributeName="fill" values="#f15bb5;#fee440;#00f5d4;#f15bb5" dur="' +
            3 / speedMul +
            's" begin="' +
            i * 0.1 +
            's" repeatCount="indefinite"/>';
          g.appendChild(t);
        }
      }

      // 6. 多层波浪
      function buildMultiWave() {
        const svg = document.getElementById('multiWave');
        svg.innerHTML = '';
        const layers = [
          { y: 60, color: '#00f5d4', text: '上层波浪 上层波浪 上层波浪', size: 18, dur: 5 },
          { y: 100, color: '#00bbf9', text: '中层波浪 中层波浪 中层波浪 中层', size: 20, dur: 6 },
          { y: 140, color: '#9b5de5', text: '下层波浪 下层波浪 下层波浪 下层', size: 18, dur: 7 },
        ];
        layers.forEach(function (L, idx) {
          const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
          path.setAttribute('id', 'mw' + idx);
          path.setAttribute(
            'd',
            'M0,' +
              L.y +
              ' Q50,' +
              (L.y - 30) +
              ' 100,' +
              L.y +
              ' T200,' +
              L.y +
              ' T300,' +
              L.y +
              ' T400,' +
              L.y
          );
          path.setAttribute('fill', 'none');
          path.setAttribute('stroke', L.color);
          path.setAttribute('stroke-width', '1');
          path.setAttribute('opacity', '0.3');
          path.setAttribute('stroke-dasharray', '3 3');
          svg.appendChild(path);
          const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
          text.setAttribute('font-size', L.size);
          text.setAttribute('font-weight', '700');
          text.setAttribute('fill', L.color);
          text.innerHTML =
            '<textPath href="#mw' +
            idx +
            '" startOffset="0"><animate attributeName="startOffset" from="0" to="80" dur="' +
            L.dur / speedMul +
            's" repeatCount="indefinite"/>' +
            L.text +
            '</textPath>';
          svg.appendChild(text);
        });
      }

      function buildAll() {
        buildSineWave();
        buildRainbowWave();
        buildBounceWave();
        buildMultiWave();
      }

      function toggleSpeed() {
        speedIdx = (speedIdx + 1) % speeds.length;
        speedMul = speeds[speedIdx];
        buildAll();
      }
      function replay() {
        buildAll();
      }

      window.addEventListener('load', function () {
        buildAll();
      });
    </script>
  </body>
</html>
