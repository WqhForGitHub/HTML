<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SVG 颜色渐变 - 渐变艺术画廊</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
        background: linear-gradient(135deg, #1a1a2e, #0f0f1e);
        min-height: 100vh;
        color: #fff;
        padding: 30px 20px;
      }
      h1 {
        text-align: center;
        font-size: 36px;
        margin-bottom: 8px;
        background: linear-gradient(90deg, #ff006e, #8338ec, #3a86ff, #06ffa5, #ffbe0b);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .subtitle {
        text-align: center;
        color: #aaa;
        margin-bottom: 30px;
        font-size: 15px;
      }
      .gallery {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 22px;
        max-width: 1200px;
        margin: 0 auto;
      }
      .card {
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 16px;
        padding: 18px;
        backdrop-filter: blur(10px);
        transition: transform 0.3s;
      }
      .card:hover {
        transform: translateY(-4px);
      }
      .card h3 {
        color: #06ffa5;
        margin-bottom: 12px;
        font-size: 16px;
        text-align: center;
      }
      .svg-wrap {
        background: rgba(0, 0, 0, 0.3);
        border-radius: 12px;
        padding: 14px;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 200px;
      }
      svg {
        width: 100%;
        height: auto;
        max-height: 240px;
      }
      .controls-panel {
        max-width: 1200px;
        margin: 30px auto 0;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 16px;
        padding: 24px;
      }
      .controls-panel h2 {
        color: #ffbe0b;
        margin-bottom: 16px;
        text-align: center;
        font-size: 20px;
      }
      .ctrl-row {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 14px;
        flex-wrap: wrap;
        justify-content: center;
      }
      .ctrl-row label {
        min-width: 100px;
        color: #ccc;
        font-size: 14px;
      }
      .ctrl-row input[type='range'] {
        width: 200px;
        accent-color: #06ffa5;
      }
      .ctrl-row input[type='color'] {
        width: 50px;
        height: 36px;
        border: none;
        border-radius: 8px;
        background: none;
        cursor: pointer;
      }
      .ctrl-row .val {
        color: #06ffa5;
        font-weight: bold;
        min-width: 50px;
      }
      .preview-svg {
        display: block;
        margin: 16px auto 0;
        max-width: 400px;
      }
      .info {
        text-align: center;
        color: #888;
        margin-top: 18px;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <h1>SVG 颜色渐变画廊</h1>
    <p class="subtitle">线性 · 径向 · 网格 · 锥形模拟 · 动画渐变 · 渐变文字与边框</p>

    <div class="gallery">
      <!-- 1. 线性渐变 -->
      <div class="card">
        <h3>线性渐变 (Linear)</h3>
        <div class="svg-wrap">
          <svg viewBox="0 0 240 200">
            <defs>
              <linearGradient id="lg1" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#ff006e" />
                <stop offset="0.5" stop-color="#8338ec" />
                <stop offset="1" stop-color="#3a86ff" />
              </linearGradient>
            </defs>
            <rect x="20" y="20" width="200" height="160" rx="14" fill="url(#lg1)" />
            <text x="120" y="110" text-anchor="middle" font-size="20" font-weight="bold" fill="#fff" opacity="0.9">
              线性渐变
            </text>
          </svg>
        </div>
      </div>

      <!-- 2. 径向渐变 -->
      <div class="card">
        <h3>径向渐变 (Radial)</h3>
        <div class="svg-wrap">
          <svg viewBox="0 0 240 200">
            <defs>
              <radialGradient id="rg1" cx="0.5" cy="0.5" r="0.7">
                <stop offset="0" stop-color="#ffbe0b" />
                <stop offset="0.5" stop-color="#fb5607" />
                <stop offset="1" stop-color="#ff006e" />
              </radialGradient>
            </defs>
            <circle cx="120" cy="100" r="85" fill="url(#rg1)" />
            <text x="120" y="108" text-anchor="middle" font-size="18" font-weight="bold" fill="#fff">径向渐变</text>
          </svg>
        </div>
      </div>

      <!-- 3. 动画渐变 -->
      <div class="card">
        <h3>动画渐变 (Animated)</h3>
        <div class="svg-wrap">
          <svg viewBox="0 0 240 200">
            <defs>
              <linearGradient id="ag1" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0" stop-color="#06ffa5">
                  <animate
                    attributeName="stop-color"
                    values="#06ffa5;#3a86ff;#8338ec;#ff006e;#06ffa5"
                    dur="6s"
                    repeatCount="indefinite"
                  />
                </stop>
                <stop offset="1" stop-color="#3a86ff">
                  <animate
                    attributeName="stop-color"
                    values="#3a86ff;#8338ec;#ff006e;#06ffa5;#3a86ff"
                    dur="6s"
                    repeatCount="indefinite"
                  />
                </stop>
              </linearGradient>
            </defs>
            <rect x="20" y="20" width="200" height="160" rx="14" fill="url(#ag1)" />
            <text x="120" y="108" text-anchor="middle" font-size="18" font-weight="bold" fill="#fff">动画渐变</text>
          </svg>
        </div>
      </div>

      <!-- 4. 移动停止点 -->
      <div class="card">
        <h3>移动停止点 (Moving Stops)</h3>
        <div class="svg-wrap">
          <svg viewBox="0 0 240 200">
            <defs>
              <linearGradient id="ms1" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0" stop-color="#ff006e" />
                <stop offset="0.5" stop-color="#ffbe0b">
                  <animate attributeName="offset" values="0.2;0.8;0.2" dur="5s" repeatCount="indefinite" />
                </stop>
                <stop offset="1" stop-color="#3a86ff" />
              </linearGradient>
            </defs>
            <rect x="20" y="20" width="200" height="160" rx="14" fill="url(#ms1)" />
            <text x="120" y="108" text-anchor="middle" font-size="18" font-weight="bold" fill="#fff">移动停止</text>
          </svg>
        </div>
      </div>

      <!-- 5. 网格渐变模拟 -->
      <div class="card">
        <h3>网格渐变模拟 (Mesh-like)</h3>
        <div class="svg-wrap">
          <svg viewBox="0 0 240 200">
            <defs>
              <radialGradient id="m1" cx="0.3" cy="0.3" r="0.5">
                <stop offset="0" stop-color="#ff006e" stop-opacity="0.9" />
                <stop offset="1" stop-color="#ff006e" stop-opacity="0" />
              </radialGradient>
              <radialGradient id="m2" cx="0.7" cy="0.3" r="0.5">
                <stop offset="0" stop-color="#3a86ff" stop-opacity="0.9" />
                <stop offset="1" stop-color="#3a86ff" stop-opacity="0" />
              </radialGradient>
              <radialGradient id="m3" cx="0.3" cy="0.7" r="0.5">
                <stop offset="0" stop-color="#06ffa5" stop-opacity="0.9" />
                <stop offset="1" stop-color="#06ffa5" stop-opacity="0" />
              </radialGradient>
              <radialGradient id="m4" cx="0.7" cy="0.7" r="0.5">
                <stop offset="0" stop-color="#ffbe0b" stop-opacity="0.9" />
                <stop offset="1" stop-color="#ffbe0b" stop-opacity="0" />
              </radialGradient>
            </defs>
            <rect x="20" y="20" width="200" height="160" rx="14" fill="#1a1a2e" />
            <rect x="20" y="20" width="200" height="160" rx="14" fill="url(#m1)" />
            <rect x="20" y="20" width="200" height="160" rx="14" fill="url(#m2)" />
            <rect x="20" y="20" width="200" height="160" rx="14" fill="url(#m3)" />
            <rect x="20" y="20" width="200" height="160" rx="14" fill="url(#m4)" />
            <text x="120" y="108" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">网格渐变</text>
          </svg>
        </div>
      </div>

      <!-- 6. 渐变文字 -->
      <div class="card">
        <h3>渐变文字 (Gradient Text)</h3>
        <div class="svg-wrap">
          <svg viewBox="0 0 240 200">
            <defs>
              <linearGradient id="gt1" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0" stop-color="#ff006e" />
                <stop offset="0.33" stop-color="#ffbe0b" />
                <stop offset="0.66" stop-color="#06ffa5" />
                <stop offset="1" stop-color="#3a86ff" />
              </linearGradient>
            </defs>
            <text x="120" y="90" text-anchor="middle" font-size="44" font-weight="900" fill="url(#gt1)">渐变</text>
            <text x="120" y="140" text-anchor="middle" font-size="32" font-weight="900" fill="url(#gt1)">文字艺术</text>
          </svg>
        </div>
      </div>

      <!-- 7. 渐变描边 -->
      <div class="card">
        <h3>渐变描边 (Gradient Stroke)</h3>
        <div class="svg-wrap">
          <svg viewBox="0 0 240 200">
            <defs>
              <linearGradient id="gs1" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#8338ec" />
                <stop offset="0.5" stop-color="#ff006e" />
                <stop offset="1" stop-color="#ffbe0b" />
              </linearGradient>
            </defs>
            <rect x="30" y="30" width="180" height="140" rx="20" fill="none" stroke="url(#gs1)" stroke-width="6" />
            <polygon points="120,55 145,100 120,145 95,100" fill="none" stroke="url(#gs1)" stroke-width="5" />
            <circle cx="120" cy="100" r="15" fill="none" stroke="url(#gs1)" stroke-width="4" />
          </svg>
        </div>
      </div>

      <!-- 8. 锥形模拟 -->
      <div class="card">
        <h3>锥形渐变模拟 (Conic-like)</h3>
        <div class="svg-wrap">
          <svg viewBox="0 0 240 200">
            <g transform="translate(120,100)">
              <path d="M 0,0 L 80,0 A 80,80 0 0,1 69,40 Z" fill="#ff006e" />
              <path d="M 0,0 L 69,40 A 80,80 0 0,1 40,69 Z" fill="#fb5607" />
              <path d="M 0,0 L 40,69 A 80,80 0 0,1 0,80 Z" fill="#ffbe0b" />
              <path d="M 0,0 L 0,80 A 80,80 0 0,1 -40,69 Z" fill="#06ffa5" />
              <path d="M 0,0 L -40,69 A 80,80 0 0,1 -69,40 Z" fill="#3a86ff" />
              <path d="M 0,0 L -69,40 A 80,80 0 0,1 -80,0 Z" fill="#8338ec" />
              <path d="M 0,0 L -80,0 A 80,80 0 0,1 -69,-40 Z" fill="#ff006e" />
              <path d="M 0,0 L -69,-40 A 80,80 0 0,1 -40,-69 Z" fill="#fb5607" />
              <path d="M 0,0 L -40,-69 A 80,80 0 0,1 0,-80 Z" fill="#ffbe0b" />
              <path d="M 0,0 L 0,-80 A 80,80 0 0,1 40,-69 Z" fill="#06ffa5" />
              <path d="M 0,0 L 40,-69 A 80,80 0 0,1 69,-40 Z" fill="#3a86ff" />
              <path d="M 0,0 L 69,-40 A 80,80 0 0,1 80,0 Z" fill="#8338ec" />
              <animateTransform
                attributeName="transform"
                type="rotate"
                from="0"
                to="360"
                dur="20s"
                repeatCount="indefinite"
                additive="sum"
              />
            </g>
          </svg>
        </div>
      </div>
    </div>

    <!-- 交互式控制面板 -->
    <div class="controls-panel">
      <h2>交互式渐变调节器</h2>
      <div class="ctrl-row">
        <label>角度:</label>
        <input type="range" id="angleCtrl" min="0" max="360" value="45" />
        <span class="val" id="angleVal">45°</span>
      </div>
      <div class="ctrl-row">
        <label>颜色 1:</label>
        <input type="color" id="color1" value="#ff006e" />
        <label>颜色 2:</label>
        <input type="color" id="color2" value="#3a86ff" />
        <label>颜色 3:</label>
        <input type="color" id="color3" value="#06ffa5" />
      </div>
      <div class="ctrl-row">
        <label>中间停止:</label>
        <input type="range" id="stopCtrl" min="10" max="90" value="50" />
        <span class="val" id="stopVal">50%</span>
      </div>
      <svg class="preview-svg" viewBox="0 0 400 160" id="previewSvg">
        <defs>
          <linearGradient id="previewGrad" x1="0" y1="0" x2="1" y2="0" gradientTransform="rotate(45)">
            <stop id="ps1" offset="0" stop-color="#ff006e" />
            <stop id="ps2" offset="0.5" stop-color="#3a86ff" />
            <stop id="ps3" offset="1" stop-color="#06ffa5" />
          </linearGradient>
        </defs>
        <rect x="10" y="10" width="380" height="140" rx="14" fill="url(#previewGrad)" />
        <text x="200" y="90" text-anchor="middle" font-size="28" font-weight="900" fill="#fff">实时预览</text>
      </svg>
    </div>
    <p class="info">拖动滑块和颜色选择器，实时调整渐变效果 · 支持 SVG linearGradient 的所有核心属性</p>

    <script>
      const angleCtrl = document.getElementById('angleCtrl');
      const angleVal = document.getElementById('angleVal');
      const color1 = document.getElementById('color1');
      const color2 = document.getElementById('color2');
      const color3 = document.getElementById('color3');
      const stopCtrl = document.getElementById('stopCtrl');
      const stopVal = document.getElementById('stopVal');
      const ps1 = document.getElementById('ps1');
      const ps2 = document.getElementById('ps2');
      const ps3 = document.getElementById('ps3');
      const previewGrad = document.getElementById('previewGrad');

      function updatePreview() {
        const angle = angleCtrl.value;
        angleVal.textContent = angle + '°';
        previewGrad.setAttribute('gradientTransform', 'rotate(' + angle + ')');
        ps1.setAttribute('stop-color', color1.value);
        ps2.setAttribute('stop-color', color2.value);
        ps3.setAttribute('stop-color', color3.value);
        const stop = stopCtrl.value;
        stopVal.textContent = stop + '%';
        ps2.setAttribute('offset', stop / 100);
      }
      [angleCtrl, color1, color2, color3, stopCtrl].forEach(function (el) {
        el.addEventListener('input', updatePreview);
      });
      updatePreview();
    </script>
  </body>
</html>
