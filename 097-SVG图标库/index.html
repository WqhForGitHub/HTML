<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SVG 图标库 - 矢量图标集合</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family:
          'Microsoft YaHei',
          'PingFang SC',
          -apple-system,
          sans-serif;
        background: #f5f7fa;
        min-height: 100vh;
        color: #2d3748;
      }
      .header {
        background: linear-gradient(135deg, #667eea, #764ba2);
        color: #fff;
        padding: 30px 20px;
        text-align: center;
        box-shadow: 0 4px 20px rgba(102, 126, 234, 0.3);
      }
      .header h1 {
        font-size: 32px;
        margin-bottom: 6px;
        letter-spacing: 2px;
      }
      .header p {
        opacity: 0.9;
        font-size: 15px;
      }
      .toolbar {
        max-width: 1200px;
        margin: 24px auto;
        padding: 0 20px;
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
      }
      .search-box {
        flex: 1;
        min-width: 240px;
        position: relative;
      }
      .search-box input {
        width: 100%;
        padding: 12px 16px 12px 44px;
        border: 2px solid #e2e8f0;
        border-radius: 30px;
        font-size: 15px;
        font-family: inherit;
        outline: none;
        transition:
          border 0.2s,
          box-shadow 0.2s;
        background: #fff;
      }
      .search-box input:focus {
        border-color: #667eea;
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
      }
      .search-box::before {
        content: '';
        position: absolute;
        left: 16px;
        top: 50%;
        transform: translateY(-50%);
        width: 18px;
        height: 18px;
        background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23a0aec0' stroke-width='2'><circle cx='11' cy='11' r='8'/><path d='m21 21-4.3-4.3'/></svg>")
          no-repeat center;
      }
      .filter-tabs {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .tab {
        background: #fff;
        border: 2px solid #e2e8f0;
        color: #4a5568;
        padding: 8px 18px;
        border-radius: 30px;
        cursor: pointer;
        font-family: inherit;
        font-size: 14px;
        transition: all 0.2s;
      }
      .tab:hover {
        border-color: #667eea;
        color: #667eea;
      }
      .tab.active {
        background: linear-gradient(135deg, #667eea, #764ba2);
        color: #fff;
        border-color: transparent;
      }
      .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 20px 40px;
      }
      .category {
        margin-bottom: 30px;
      }
      .category h2 {
        font-size: 20px;
        color: #2d3748;
        margin-bottom: 14px;
        padding-left: 12px;
        border-left: 4px solid #667eea;
      }
      .icon-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
        gap: 14px;
      }
      .icon-card {
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        padding: 16px 8px;
        text-align: center;
        cursor: pointer;
        transition: all 0.25s;
        position: relative;
        overflow: hidden;
      }
      .icon-card::before {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(135deg, rgba(102, 126, 234, 0.08), rgba(118, 75, 162, 0.08));
        opacity: 0;
        transition: opacity 0.25s;
      }
      .icon-card:hover {
        transform: translateY(-3px);
        border-color: #667eea;
        box-shadow: 0 8px 24px rgba(102, 126, 234, 0.2);
      }
      .icon-card:hover::before {
        opacity: 1;
      }
      .icon-card svg {
        width: 36px;
        height: 36px;
        display: block;
        margin: 0 auto 8px;
        position: relative;
        z-index: 1;
        transition: transform 0.25s;
      }
      .icon-card:hover svg {
        transform: scale(1.15);
      }
      .icon-card .icon-name {
        font-size: 12px;
        color: #4a5568;
        position: relative;
        z-index: 1;
      }
      .icon-card .copy-hint {
        position: absolute;
        bottom: -30px;
        left: 0;
        right: 0;
        background: #667eea;
        color: #fff;
        font-size: 11px;
        padding: 4px;
        transition: bottom 0.25s;
      }
      .icon-card.copied .copy-hint {
        bottom: 0;
      }
      .toast {
        position: fixed;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%) translateY(100px);
        background: linear-gradient(135deg, #667eea, #764ba2);
        color: #fff;
        padding: 12px 24px;
        border-radius: 30px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
        font-size: 14px;
        opacity: 0;
        transition: all 0.3s;
        z-index: 1000;
      }
      .toast.show {
        transform: translateX(-50%) translateY(0);
        opacity: 1;
      }
      .stats {
        text-align: center;
        color: #718096;
        font-size: 13px;
        margin-top: 30px;
      }
      .empty {
        text-align: center;
        color: #a0aec0;
        padding: 40px;
        font-size: 15px;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <h1>SVG 图标库</h1>
      <p>30+ 矢量图标 · 分类整理 · 点击复制 SVG 代码 · 即开即用</p>
    </div>

    <div class="toolbar">
      <div class="search-box">
        <input type="text" id="search" placeholder="搜索图标名称..." />
      </div>
      <div class="filter-tabs">
        <button class="tab active" data-cat="all">全部</button>
        <button class="tab" data-cat="通用">通用</button>
        <button class="tab" data-cat="箭头">箭头</button>
        <button class="tab" data-cat="媒体">媒体</button>
        <button class="tab" data-cat="通信">通信</button>
        <button class="tab" data-cat="文件">文件</button>
      </div>
    </div>

    <div class="container" id="container"></div>
    <div class="stats" id="stats"></div>

    <div class="toast" id="toast">已复制 SVG 代码到剪贴板</div>

          svg: '<path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/>',
        },
        {
          name: 'camera',
          cat: '媒体',
          label: '相机',
          svg: '<path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/>',

        },
        {
          name: 'trash',
          cat: '文件',
          label: '删除',
          svg: '<polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>',
        },
        {
          name: 'edit',
          cat: '文件',
          label: '编辑',
          svg: '<path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>',
        },
        {
          name: 'save',
          cat: '文件',
          label: '保存',
          svg: '<path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/>',
        },

      let currentCat = 'all';
      let searchTerm = '';

      function render() {
        const container = document.getElementById('container');
        const filtered = icons.filter(function (ic) {
          const catMatch = currentCat === 'all' || ic.cat === currentCat;
          const searchMatch =
            !searchTerm ||
            ic.label.toLowerCase().indexOf(searchTerm) >= 0 ||
            ic.name.toLowerCase().indexOf(searchTerm) >= 0;
          return catMatch && searchMatch;
        });

        if (filtered.length === 0) {
          container.innerHTML = '<div class="empty">未找到匹配的图标</div>';
          document.getElementById('stats').textContent = '显示 0 / ' + icons.length + ' 个图标';
          return;
        }

        // 按分类分组
        const cats = {};
        filtered.forEach(function (ic) {
          if (!cats[ic.cat]) cats[ic.cat] = [];
          cats[ic.cat].push(ic);
        });

        let html = '';
        Object.keys(cats).forEach(function (cat) {
          html +=
            '<div class="category"><h2>' +
            cat +
            ' (' +
            cats[cat].length +
            ')</h2><div class="icon-grid">';
          cats[cat].forEach(function (ic) {
            html +=
              '<div class="icon-card" data-name="' +
              ic.name +
              '" data-svg="' +
              encodeURIComponent(ic.svg) +
              '">' +
              '<svg viewBox="0 0 24 24" fill="none" stroke="#667eea" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
              ic.svg +
              '</svg>' +
              '<div class="icon-name">' +
              ic.label +
              '</div>' +
              '<div class="copy-hint">已复制</div>' +
              '</div>';
          });
          html += '</div></div>';
        });
        container.innerHTML = html;

        document.getElementById('stats').textContent =
          '显示 ' + filtered.length + ' / ' + icons.length + ' 个图标';

        // 绑定点击
        document.querySelectorAll('.icon-card').forEach(function (card) {
          card.addEventListener('click', function () {
            const svgInner = decodeURIComponent(card.getAttribute('data-svg'));
            const fullSvg =
              '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
              svgInner +
              '</svg>';
            copyToClipboard(fullSvg);
            card.classList.add('copied');
            setTimeout(function () {
              card.classList.remove('copied');
            }, 1000);
            showToast();
          });
        });
      }

      function copyToClipboard(text) {
        if (navigator.clipboard) {
          navigator.clipboard.writeText(text);
        } else {
          const ta = document.createElement('textarea');
          ta.value = text;
          document.body.appendChild(ta);
          ta.select();
          try {
            document.execCommand('copy');
          } catch (e) {
            // noop
          }
          document.body.removeChild(ta);
        }
      }

      function showToast() {
        const toast = document.getElementById('toast');
        toast.classList.add('show');
        clearTimeout(showToast._t);
        showToast._t = setTimeout(function () {
          toast.classList.remove('show');
        }, 1800);
      }

      document.querySelectorAll('.tab').forEach(function (t) {
        t.addEventListener('click', function () {
          document.querySelectorAll('.tab').forEach(function (x) {
            x.classList.remove('active');
          });
          t.classList.add('active');
          currentCat = t.dataset.cat;
          render();
        });
      });

      document.getElementById('search').addEventListener('input', function () {
        searchTerm = this.value.toLowerCase().trim();
        render();
      });

      render();
    </script>
  </body>
</html>
