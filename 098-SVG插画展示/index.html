<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SVG 插画展示 - 矢量艺术画廊</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
        background: linear-gradient(135deg, #1a1a2e, #16213e);
        min-height: 100vh;
        color: #fff;
        padding: 30px 20px;
      }
      h1 {
        text-align: center;
        font-size: 38px;
        margin-bottom: 8px;
        background: linear-gradient(90deg, #f9d423, #ff4e50, #f9d423);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .subtitle {
        text-align: center;
        color: #aaa;
        margin-bottom: 30px;
        font-size: 15px;
      }
      .gallery {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
        gap: 26px;
        max-width: 1200px;
        margin: 0 auto;
      }
      .art-card {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 18px;
        overflow: hidden;
        cursor: zoom-in;
        transition:
          transform 0.4s,
          box-shadow 0.4s;
        position: relative;
      }
      .art-card:hover {
        transform: translateY(-6px) scale(1.02);
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      }
      .art-frame {
        background: #fff;
        aspect-ratio: 4/3;
        overflow: hidden;
        position: relative;
      }
      .art-frame svg {
        width: 100%;
        height: 100%;
        display: block;
        transition: transform 0.5s;
      }
      .art-card:hover .art-frame svg {
        transform: scale(1.08);
      }
      .art-info {
        padding: 16px 18px;
        background: rgba(0, 0, 0, 0.3);
      }
      .art-info h3 {
        color: #f9d423;
        font-size: 17px;
        margin-bottom: 4px;
      }
      .art-info p {
        color: #aaa;
        font-size: 13px;
      }
      .art-tag {
        display: inline-block;
        background: rgba(249, 212, 35, 0.15);
        color: #f9d423;
        padding: 2px 10px;
        border-radius: 12px;
        font-size: 11px;
        margin-top: 6px;
      }
      .modal {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.85);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 100;
        padding: 20px;
        backdrop-filter: blur(8px);
      }
      .modal.show {
        display: flex;
      }
      .modal-content {
        background: #fff;
        border-radius: 16px;
        padding: 20px;
        max-width: 90vw;
        max-height: 90vh;
        overflow: auto;
        position: relative;
      }
      .modal-content svg {
        max-width: 80vw;
        max-height: 70vh;
        display: block;
      }
      .modal-close {
        position: absolute;
        top: 10px;
        right: 14px;
        background: #ff4e50;
        color: #fff;
        border: none;
        width: 36px;
        height: 36px;
        border-radius: 50%;
        cursor: pointer;
        font-size: 18px;
        font-weight: bold;
      }
      .modal-title {
        text-align: center;
        color: #333;
        margin-top: 10px;
        font-size: 18px;
      }
      .info {
        text-align: center;
        color: #888;
        margin-top: 26px;
        font-size: 13px;
      }
    </style>
  </head>
  <body>

    <!-- 模态框 -->
    <div class="modal" id="modal">
      <div class="modal-content">
        <button class="modal-close" onclick="closeModal()">×</button>
        <div id="modalSvg"></div>
        <p class="modal-title" id="modalTitle"></p>
      </div>
    </div>

    <script>
      document.querySelectorAll('.art-card').forEach(function (card) {
        card.addEventListener('click', function () {
          const svg = card.querySelector('svg').cloneNode(true);
          document.getElementById('modalSvg').innerHTML = '';
          document.getElementById('modalSvg').appendChild(svg);
          document.getElementById('modalTitle').textContent = card.querySelector('h3').textContent;
          document.getElementById('modal').classList.add('show');
        });
      });
      function closeModal() {
        document.getElementById('modal').classList.remove('show');
      }
      document.getElementById('modal').addEventListener('click', function (e) {
        if (e.target === this) closeModal();
      });
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') closeModal();
      });
    </script>
