<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>108-aside</title>
<style>
body { font-family: sans-serif; max-width: 720px; margin: 2rem auto; line-height: 1.6; }
main { float: left; width: 60%; }
aside { float: right; width: 35%; background: #f4f4f4; padding: 1rem; border-left: 4px solid #333; }
</style>
</head>
<body>
<h1>&lt;aside&gt; 元素</h1>
<main>
  <p>这是主内容。&lt;aside&gt; 用于表示放在主内容旁边的内容，如边栏或引用。</p>
  <p>常与 &lt;article&gt; 或页面主体配合使用，体现“侧边栏”的语义。</p>
</main>
<aside>
  <h3>边栏信息</h3>
  <p>这是一段旁白/相关引用，独立于主内容但提供补充信息。</p>
</aside>
</body>
</html>
