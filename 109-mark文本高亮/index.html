<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>109-mark</title>
    <style>
      body {
        font-family: sans-serif;
        max-width: 720px;
        margin: 2rem auto;
        line-height: 1.8;
      }
      mark {
        background: yellow;
        color: black;
        padding: 0 2px;
      }
    </style>
  </head>
  <body>
    <h1>&lt;mark&gt; 元素</h1>
    <p>
      &lt;mark&gt; 用于突出显示某些文本，就像用
      <mark>记号笔</mark>
      一样标记重点内容。
    </p>
    <p>
      比如在一篇文档中，
      <mark>需要读者特别注意的关键词</mark>
      会被高亮显示。
    </p>
  </body>
</html>
