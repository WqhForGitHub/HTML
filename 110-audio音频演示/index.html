<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>110-audio</title>
    <style>
      body {
        font-family: sans-serif;
        max-width: 720px;
        margin: 2rem auto;
        line-height: 1.6;
      }
      audio {
        width: 100%;
        margin-top: 1rem;
      }
    </style>
  </head>
  <body>
    <h1>&lt;audio&gt; 元素</h1>
    <p>&lt;audio&gt; 可以在页面中包含声音的内容，支持播放控件与多种格式回退。</p>
    <audio controls>
      <source src="sample.mp3" type="audio/mpeg" />
      你的浏览器不支持 audio 元素。
    </audio>
  </body>
</html>
