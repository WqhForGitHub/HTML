<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>111-time</title>
<style>
body { font-family: sans-serif; max-width: 720px; margin: 2rem auto; line-height: 1.6; }
time { background: #eef; padding: 0 4px; border-radius: 3px; }
</style>
</head>
<body>
<h1>&lt;time&gt; 元素</h1>
<p>&lt;time&gt; 表示一个时间、一个日期或日期时间（如 1 月 21 日凌晨 2 点）。</p>
<p>会议时间：<time datetime="2026-01-21T02:00">1 月 21 日凌晨 2 点</time></p>
<p>我的生日：<time datetime="1995-05-15">5 月 15 日</time></p>
<p>它让机器和搜索引擎能正确识别时间语义。</p>
</body>
</html>
