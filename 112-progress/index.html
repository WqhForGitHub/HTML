<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>112-progress</title>
<style>
body { font-family: sans-serif; max-width: 720px; margin: 2rem auto; line-height: 1.6; }
progress { width: 100%; height: 24px; }
</style>
</head>
<body>
<h1>&lt;progress&gt; 元素</h1>
<p>&lt;progress&gt; 用于显示任务的完成进度，例如完成了 90%。</p>
<label for="task">下载进度：</label>
<progress id="task" value="90" max="100">90%</progress>
<p>当前完成度：90%</p>
</body>
</html>
