<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>114-meter</title>
<style>
body { font-family: sans-serif; max-width: 720px; margin: 2rem auto; line-height: 1.6; }
meter { width: 100%; height: 24px; }
</style>
</head>
<body>
<h1>&lt;meter&gt; 元素</h1>
<p>&lt;meter&gt; 用于显示某个范围的度量。比如 0 到 212 度的温度计，显示现在外面是 90 度——啊，真热！</p>
<label for="temp">当前室外温度：</label>
<meter id="temp" value="90" min="0" max="212" low="60" high="180" optimum="70">90 度</meter>
<p>当前 90°F 🥵</p>
</body>
</html>
