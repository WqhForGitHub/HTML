<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>115-article</title>
<style>
body { font-family: sans-serif; max-width: 720px; margin: 2rem auto; line-height: 1.6; }
article { border: 1px solid #ddd; padding: 1rem 1.5rem; border-radius: 6px; }
article header h2 { margin-top: 0; }
</style>
</head>
<body>
<h1>&lt;article&gt; 元素</h1>
<p>&lt;article&gt; 用来标记类似新闻报道或博客帖子等独立的内容。</p>
<article>
  <header>
    <h2>我的第一篇博客</h2>
    <p>发布于 <time datetime="2026-08-01">8 月 1 日</time></p>
  </header>
  <p>这是一段独立的正文内容，可以单独被引用或订阅。</p>
  <footer><p>作者：小明</p></footer>
</article>
</body>
</html>
