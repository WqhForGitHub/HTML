<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>117-section</title>
    <style>
      body {
        font-family: sans-serif;
        max-width: 720px;
        margin: 2rem auto;
        line-height: 1.6;
      }
      section {
        border-left: 4px solid #333;
        padding: 0.5rem 1rem;
        margin: 1rem 0;
        background: #fafafa;
      }
    </style>
  </head>
  <body>
    <h1>&lt;section&gt; 元素</h1>
    <p>&lt;section&gt; 可以用于定义文档的主要区块，通常带标题。</p>
    <section>
      <h2>第一章：简介</h2>
      <p>这一节介绍主要内容。</p>
    </section>
    <section>
      <h2>第二章：正文</h2>
      <p>这一节是正文的详细说明。</p>
    </section>
  </body>
