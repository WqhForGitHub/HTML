<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>118-header</title>
    <style>
      body {
        font-family: sans-serif;
        max-width: 720px;
        margin: 2rem auto;
        line-height: 1.6;
      }
      header {
        border-bottom: 2px solid #333;
        padding-bottom: 1rem;
        margin-bottom: 1rem;
      }
      header h1 {
        margin: 0;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>我的站点</h1>
      <p>有首部的区块。&lt;header&gt; 通常包含标题、logo 或介绍性内容。</p>
    </header>
    <main>
      <p>这里是页面的主要正文。&lt;header&gt; 表示一个区块或整个页面的顶部区域。</p>
    </main>
  </body>
</html>
