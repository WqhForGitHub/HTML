<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>119-video</title>
<style>
body { font-family: sans-serif; max-width: 720px; margin: 2rem auto; line-height: 1.6; }
video { width: 100%; margin-top: 1rem; }
</style>
</head>
<body>
<h1>&lt;video&gt; 元素</h1>
<p>&lt;video&gt; 可以在页面中加入一个视频，支持播放控件与多种来源回退。</p>
<video controls poster="cover.jpg" width="480">
  <source src="movie.mp4" type="video/mp4">
  <source src="movie.webm" type="video/webm">
  你的浏览器不支持 video 元素。
</video>
</body>
</html>
