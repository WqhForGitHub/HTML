<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>120-nav</title>
<style>
body { font-family: sans-serif; max-width: 720px; margin: 2rem auto; line-height: 1.6; }
nav { background: #333; padding: 0.5rem 1rem; border-radius: 4px; }
nav a { color: #fff; margin-right: 1rem; text-decoration: none; }
nav a:hover { text-decoration: underline; }
</style>
</head>
<body>
<h1>&lt;nav&gt; 元素</h1>
<p>&lt;nav&gt; 使用这个元素把网站中用于导航的所有链接组织在一起。</p>
<nav>
  <a href="#">首页</a>
  <a href="#">文章</a>
  <a href="#">关于</a>
  <a href="#">联系</a>
</nav>
</body>
</html>
