<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>121-figure</title>
<style>
body { font-family: sans-serif; max-width: 720px; margin: 2rem auto; line-height: 1.6; }
figure { border: 1px solid #ddd; padding: 1rem; border-radius: 6px; display: inline-block; }
figcaption { color: #666; font-size: 0.9rem; text-align: center; margin-top: 0.5rem; }
</style>
</head>
<body>
<h1>&lt;figure&gt; 元素</h1>
<p>&lt;figure&gt; 用来定义类似照片、图表甚至代码清单等独立的内容，常配合 &lt;figcaption&gt; 说明。</p>
<figure>
  <img src="https://via.placeholder.com/320x180" alt="示例图片" width="320" height="180">
  <figcaption>图 1：一张占位示意图</figcaption>
</figure>
</body>
</html>
