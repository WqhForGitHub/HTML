<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>响应式布局 媒体查询</title>
    <style>
      :root {
        --bg: #0f172a;
        --card: rgba(255, 255, 255, 0.04);
        --border: rgba(255, 255, 255, 0.08);
        --text: #e2e8f0;
        --muted: #94a3b8;
        --accent: #06b6d4;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.6;
        padding: 20px 16px 40px;
      }
      h1 {
        font-size: 22px;
        text-align: center;
        margin-bottom: 6px;
      }
      .sub {
        text-align: center;
        color: var(--muted);
        font-size: 14px;
        margin-bottom: 8px;
      }
      .w {
        text-align: center;
        font-size: 13px;
        color: var(--accent);
        margin-bottom: 18px;
        font-family: monospace;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 14px;
        margin-bottom: 14px;
      }
      .card h2 {
        font-size: 15px;
        margin-bottom: 8px;
        color: var(--accent);
      }
      .code {
        font-family: monospace;
        background: rgba(0, 0, 0, 0.35);
        padding: 10px;
        border-radius: 8px;
        font-size: 12px;
        color: #67e8f9;
        white-space: pre-wrap;
        margin: 8px 0;
      }
      .cards {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
        gap: 10px;
      }
      .demo-card {
        background: linear-gradient(135deg, rgba(6, 182, 212, 0.25), rgba(99, 102, 241, 0.15));
        border: 1px solid rgba(6, 182, 212, 0.4);
        border-radius: 10px;
        padding: 18px 10px;
        text-align: center;
        transition: 0.3s;
      }
      .demo-card .n {
        font-size: 24px;
        font-weight: 800;
      }
      .demo-card .t {
        font-size: 12px;
        color: var(--muted);
        margin-top: 4px;
      }
      /* 媒体查询演示 */
      @media (max-width: 400px) {
        .cards {
          grid-template-columns: 1fr;
        }
        body {
          background: #1e1b4b;
        }
        .status::after {
          content: '小屏(≤400px)：单列布局';
        }
      }
      @media (min-width: 401px) and (max-width: 700px) {
        .cards {
          grid-template-columns: 1fr 1fr;
        }
        .status::after {
          content: '中屏(401-700px)：双列布局';
        }
      }
      @media (min-width: 701px) {
        .cards {
          grid-template-columns: repeat(4, 1fr);
        }
        .status::after {
          content: '大屏(>700px)：四列布局';
        }
      }
      .status {
        text-align: center;
        font-size: 14px;
        color: #fde68a;
        padding: 8px;
        background: rgba(6, 182, 212, 0.1);
        border-radius: 8px;
        margin-bottom: 14px;
      }
    </style>
  </head>
  <body>
    <h1>响应式布局与媒体查询</h1>
    <div class="sub">面试题 7 · 改变窗口宽度看效果</div>
    <div class="w">当前宽度：<span id="w">-</span>px</div>

    <div class="status"></div>

    <div class="card">
      <h2>媒体查询语法</h2>
      <div class="code">@media screen and (max-width: 768px) {
  /* 小屏样式 */
}
@media (min-width: 769px) and (max-width: 1024px) {
  /* 中屏样式 */
}</div>
    </div>

    <div class="cards">
      <div class="demo-card"><div class="n">1</div><div class="t">卡片</div></div>
      <div class="demo-card"><div class="n">2</div><div class="t">卡片</div></div>
      <div class="demo-card"><div class="n">3</div><div class="t">卡片</div></div>
      <div class="demo-card"><div class="n">4</div><div class="t">卡片</div></div>
    </div>

    <script>
      const wEl = document.getElementById('w');
      const upd = () => (wEl.textContent = window.innerWidth);
      upd();
      window.addEventListener('resize', upd);
    </script>
  </body>
</html>
