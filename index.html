<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML5 Demo 合集 · 100 个示例</title>
    <style>
      :root {
        --bg: #0f1117;
        --card: #1a1d29;
        --border: #2a2e3f;
        --text: #e4e6f0;
        --muted: #8b8fa8;
        --accent: #6c8cff;
        --accent2: #a855f7;
        --cat1: #6366f1;
        --cat2: #10b981;
        --cat3: #f59e0b;
        --cat4: #ec4899;
        --cat5: #06b6d4;
        --cat6: #8b5cf6;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: 'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.6;
      }
      /* Header */
      header {
        position: sticky;
        top: 0;
        z-index: 100;
        background: rgba(15, 17, 23, 0.92);
        backdrop-filter: blur(12px);
        border-bottom: 1px solid var(--border);
      }
      .header-inner {
        max-width: 1200px;
        margin: 0 auto;
        padding: 20px 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        flex-wrap: wrap;
      }
      .logo {
        font-size: 24px;
        font-weight: 800;
        background: linear-gradient(135deg, var(--accent), var(--accent2));
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .logo span {
        color: var(--muted);
        font-weight: 400;
        font-size: 14px;
        margin-left: 8px;
      }
      .search-box {
        position: relative;
        flex: 1;
        max-width: 360px;
      }
      .search-box input {
        width: 100%;
        padding: 10px 16px 10px 40px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 10px;
        color: var(--text);
        font-size: 14px;
        outline: none;
        transition: border-color 0.2s;
      }
      .search-box input:focus {
        border-color: var(--accent);
      }
      .search-box svg {
        position: absolute;
        left: 12px;
        top: 50%;
        transform: translateY(-50%);
        width: 18px;
        height: 18px;
        color: var(--muted);
      }
      .count-badge {
        font-size: 13px;
        color: var(--muted);
        white-space: nowrap;
      }
      .count-badge b {
        color: var(--accent);
        font-size: 18px;
      }
      /* Categories */
      .categories {
        max-width: 1200px;
        margin: 0 auto;
        padding: 16px 24px 0;
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .cat-btn {
        padding: 6px 16px;
        border-radius: 20px;
        border: 1px solid var(--border);
        background: var(--card);
        color: var(--muted);
        font-size: 13px;
        cursor: pointer;
        transition: all 0.2s;
      }
      .cat-btn:hover {
        color: var(--text);
        border-color: var(--accent);
      }
      .cat-btn.active {
        background: var(--accent);
        color: #fff;
        border-color: var(--accent);
      }
      /* Grid */
      main {
        max-width: 1200px;
        margin: 0 auto;
        padding: 24px;
      }
      .section-title {
        font-size: 18px;
        font-weight: 700;
        margin: 32px 0 16px;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .section-title::before {
        content: '';
        width: 4px;
        height: 20px;
        border-radius: 2px;
        background: var(--accent);
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 16px;
      }
      .card {
        display: block;
        text-decoration: none;
        color: inherit;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 20px;
        transition: all 0.25s;
        position: relative;
        overflow: hidden;
      }
      .card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 3px;
        background: var(--cat-color, var(--accent));
        opacity: 0;
        transition: opacity 0.25s;
      }
      .card:hover {
        transform: translateY(-4px);
        border-color: var(--cat-color, var(--accent));
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.3);
      }
      .card:hover::before {
        opacity: 1;
      }
      .card-num {
        font-size: 13px;
        font-weight: 700;
        color: var(--muted);
        margin-bottom: 8px;
      }
      .card-title {
        font-size: 16px;
        font-weight: 600;
        margin-bottom: 6px;
      }
      .card-tag {
        display: inline-block;
        font-size: 11px;
        padding: 2px 10px;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.06);
        color: var(--cat-color, var(--accent));
        font-weight: 600;
      }
      .card-arrow {
        position: absolute;
        right: 20px;
        bottom: 20px;
        opacity: 0;
        transition: opacity 0.25s;
        color: var(--cat-color, var(--accent));
      }
      .card:hover .card-arrow {
        opacity: 1;
      }
      .no-result {
        text-align: center;
        padding: 60px;
        color: var(--muted);
        font-size: 16px;
        display: none;
      }
      footer {
        text-align: center;
        padding: 40px;
        color: var(--muted);
        font-size: 13px;
        border-top: 1px solid var(--border);
        margin-top: 40px;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="header-inner">
        <div class="logo">
          HTML5 Demo 合集
          <span>100 个示例</span>
        </div>
        <div class="search-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8" />
            <path d="m21 21-4.3-4.3" />
          </svg>
          <input type="text" id="search" placeholder="搜索 Demo 名称或编号…" />
        </div>
        <div class="count-badge">
          共
          <b>100</b>
          个 Demo
        </div>
      </div>
      <div class="categories" id="categories">
        <button class="cat-btn active" data-cat="all">全部</button>
        <button class="cat-btn" data-cat="1">页面展示</button>
        <button class="cat-btn" data-cat="2">语义化结构</button>
        <button class="cat-btn" data-cat="3">页面模板</button>
        <button class="cat-btn" data-cat="4">CSS 动画</button>
        <button class="cat-btn" data-cat="5">Canvas</button>
        <button class="cat-btn" data-cat="6">SVG</button>
      </div>
    </header>

    <main id="main"></main>
    <div class="no-result" id="noResult">没有找到匹配的 Demo 😢</div>
    <footer>纯 HTML5 实现 · 每个 Demo 均为独立自包含文件 · 可直接在浏览器打开</footer>

        { n: '079', name: 'Canvas 雷达扫描', cat: 5, color: '#06b6d4' },
        { n: '080', name: 'Canvas 地图绘制', cat: 5, color: '#06b6d4' },
        // SVG 81-100
        { n: '081', name: 'SVG 图标制作', cat: 6, color: '#8b5cf6' },
        { n: '082', name: 'SVG Logo 绘制', cat: 6, color: '#8b5cf6' },
        { n: '083', name: 'SVG 加载动画', cat: 6, color: '#8b5cf6' },
        { n: '084', name: 'SVG 进度环', cat: 6, color: '#8b5cf6' },
        { n: '085', name: 'SVG 数据图表', cat: 6, color: '#8b5cf6' },

        { n: '094', name: 'SVG 手写动画', cat: 6, color: '#8b5cf6' },

        { n: '096', name: 'SVG 颜色渐变', cat: 6, color: '#8b5cf6' },
        { n: '097', name: 'SVG 图标库', cat: 6, color: '#8b5cf6' },
        { n: '098', name: 'SVG 插画展示', cat: 6, color: '#8b5cf6' },
        { n: '099', name: 'SVG 动态背景', cat: 6, color: '#8b5cf6' },
        { n: '100', name: 'SVG 创意海报', cat: 6, color: '#8b5cf6' },
      ];

      const catNames = { 1: '页面展示', 2: '语义化结构', 3: '页面模板', 4: 'CSS 动画', 5: 'Canvas', 6: 'SVG' };
      let activeCat = 'all',
        searchTerm = '';

      function folderName(d) {
        return d.n + '-' + d.name;
      }

      function render() {
        const main = document.getElementById('main');
        const filtered = demos.filter((d) => {
          const catOk = activeCat === 'all' || d.cat === activeCat;
          const q = searchTerm.toLowerCase();
          const searchOk = !q || d.name.toLowerCase().includes(q) || d.n.includes(q);
          return catOk && searchOk;
        });
        document.getElementById('noResult').style.display = filtered.length ? 'none' : 'block';

        // group by category
        const groups = {};
        filtered.forEach((d) => {
          if (!groups[d.cat]) groups[d.cat] = [];
          groups[d.cat].push(d);
        });
        const catOrder = activeCat === 'all' ? [1, 2, 3, 4, 5, 6] : [parseInt(activeCat)];

        let html = '';
        catOrder.forEach((c) => {
          if (!groups[c]) return;
          html += `<h2 class="section-title">${catNames[c]}</h2><div class="grid">`;
          groups[c].forEach((d) => {
            const fn = folderName(d);
            html += `<a class="card" href="${fn}/index.html" style="--cat-color:${d.color}" data-name="${d.name}" data-num="${d.n}">
        <div class="card-num">No. ${d.n}</div>
        <div class="card-title">${d.name}</div>
        <span class="card-tag">${catNames[d.cat]}</span>
        <span class="card-arrow">→</span>
      </a>`;
          });
          html += '</div>';
        });
        main.innerHTML = html;
      }

      document.getElementById('search').addEventListener('input', (e) => {
        searchTerm = e.target.value;
        render();
      });
      document.querySelectorAll('.cat-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          document.querySelector('.cat-btn.active').classList.remove('active');
          btn.classList.add('active');
          activeCat = btn.dataset.cat;
          render();
        });
      });
      render();
    </script>
  </body>
</html>
